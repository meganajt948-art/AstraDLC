name: Build AlbaDLC

on:
  push:
    branches:
      - ui-cleanup-2026-10
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/build.gradle'
      - 'CortimDLC_sources_merged (1)/CortimDLC/gradle.properties'
      - 'CortimDLC_sources_merged (1)/CortimDLC/src/**'
      - 'video-data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build AlbaDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle --no-daemon clean build

      - name: Upload client JARs
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0-sources.jar
          if-no-files-found: error
          compression-level: 0

      - name: Publish a downloadable AutoWarden and AutoEnd update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: albadlc-title-click-verify-fix-2026-10-28
          target_commitish: ui-cleanup-2026-10
          name: AlbaDLC title click verifier fix (28 October 2026)
          body: |
            Fixes the latest startup crash, VerifyError in a/jte.method_25402, by no longer rewriting the title menu's click-handler bytecode for utility-icon repositioning. Keeps the earlier fix for the cross-classloader a/PanicShutdown reference, forces the AlbaDLC title screen when vanilla TitleScreen appears, and retains the Discord invite https://discord.gg/aP9dpxM8. Utility icons remain in their original positions for now, with their original hitboxes, to prioritize a launchable client. Does not inject the unstable extra Exit Game renderer.
          prerelease: true
          files: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
