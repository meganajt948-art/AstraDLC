name: Build AlbaDLC

on:
  push:
    branches:
      - ui-cleanup-2026-10
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/build.gradle'
      - 'CortimDLC_sources_merged (1)/CortimDLC/gradle.properties'
      - 'video-data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build AlbaDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle --no-daemon clean build

      - name: Upload client JARs
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0-sources.jar
          if-no-files-found: error
          compression-level: 0
