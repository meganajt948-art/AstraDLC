name: Build AlbaDLC

on:
  push:
    branches:
      - ui-cleanup-2026-10
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/build.gradle'
      - 'CortimDLC_sources_merged (1)/CortimDLC/gradle.properties'
      - 'CortimDLC_sources_merged (1)/CortimDLC/src/**'
      - 'video-data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Remove unavailable WallpaperEntry references from menu bytecode patch
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          source = path.read_text(encoding="utf-8")

          import re

          marker = "// Use the selected wallpaper's accent for Quit, matching the same hover-color transition as other icons."
          if marker not in source:
              raise SystemExit("Expected invalid WallpaperEntry color patch was not found; stopping before build.")
          block_start = source.rfind("\\n", 0, source.index(marker)) + 1
          block_end = source.index('                        if (value instanceof String', block_start)
          source = source[:block_start] + '                        // Keep the built-in power-icon color; WallpaperEntry is not present in runtime flow.jar.\\n' + source[block_end:]

          field_pattern = r'(?m)^[ ]*render\\.visitVarInsn\\(Opcodes\\.ALOAD, 0\\)\\n[ ]*render\\.visitFieldInsn\\(Opcodes\\.GETFIELD, ownerClass, "jug", "La/WallpaperEntry;"\\)\\n[ ]*render\\.visitFieldInsn\\(Opcodes\\.GETFIELD, "a/WallpaperEntry", "accent", "I"\\)'
          source, count = re.subn(field_pattern, '            render.visitLdcInsn(0xFF6B6B)', source)
          path.write_text(source, encoding="utf-8")
          print(f"Removed unavailable WallpaperEntry references; replaced {count} inactive helper field lookups.")
          PY

      - name: Build AlbaDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle --no-daemon clean build

      - name: Upload client JARs
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0-sources.jar
          if-no-files-found: error
          compression-level: 0

      - name: Publish a downloadable AutoWarden and AutoEnd update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: albadlc-no-wallpaperentry-crash-2026-10-28
          target_commitish: ui-cleanup-2026-10
          name: AlbaDLC icon layout crash fix (28 October 2026)
          body: |
            Fixes a rendering crash by removing a runtime reference to a source-only WallpaperEntry class. Retains the launch and click-handler fixes, moves Telegram/Discord to bottom-left and wallpaper/power icons beside the main buttons, synchronizes render/hover/click positions, and fixes the Discord invite to https://discord.gg/aP9dpxM8. The power icon keeps a safe built-in color; no source-only classes are referenced by the runtime menu patch. Does not inject the unstable extra central Quit row.
          prerelease: true
          files: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0-sources.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
