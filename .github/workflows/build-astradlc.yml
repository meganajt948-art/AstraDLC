name: AstraDLC build
# Re-run packaging after branding constant comparison fix
# Ensure the class-name-safe string rebrand is rebuilt
# Rebuild exact-label-only branding patch

on:
  workflow_dispatch:
  push:
    branches: [astra-renaming]
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/**'
      - '.github/workflows/build-astradlc.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build AstraDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle build --no-daemon
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Astra2Dlc-build
          path: 'CortimDLC_sources_merged (1)/CortimDLC/build/libs/*.jar'
