name: AlbaDLC build (original Flow runtime)

on:
  workflow_dispatch:
  push:
    branches: [fix/alba-standalone-source-recovery]
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/**'
      - 'video-data/**'
      - '.github/workflows/build-astradlc.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Fix exit-label renderer descriptor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CortimDLC_sources_merged (1)/CortimDLC/build.gradle")
          lines = p.read_text(encoding="utf-8").splitlines()
          found = False
          for index, line in enumerate(lines):
              if '"(Lnet/minecraft/class_332;Ljava/lang/String;FFI)V", false)' in line:
                  lines[index] = line.replace(
                      '"(Lnet/minecraft/class_332;Ljava/lang/String;FFI)V", false)',
                      '"(Lnet/minecraft/class_332;Ljava/lang/String;FFI)F", false)',
                      1,
                  )
                  indent = lines[index - 1][:len(lines[index - 1]) - len(lines[index - 1].lstrip())]
                  lines.insert(index + 1, indent + "super.visitInsn(Opcodes.POP)")
                  found = True
                  break
              if '"(Lnet/minecraft/class_332;Ljava/lang/String;FFI)F", false)' in line:
                  # It may already be fixed. Ensure POP immediately follows.
                  if index + 1 < len(lines) and "Opcodes.POP" in lines[index + 1]:
                      found = True
                      break
          if not found:
              raise SystemExit("Could not locate exit-label renderer descriptor; aborting instead of building a crashing client.")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Exit label now calls vdn.draw with its float return descriptor and pops the result.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CortimDLC_sources_merged (1)/CortimDLC/build.gradle"
          if ! git diff --cached --quiet; then
            git commit -m "Fix main-menu exit label renderer descriptor"
            git push
          fi

      - name: Build with original nested Flow runtime
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle clean build --no-daemon -PkeepNestedFlowJar --stacktrace

      - name: Verify original runtime remains nested
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("build/libs/AlbaDLC-1.0.0.jar")
          if not artifact.is_file() or artifact.stat().st_size < 1_000_000:
              raise SystemExit(f"Built client JAR is missing or unexpectedly small: {artifact}")
          with zipfile.ZipFile(artifact) as jar:
              entries = set(jar.namelist())
              nested = "META-INF/jars/flow.jar"
              if nested not in entries:
                  raise SystemExit("Original nested runtime is missing: " + nested)
              metadata = json.loads(jar.read("fabric.mod.json"))
              if metadata.get("id") != "albadlc":
                  raise SystemExit("Unexpected outer mod id: " + str(metadata.get("id")))
              if any(name.startswith("a/") and name.endswith(".class") for name in entries):
                  raise SystemExit("Recovered package-a classes leaked into the outer JAR and could shadow the nested runtime")
              nested_bytes = jar.read(nested)
              from io import BytesIO
              with zipfile.ZipFile(BytesIO(nested_bytes)) as core:
                  core_entries = set(core.namelist())
                  if not any(name.startswith("a/") and name.endswith(".class") for name in core_entries):
                      raise SystemExit("Nested original runtime has no package-a classes")
                  if not any(name.startswith("flow/") and name.endswith(".class") for name in core_entries):
                      raise SystemExit("Nested original runtime has no flow package classes")
              print("Verified outer mod:", metadata.get("id"), metadata.get("name"))
              print("Original nested Flow runtime:", nested, len(nested_bytes), "bytes")
              print("Outer JAR entries:", len(entries))
          print("Nested-runtime smoke-check passed:", artifact.stat().st_size, "bytes")
          PY

      - name: Upload AlbaDLC runtime JAR
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-original-Flow-runtime
          path: 'CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar'
          if-no-files-found: error
          compression-level: 0

      - name: Publish downloadable build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: albadlc-flow-runtime-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AlbaDLC original Flow runtime build ${{ github.run_number }}
          body: |
            AlbaDLC for Minecraft 1.21.11, built with the original nested Flow runtime preserved.
            Decompiled/recovered class overlays are disabled by default to avoid replacing working menu/startup classes.
            The main-menu wallpaper panel and social-link URL patches remain in the build.
            CI checks the archive structure; launch testing is still required to confirm runtime behavior.
          prerelease: true
          files: 'CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
