name: AlbaDLC build
# Re-run packaging after branding constant comparison fix
# Ensure the class-name-safe string rebrand is rebuilt
# Rebuild exact-label-only branding patch
# Refine wallpaper filtering to preserve unrequested sunset island wallpaper

on:
  workflow_dispatch:
  push:
    branches: [astra-renaming, ui-cleanup-2026-10, fix/alba-standalone-source-recovery]
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/**'
      - 'video-data/**'
      - '.github/workflows/build-astradlc.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build AstraDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle build --no-daemon -PkeepNestedFlowJar

      - name: Diagnose recovered source compilation (best effort)
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle compileRecoveredJava --no-daemon --stacktrace
        continue-on-error: true

      - name: Smoke-check runtime JAR structure
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          python3 - <<'PY'
          import io
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("build/libs/AlbaDLC-1.0.0.jar")
          if not artifact.is_file() or artifact.stat().st_size < 1_000_000:
              raise SystemExit(f"Built client JAR is missing or unexpectedly small: {artifact}")

          with zipfile.ZipFile(artifact) as jar:
              entries = set(jar.namelist())
              nested_path = "META-INF/jars/flow.jar"
              if nested_path not in entries:
                  raise SystemExit("Runtime JAR is missing its nested Flow client")
              duplicates = sorted(
                  entry for entry in entries
                  if entry.endswith(".class") and (
                      entry.startswith("a/") or entry.startswith("flow/")
                  )
              )
              if duplicates:
                  preview = "\\n".join(duplicates[:20])
                  raise SystemExit(
                      "Unverified recovered classes leaked into the root runtime JAR; "
                      "they can shadow the nested client:\\n" + preview
                  )
              with zipfile.ZipFile(io.BytesIO(jar.read(nested_path))) as nested:
                  try:
                      metadata = json.loads(nested.read("fabric.mod.json"))
                  except (KeyError, json.JSONDecodeError) as exc:
                      raise SystemExit(f"Nested client has invalid Fabric metadata: {exc}")
                  print("Nested client id:", metadata.get("id"))
                  print("Nested client name:", metadata.get("name"))
                  print("Nested client entries:", len(nested.namelist()))
          print("Runtime JAR smoke-check passed:", artifact.stat().st_size, "bytes")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build
          path: 'CortimDLC_sources_merged (1)/CortimDLC/build/libs/*.jar'

# Rebuild Alba assets after fixing Java2D stroke argument types
# Rebuild Wordmark static constants to replace FlowClient in the left menu header
# Rebuild title-screen background separation and direct MP4 input
# Keep client background editor video-first
