name: AlbaDLC build
# Re-run packaging after branding constant comparison fix
# Ensure the class-name-safe string rebrand is rebuilt
# Rebuild exact-label-only branding patch
# Refine wallpaper filtering to preserve unrequested sunset island wallpaper

on:
  workflow_dispatch:
  push:
    branches: [astra-renaming, ui-cleanup-2026-10, fix/alba-standalone-source-recovery]
    paths:
      - 'CortimDLC_sources_merged (1)/CortimDLC/**'
      - 'video-data/**'
      - '.github/workflows/build-astradlc.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile the recovered AlbaDLC Java sources
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle clean compileRecoveredJava --no-daemon

      - name: Package recovered class files
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          project_dir="$PWD"
          mkdir -p "$project_dir/recovered-candidate/tools" "$project_dir/recovered-candidate/classes"
          count="$(find "$project_dir/build/classes/java/recovered" -type f -name '*.class' | wc -l)"
          echo "Recovered compiled class files: $count"
          test "$count" -gt 500
          (cd "$project_dir/build/classes/java/recovered" && zip -qr "$project_dir/recovered-candidate/recovered-named.jar" .)

      - name: Download Fabric remapper and Minecraft mappings
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o "$tools/tiny-remapper.jar"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-v2.jar" -o "$tools/yarn-v2.jar"
          unzip -p "$tools/yarn-v2.jar" mappings/mappings.tiny > "$tools/yarn-v2.tiny"
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o "$tools/version_manifest.json"
          version_url="$(jq -r '.versions[] | select(.id == "1.21.11") | .url' "$tools/version_manifest.json")"
          test -n "$version_url"
          curl -fsSL "$version_url" -o "$tools/minecraft-version.json"
          client_url="$(jq -r '.downloads.client.url' "$tools/minecraft-version.json")"
          test -n "$client_url"
          curl -fL --retry 3 "$client_url" -o "$tools/minecraft-official.jar"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.11/intermediary-1.21.11-v2.jar" -o "$tools/intermediary-v2.jar"
          unzip -p "$tools/intermediary-v2.jar" mappings/mappings.tiny > "$tools/intermediary.tiny"
          test -s "$tools/tiny-remapper.jar"
          test -s "$tools/yarn-v2.tiny"
          test -s "$tools/intermediary.tiny"

      - name: Build Minecraft named classpath
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$tools/minecraft-official.jar" "$tools/minecraft-intermediary.jar" \
            "$tools/intermediary.tiny" official intermediary --ignoreConflicts
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$tools/minecraft-intermediary.jar" "$tools/minecraft-named.jar" \
            "$tools/yarn-v2.tiny" intermediary named --ignoreConflicts
          test -s "$tools/minecraft-named.jar"

      - name: Remap recovered classes to Fabric intermediary names
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$PWD/recovered-candidate/recovered-named.jar" \
            "$PWD/recovered-candidate/recovered-intermediary.jar" \
            "$tools/yarn-v2.tiny" named intermediary "$tools/minecraft-named.jar" --resolveMissing
          unzip -oq "$PWD/recovered-candidate/recovered-intermediary.jar" -d "$PWD/recovered-candidate/classes"
          count="$(find "$PWD/recovered-candidate/classes" -type f -name '*.class' | wc -l)"
          echo "Remapped recovered class files: $count"
          test "$count" -gt 500

      - name: Build standalone AlbaDLC with recovered classes
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle build --no-daemon -PrecoveredCandidateDir=recovered-candidate/classes

      - name: Smoke-check standalone runtime JAR structure
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("build/libs/AlbaDLC-1.0.0.jar")
          if not artifact.is_file() or artifact.stat().st_size < 1_000_000:
              raise SystemExit(f"Built client JAR is missing or unexpectedly small: {artifact}")

          def as_list(value):
              if value is None:
                  return []
              return value if isinstance(value, list) else [value]

          with zipfile.ZipFile(artifact) as jar:
              entries = set(jar.namelist())
              nested_path = "META-INF/jars/flow.jar"
              if nested_path in entries or any(name.endswith("/flow.jar") for name in entries):
                  raise SystemExit("Standalone runtime still contains flow.jar")
              try:
                  metadata = json.loads(jar.read("fabric.mod.json"))
              except (KeyError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"Standalone runtime has invalid Fabric metadata: {exc}")
              if metadata.get("id") != "albadlc":
                  raise SystemExit(f"Unexpected root Fabric mod id: {metadata.get('id')}")
              if not any(name.startswith("a/") and name.endswith(".class") for name in entries):
                  raise SystemExit("Standalone runtime is missing package-a classes")
              if not any(name.startswith("flow/") and name.endswith(".class") for name in entries):
                  raise SystemExit("Standalone runtime is missing recovered flow classes")
              for item in as_list(metadata.get("jars")):
                  nested = item.get("file") if isinstance(item, dict) else item
                  if nested and nested not in entries:
                      raise SystemExit(f"fabric.mod.json references missing nested JAR: {nested}")
              for group in (metadata.get("entrypoints") or {}).values():
                  for spec in as_list(group):
                      if isinstance(spec, str):
                          class_name = spec.split("::", 1)[0]
                      elif isinstance(spec, dict) and isinstance(spec.get("value"), str):
                          class_name = spec["value"].split("::", 1)[0]
                      else:
                          continue
                      entrypoint = class_name.replace(".", "/") + ".class"
                      if entrypoint not in entries:
                          raise SystemExit("Missing Fabric entrypoint class: " + entrypoint)
              print("Standalone Fabric id:", metadata.get("id"))
              print("Standalone display name:", metadata.get("name"))
              print("Root class entries:", sum(name.endswith(".class") for name in entries))
          print("Standalone runtime JAR smoke-check passed:", artifact.stat().st_size, "bytes")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build
          path: 'CortimDLC_sources_merged (1)/CortimDLC/build/libs/*.jar'

# Rebuild Alba assets after fixing Java2D stroke argument types
# Rebuild Wordmark static constants to replace FlowClient in the left menu header
# Rebuild title-screen background separation and direct MP4 input
# Keep client background editor video-first
