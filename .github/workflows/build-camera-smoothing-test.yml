name: Build camera smoothing test

on:
  push:
    branches:
      - fix/camera-smoothing-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build AlbaDLC
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle --no-daemon clean build

      - name: Upload built client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-camera-smoothing-test
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-build-diagnostics
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/reports/
            CortimDLC_sources_merged (1)/CortimDLC/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
