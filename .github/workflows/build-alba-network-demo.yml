name: Build Alba Network demo EXE

on:
  push:
    branches: [alba-network-demo]
    paths:
      - "AlbaNetworkDemo/**"
      - ".github/workflows/build-alba-network-demo.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install WiX Toolset for EXE installer
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Compile application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, input, installer | Out-Null
          javac -encoding UTF-8 -d out AlbaNetworkDemo/src/AlbaNetworkDemo.java
          jar --create --file input/AlbaNetworkDemo.jar --main-class AlbaNetworkDemo -C out .
      - name: Package Windows EXE installer
        shell: pwsh
        run: |
          jpackage --type exe --name AlbaNetworkDemo --app-version 1.0.0 --input input --main-jar AlbaNetworkDemo.jar --main-class AlbaNetworkDemo --dest installer --win-menu --win-shortcut
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AlbaNetworkDemo-Windows-EXE
          path: installer/*.exe
          if-no-files-found: error
