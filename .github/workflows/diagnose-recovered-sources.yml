name: Diagnose recovered AlbaDLC sources

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/diagnose-recovered-sources.yml'

permissions:
  contents: read

jobs:
  compile-recovered:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify recovered sources are present
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          count="$(find src/recovered-flow-vineflower/java -type f -name '*.java' | wc -l)"
          echo "Recovered Java files: $count"
          test "$count" -gt 0

      - name: Compile the recovered source tree
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle compileRecoveredJava --no-daemon --stacktrace

# Compile the latest source tree after top-level switch-label splitting.
