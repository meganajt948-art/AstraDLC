name: Recover Flow sources with Vineflower

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/recover-flow-vineflower.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download original Flow JAR
        run: |
          curl -fL --retry 3 "https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar" -o flow.jar
          test -s flow.jar
          ls -lh flow.jar

      - name: Download TinyRemapper and Yarn mappings
        run: |
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o tiny-remapper.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-v2.jar" -o yarn-v2.jar
          unzip -p yarn-v2.jar mappings/mappings.tiny > yarn-v2.tiny
          test -s tiny-remapper.jar
          test -s yarn-v2.tiny
          head -n 1 yarn-v2.tiny

      - name: Download Minecraft intermediary classpath
        run: |
          version_url="$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id == "1.21.11") | .url')"
          test -n "$version_url"
          client_url="$(curl -fsSL "$version_url" | jq -r '.downloads.client.url')"
          test -n "$client_url"
          curl -fL --retry 3 "$client_url" -o minecraft-official.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.11/intermediary-1.21.11-v2.jar" -o intermediary-v2.jar
          unzip -p intermediary-v2.jar mappings/mappings.tiny > intermediary.tiny
          test -s minecraft-official.jar
          test -s intermediary.tiny
          head -n 1 intermediary.tiny

      - name: Remap Minecraft client to intermediary namespace
        run: |
          java -Xmx3g -jar tiny-remapper.jar minecraft-official.jar minecraft-intermediary.jar intermediary.tiny official intermediary --ignoreConflicts
          test -s minecraft-intermediary.jar

      - name: Remap Flow and Minecraft classpath to Yarn names
        run: |
          java -Xmx2g -jar tiny-remapper.jar flow.jar flow-named.jar yarn-v2.tiny intermediary named minecraft-intermediary.jar --resolveMissing
          java -Xmx3g -jar tiny-remapper.jar minecraft-intermediary.jar minecraft-named.jar yarn-v2.tiny intermediary named --ignoreConflicts
          test -s flow-named.jar
          test -s minecraft-named.jar

      - name: Download Vineflower 1.12.0
        run: |
          curl -fL --retry 3 "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar" -o vineflower.jar
          test -s vineflower.jar

      - name: Decompile remapped Flow with Minecraft classpath
        run: |
          mkdir -p recovered-flow-vineflower
          java -Xmx4g -jar vineflower.jar --add-external=minecraft-named.jar --decompiler-comments=0 flow-named.jar recovered-flow-vineflower
          echo "Vineflower Java files: $(find recovered-flow-vineflower -type f -name '*.java' | wc -l)"
          if grep -R -n -m 1 'import net\.minecraft\.class_' recovered-flow-vineflower --include='*.java'; then
            echo "Intermediary Minecraft class imports remain after remapping."
            exit 1
          fi

      - name: Stage recovered Java sources in project
        shell: bash
        run: |
          target="CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          mkdir -p "$target"
          find recovered-flow-vineflower -type f -name '*.java' -print0 | while IFS= read -r -d '' src; do
            rel="${src#recovered-flow-vineflower/}"
            mkdir -p "$target/$(dirname "$rel")"
            cp "$src" "$target/$rel"
          done
          echo "Recovered Java files: $(find "$target" -type f -name '*.java' | wc -l)"

      - name: Package source-only artifact
        run: |
          cd "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower"
          zip -qr "$GITHUB_WORKSPACE/flow-vineflower-java-sources.zip" java

      - name: Upload recovered Java sources
        uses: actions/upload-artifact@v4
        with:
          name: flow-vineflower-java-sources
          path: flow-vineflower-java-sources.zip

      - name: Commit recovered Java sources to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          if git diff --cached --quiet; then
            echo "Recovered sources are already up to date."
          else
            git commit -m "Add Vineflower 1.12-recovered Flow Java sources"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
