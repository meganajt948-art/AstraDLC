name: Recover Flow sources with Vineflower

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/recover-flow-vineflower.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download original Flow JAR
        run: |
          curl -fL --retry 3 "https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar" -o flow.jar
          test -s flow.jar
          ls -lh flow.jar

      - name: Download TinyRemapper and Yarn mappings
        run: |
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o tiny-remapper.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-v2.jar" -o yarn-v2.jar
          unzip -p yarn-v2.jar mappings/mappings.tiny > yarn-v2.tiny
          test -s tiny-remapper.jar
          test -s yarn-v2.tiny
          head -n 1 yarn-v2.tiny

      - name: Download Minecraft intermediary classpath
        run: |
          version_url="$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id == "1.21.11") | .url')"
          test -n "$version_url"
          client_url="$(curl -fsSL "$version_url" | jq -r '.downloads.client.url')"
          test -n "$client_url"
          curl -fL --retry 3 "$client_url" -o minecraft-official.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.11/intermediary-1.21.11-v2.jar" -o intermediary-v2.jar
          unzip -p intermediary-v2.jar mappings/mappings.tiny > intermediary.tiny
          test -s minecraft-official.jar
          test -s intermediary.tiny
          head -n 1 intermediary.tiny

      - name: Remap Minecraft client to intermediary namespace
        run: |
          java -Xmx3g -jar tiny-remapper.jar minecraft-official.jar minecraft-intermediary.jar intermediary.tiny official intermediary --ignoreConflicts
          test -s minecraft-intermediary.jar

      - name: Remap Flow and Minecraft classpath to Yarn names
        run: |
          java -Xmx2g -jar tiny-remapper.jar flow.jar flow-named.jar yarn-v2.tiny intermediary named minecraft-intermediary.jar --resolveMissing
          java -Xmx3g -jar tiny-remapper.jar minecraft-intermediary.jar minecraft-named.jar yarn-v2.tiny intermediary named --ignoreConflicts
          test -s flow-named.jar
          test -s minecraft-named.jar

      - name: Download Vineflower 1.12.0
        run: |
          curl -fL --retry 3 "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar" -o vineflower.jar
          test -s vineflower.jar

      - name: Decompile remapped Flow with Minecraft classpath
        run: |
          mkdir -p recovered-flow-vineflower
          java -Xmx4g -jar vineflower.jar --add-external=minecraft-named.jar --decompiler-comments=0 flow-named.jar recovered-flow-vineflower
          echo "Vineflower Java files: $(find recovered-flow-vineflower -type f -name '*.java' | wc -l)"
          if grep -R -n -m 1 'import net\.minecraft\.class_' recovered-flow-vineflower --include='*.java'; then
            echo "Intermediary Minecraft class imports remain after remapping."
            exit 1
          fi

      - name: Normalize record declarations for Java source compilation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("recovered-flow-vineflower")
          record_re = re.compile(r"\brecord\s+([A-Za-z_$][A-Za-z0-9_$]*)\s*(?:<[^{};]+>\s*)?\(")

          def matching_delimiter(source, start, opening, closing):
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ""
                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                  elif block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 1
                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  elif ch == "/" and nxt == "/":
                      line_comment = True
                      i += 1
                  elif ch == "/" and nxt == "*":
                      block_comment = True
                      i += 1
                  elif ch in ("'", '"'):
                      quote = ch
                  elif ch == opening:
                      depth += 1
                  elif ch == closing:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def switch_case_sections(body):
              labels = []
              i = 0
              brace_depth = 0
              paren_depth = 0
              bracket_depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(body):
                  ch = body[i]
                  nxt = body[i + 1] if i + 1 < len(body) else ""
                  if line_comment:
                      if ch == "\n":
                          line_comment = False
                  elif block_comment:
                      if ch == "*" and nxt == "/":
                          block_comment = False
                          i += 1
                  elif quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                  elif ch == "/" and nxt == "/":
                      line_comment = True
                      i += 1
                  elif ch == "/" and nxt == "*":
                      block_comment = True
                      i += 1
                  elif ch in ("'", '"'):
                      quote = ch
                  elif brace_depth == 0 and paren_depth == 0 and bracket_depth == 0:
                      match = re.match(r"(case|default)\b", body[i:])
                      if match and (i == 0 or not (body[i - 1].isalnum() or body[i - 1] in "_$")):
                          kind = match.group(1)
                          label_start = i + len(kind)
                          j = label_start
                          lp = lb = lc = 0
                          q = None
                          esc = False
                          line_c = block_c = False
                          delimiter = None
                          while j < len(body):
                              c = body[j]
                              nn = body[j + 1] if j + 1 < len(body) else ""
                              if line_c:
                                  if c == "\n": line_c = False
                              elif block_c:
                                  if c == "*" and nn == "/":
                                      block_c = False
                                      j += 1
                              elif q is not None:
                                  if esc: esc = False
                                  elif c == "\\": esc = True
                                  elif c == q: q = None
                              elif c == "/" and nn == "/":
                                  line_c = True
                                  j += 1
                              elif c == "/" and nn == "*":
                                  block_c = True
                                  j += 1
                              elif c in ("'", '"'):
                                  q = c
                              elif c == "(": lp += 1
                              elif c == ")": lp -= 1
                              elif c == "[": lb += 1
                              elif c == "]": lb -= 1
                              elif c == "{": lc += 1
                              elif c == "}": lc -= 1
                              elif lp == 0 and lb == 0 and lc == 0 and c == ":":
                                  delimiter = ":"
                                  break
                              elif lp == 0 and lb == 0 and lc == 0 and c == "-" and nn == ">":
                                  delimiter = "->"
                                  break
                              j += 1
                          if delimiter:
                              labels.append((i, kind, body[label_start:j].strip(), delimiter, j + len(delimiter)))
                              i = j + len(delimiter)
                              continue
                  if ch == "{": brace_depth += 1
                  elif ch == "}": brace_depth -= 1
                  elif ch == "(": paren_depth += 1
                  elif ch == ")": paren_depth -= 1
                  elif ch == "[": bracket_depth += 1
                  elif ch == "]": bracket_depth -= 1
                  i += 1

              sections = []
              for index, label in enumerate(labels):
                  next_pos = labels[index + 1][0] if index + 1 < len(labels) else len(body)
                  sections.append({
                      "kind": label[1],
                      "label": label[2],
                      "delimiter": label[3],
                      "body": body[label[4]:next_pos].strip()
                  })
              return sections


          def split_case_labels(label):
              values = []
              start = 0
              paren = bracket = brace = 0
              quote = None
              escaped = False
              for i, ch in enumerate(label):
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == "\\":
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "(": paren += 1
                  elif ch == ")": paren -= 1
                  elif ch == "[": bracket += 1
                  elif ch == "]": bracket -= 1
                  elif ch == "{": brace += 1
                  elif ch == "}": brace -= 1
                  elif ch == "," and paren == 0 and bracket == 0 and brace == 0:
                      values.append(label[start:i].strip())
                      start = i + 1
              values.append(label[start:].strip())
              return [value for value in values if value]

          def normalize_dynamic_switches(source):
              attempts = 0
              while attempts < 200:
                  attempts += 1
                  candidates = []
                  for match in re.finditer(r"\bswitch\s*\(", source):
                      paren_open = source.find("(", match.start())
                      paren_close = matching_delimiter(source, paren_open, "(", ")")
                      if paren_close < 0:
                          continue
                      brace_open = source.find("{", paren_close + 1)
                      if brace_open < 0:
                          continue
                      brace_close = matching_delimiter(source, brace_open, "{", "}")
                      if brace_close < 0:
                          continue
                      body = source[brace_open + 1:brace_close]
                      if not re.search(r"\bcase\s+a\.[A-Za-z_$][A-Za-z0-9_$]*\s*\(", body):
                          continue
                      sections = switch_case_sections(body)
                      if sections and all(section["delimiter"] == "->" for section in sections):
                          mode = "expression"
                      elif sections and all(section["delimiter"] == ":" for section in sections):
                          mode = "statement"
                      else:
                          continue
                      candidates.append((match.start(), paren_open, paren_close, brace_open, brace_close, body, sections, mode))
                  if not candidates:
                      break
                  sw_start, paren_open, paren_close, brace_open, brace_close, body, sections, mode = max(candidates, key=lambda item: item[0])
                  selector = source[paren_open + 1:paren_close].strip()
                  if not selector:
                      break

                  if mode == "statement":
                      indent = re.match(r"[ \t]*", source[source.rfind("\n", 0, sw_start) + 1:sw_start]).group(0)
                      output = []
                      has_default = any(section["kind"] == "default" for section in sections)
                      for index, section in enumerate(sections):
                          case_body = re.sub(r"\bbreak\s*;\s*$", "", section["body"]).strip()
                          if section["kind"] == "default":
                              output.append(indent + "else {")
                          else:
                              labels = [label.strip() for label in split_case_labels(section["label"])]
                              condition = " || ".join("java.util.Objects.equals(" + selector + ", " + label + ")" for label in labels)
                              output.append(indent + ("if" if index == 0 else "else if") + " (" + condition + ") {")
                          if case_body:
                              output.extend(indent + "   " + line for line in case_body.splitlines())
                          output.append(indent + "}")
                      if not has_default and not output:
                          break
                      replacement = "\n".join(output)
                      source = source[:sw_start] + replacement + source[brace_close + 1:]
                  else:
                      prefix_start = max(source.rfind(";", 0, sw_start), source.rfind("{", 0, sw_start), source.rfind("}", 0, sw_start)) + 1
                      prefix = source[prefix_start:sw_start]
                      stripped_prefix = prefix.strip()
                      indent_match = re.search(r"(?:^|\n)([ \t]*)\S", prefix)
                      indent = indent_match.group(1) if indent_match else ""
                      is_return = stripped_prefix == "return"
                      declaration = None
                      target = None
                      if not is_return:
                          eq = stripped_prefix.rfind("=")
                          if eq < 0:
                              break
                          left = stripped_prefix[:eq].strip()
                          if not left:
                              break
                          decl_match = re.fullmatch(r"(.+)\s+([A-Za-z_$][A-Za-z0-9_$]*)", left)
                          if decl_match:
                              typ, name = decl_match.group(1).strip(), decl_match.group(2)
                              if typ[:1].isupper() or "[]" in typ or "<" in typ or typ in {"byte", "short", "int", "long", "float", "double", "boolean", "char", "var"}:
                                  declaration = typ + " " + name + ";"
                                  target = name
                          if target is None:
                              target = left

                      output = []
                      if declaration:
                          output.append(indent + declaration)
                      for index, section in enumerate(sections):
                          expr = section["body"].strip()
                          if not expr or "yield " in expr or expr.startswith("{"):
                              output = []
                              break
                          expr = re.sub(r";\s*$", "", expr).strip()
                          if section["kind"] == "default":
                              output.append(indent + "else {")
                          else:
                              labels = [label.strip() for label in split_case_labels(section["label"])]
                              condition = " || ".join("java.util.Objects.equals(" + selector + ", " + label + ")" for label in labels)
                              output.append(indent + ("if" if index == 0 else "else if") + " (" + condition + ") {")
                          if expr.startswith("throw "):
                              statement = expr + ";"
                          elif is_return:
                              statement = "return " + expr + ";"
                          else:
                              statement = target + " = " + expr + ";"
                          output.append(indent + "   " + statement)
                          output.append(indent + "}")
                      if not output:
                          break
                      replacement = "\n".join(output)
                      replace_start = prefix_start + len(prefix) - len(prefix.lstrip())
                      replace_end = brace_close + 1
                      while replace_end < len(source) and source[replace_end].isspace():
                          replace_end += 1
                      if replace_end < len(source) and source[replace_end] == ";":
                          replace_end += 1
                      source = source[:replace_start] + replacement + source[replace_end:]
              return source

          def normalize_string_switches(source, file):
              if file.name == "wkw.java":
                  pattern = re.compile(r"(?m)^([ \t]*)float\s+(\w+)\s*=\s*switch\s*\((\w+)\)\s*\{(.*?)^\s*\};", re.S)
              elif file.name == "wlk.java":
                  pattern = re.compile(r"(?m)^([ \t]*)return\s+switch\s*\((\w+)\)\s*\{(.*?)^\s*\};", re.S)
              else:
                  return source

              def convert(match):
                  indent = match.group(1)
                  if file.name == "wkw.java":
                      target, switch_value, body = match.group(2), match.group(3), match.group(4)
                  else:
                      target, switch_value, body = None, match.group(2), match.group(3)
                  cases = []
                  default_value = None
                  for line in body.splitlines():
                      item = line.strip()
                      if item.startswith("case ") and "->" in item:
                          label, value = item[5:].split("->", 1)
                          cases.append((label.strip(), value.strip().removesuffix(";").strip()))
                      elif item.startswith("default") and "->" in item:
                          default_value = item.split("->", 1)[1].strip().removesuffix(";").strip()
                  if not cases or not any(re.match(r"a\.[bcd]\(", label) for label, _ in cases) or default_value is None:
                      return match.group(0)
                  output = []
                  if target is not None:
                      output.append(indent + "float " + target + ";")
                  for index, (label, value) in enumerate(cases):
                      keyword = "if" if index == 0 else "else if"
                      output.append(indent + keyword + " (" + switch_value + ".equals(" + label + ")) {")
                      if target is None:
                          output.append(indent + "   return " + value + ";")
                      else:
                          output.append(indent + "   " + target + " = " + value + ";")
                      output.append(indent + "}")
                  output.append(indent + "else {")
                  if target is None:
                      output.append(indent + "   return " + default_value + ";")
                  else:
                      output.append(indent + "   " + target + " = " + default_value + ";")
                  output.append(indent + "}")
                  return "\n".join(output)

              return pattern.sub(convert, source)

          converted = 0
          widened_members = 0
          for file in root.rglob("*.java"):
              source = file.read_text(encoding="utf-8")
              original_source = source
              source = normalize_string_switches(source, file)
              source = normalize_dynamic_switches(source)
              cursor = 0
              changed = source != original_source
              while True:
                  match = record_re.search(source, cursor)
                  if not match:
                      break
                  open_paren = source.find("(", match.start(), match.end())
                  depth = 0
                  close_paren = -1
                  for pos in range(open_paren, len(source)):
                      char = source[pos]
                      if char == "(":
                          depth += 1
                      elif char == ")":
                          depth -= 1
                          if depth == 0:
                              close_paren = pos
                              break
                  if close_paren < 0:
                      cursor = match.end()
                      continue
                  brace = source.find("{", close_paren + 1)
                  if brace < 0:
                      cursor = close_paren + 1
                      continue
                  body = source[brace + 1:brace + 900]
                  first_blank = body.find("\n\n")
                  initial_members = body if first_blank < 0 else body[:first_blank]
                  # Vineflower 1.12 emits record components plus duplicate explicit instance fields.
                  # javac rejects those duplicate fields in a record; converting only these
                  # declarations to ordinary final classes preserves the recovered constructor
                  # and accessor implementations while making the source structurally valid.
                  has_duplicate_fields = re.search(r"(?m)^\s*private\s+final\s+[^;\n]+;\s*$", initial_members) is not None
                  if not has_duplicate_fields:
                      cursor = close_paren + 1
                      continue
                  class_name = match.group(1)
                  source = source[:match.start()] + "final class " + class_name + source[close_paren + 1:]
                  cursor = match.start() + len("final class " + class_name)
                  converted += 1
                  changed = True
              if file.parent.name == "a":
                  # The obfuscator flattened nestmate/bridge access into separate top-level
                  # source files. Package-private access restores the access allowed by the
                  # original nestmate bytecode and keeps the recovered implementation usable.
                  source, access_count = re.subn(r"(?m)^(\s*)private\s+", r"\1", source)
                  if access_count:
                      widened_members += access_count
                      changed = True
              if changed:
                  file.write_text(source, encoding="utf-8")
          print("Normalized record declarations with duplicate component fields:", converted)
          print("Widened private members in obfuscated package a:", widened_members)
          PY

      - name: Stage recovered Java sources in project
        shell: bash
        run: |
          target="CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          mkdir -p "$target"
          find recovered-flow-vineflower -type f -name '*.java' -print0 | while IFS= read -r -d '' src; do
            rel="${src#recovered-flow-vineflower/}"
            mkdir -p "$target/$(dirname "$rel")"
            cp "$src" "$target/$rel"
          done
          echo "Recovered Java files: $(find "$target" -type f -name '*.java' | wc -l)"

      - name: Package source-only artifact
        run: |
          cd "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower"
          zip -qr "$GITHUB_WORKSPACE/flow-vineflower-java-sources.zip" java

      - name: Upload recovered Java sources
        uses: actions/upload-artifact@v4
        with:
          name: flow-vineflower-java-sources
          path: flow-vineflower-java-sources.zip

      - name: Commit recovered Java sources to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          if git diff --cached --quiet; then
            echo "Recovered sources are already up to date."
          else
            git commit -m "Add Vineflower 1.12-recovered Flow Java sources"
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              echo "Resolving generated-source conflicts in favor of the freshly regenerated source tree."
              conflicted="$(git diff --name-only --diff-filter=U)"
              if [ -z "$conflicted" ]; then
                echo "Rebase failed without source conflicts; stopping."
                exit 1
              fi
              while IFS= read -r file; do
                git checkout --theirs -- "$file"
                git add "$file"
              done <<< "$conflicted"
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
