name: Recover Flow sources with CFR

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/recover-flow-vineflower.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download original Flow JAR
        run: |
          curl -fL --retry 3 "https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar" -o flow.jar
          test -s flow.jar
          ls -lh flow.jar
      - name: Download TinyRemapper and Yarn v2 mappings
        run: |
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o tiny-remapper.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-v2.jar" -o yarn-v2.jar
          unzip -p yarn-v2.jar mappings/mappings.tiny > yarn-v2.tiny
          test -s tiny-remapper.jar
          test -s yarn-v2.tiny
          head -n 1 yarn-v2.tiny
          grep -q 
      - name: Download CFR
        run: |
          curl -fL --retry 3 "https://www.benf.org/other/cfr/cfr-0.152.jar" -o cfr.jar
          test -s cfr.jar
      - name: Decompile remapped Flow
        run: |
          mkdir -p recovered-flow-cfr
          java -Xmx4g -jar cfr.jar flow-named.jar --outputdir recovered-flow-cfr --silent true
          find recovered-flow-cfr -type f -name '*.java' | wc -l
          if grep -R -n -m 1 'import net\.minecraft\.class_' recovered-flow-cfr --include='*.java'; then
            echo "Intermediary Minecraft imports remain after remapping; refusing to stage this source set."
            exit 1
          fi
      - name: Stage recovered Java sources in project
        shell: bash
        run: |
          target="CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-cfr/java"
          mkdir -p "$target"
          find recovered-flow-cfr -type f -name '*.java' -print0 | while IFS= read -r -d '' src; do
            rel="${src#recovered-flow-cfr/}"
            mkdir -p "$target/$(dirname "$rel")"
            cp "$src" "$target/$rel"
          done
          echo "Recovered Java files: $(find "$target" -type f -name '*.java' | wc -l)"
      - name: Package source-only artifact
        run: |
          cd "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-cfr"
          zip -qr "$GITHUB_WORKSPACE/flow-cfr-java-sources.zip" java
      - name: Upload recovered Java sources
        uses: actions/upload-artifact@v4
        with:
          name: flow-cfr-java-sources
          path: flow-cfr-java-sources.zip
      - name: Commit recovered Java sources to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-cfr/java"
          if git diff --cached --quiet; then
            echo "Recovered sources are already up to date."
          else
            git commit -m "Add full CFR-recovered Flow Java sources"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
