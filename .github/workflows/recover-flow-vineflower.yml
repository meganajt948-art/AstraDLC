name: Recover Flow sources with Vineflower

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/recover-flow-vineflower.yml'

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download original Flow JAR
        run: |
          curl -fL --retry 3 "https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar" -o flow.jar
          test -s flow.jar
          ls -lh flow.jar
      - name: Download TinyRemapper and Yarn mappings
        run: |
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o tiny-remapper.jar
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-tiny.gz" -o yarn.tiny.gz
          gzip -dc yarn.tiny.gz > yarn.tiny
          test -s tiny-remapper.jar
          test -s yarn.tiny
          head -n 1 yarn.tiny
      - name: Remap client classes to Yarn names
        run: |
          java -Xmx2g -jar tiny-remapper.jar flow.jar flow-named.jar yarn.tiny intermediary named --resolveMissing
          test -s flow-named.jar
      - name: Download Vineflower
        run: |
          curl -fL --retry 3 "https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar" -o vineflower.jar
          test -s vineflower.jar
      - name: Decompile remapped Flow
        run: |
          mkdir -p recovered-flow-vineflower
          java -Xmx4g -jar vineflower.jar flow-named.jar recovered-flow-vineflower
          find recovered-flow-vineflower -type f -name '*.java' | wc -l
          if grep -R -n -m 1 'net\.minecraft\.class_' recovered-flow-vineflower --include='*.java'; then
            echo "Intermediary Minecraft class names remain after remapping; refusing to stage this source set."
            exit 1
          fi
      - name: Stage recovered Java sources in project
        shell: bash
        run: |
          target="CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          mkdir -p "$target"
          find recovered-flow-vineflower -type f -name '*.java' -print0 | while IFS= read -r -d '' src; do
            rel="${src#recovered-flow-vineflower/}"
            mkdir -p "$target/$(dirname "$rel")"
            cp "$src" "$target/$rel"
          done
          echo "Recovered Java files: $(find "$target" -type f -name '*.java' | wc -l)"
      - name: Package source-only artifact
        run: |
          cd "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower"
          zip -qr "$GITHUB_WORKSPACE/flow-vineflower-java-sources.zip" java
      - name: Upload recovered Java sources
        uses: actions/upload-artifact@v4
        with:
          name: flow-vineflower-java-sources
          path: flow-vineflower-java-sources.zip
      - name: Commit recovered Java sources to the migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "CortimDLC_sources_merged (1)/CortimDLC/src/recovered-flow-vineflower/java"
          if git diff --cached --quiet; then
            echo "Recovered sources are already up to date."
          else
            git commit -m "Add full Vineflower-recovered Flow Java sources"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
