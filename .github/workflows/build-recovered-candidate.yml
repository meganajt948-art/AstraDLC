name: Build recovered-source AlbaDLC candidate

# Rebuild the standalone client after the keybind HUD empty-state fix.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/alba-standalone-source-recovery
    paths:
      - '.github/workflows/build-recovered-candidate.yml'
      - 'CortimDLC_sources_merged (1)/CortimDLC/src/main/java/a/**'
      - 'CortimDLC_sources_merged (1)/CortimDLC/src/main/java/flow/**'
      - 'CortimDLC_sources_merged (1)/CortimDLC/src/main/resources/**'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile the full recovered Java source tree
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle clean compileRecoveredJava --no-daemon

      - name: Package named compiled class set
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          project_dir="$PWD"
          mkdir -p "$project_dir/recovered-candidate/tools" "$project_dir/recovered-candidate/classes"
          count="$(find "$project_dir/build/classes/java/recovered" -type f -name '*.class' | wc -l)"
          echo "Recovered compiled class files: $count"
          test "$count" -gt 500
          (cd "$project_dir/build/classes/java/recovered" && zip -qr "$project_dir/recovered-candidate/recovered-named.jar" .)

      - name: Download remapper, Yarn mappings and Minecraft classpath
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar" -o "$tools/tiny-remapper.jar"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.1/yarn-1.21.11+build.1-v2.jar" -o "$tools/yarn-v2.jar"
          unzip -p "$tools/yarn-v2.jar" mappings/mappings.tiny > "$tools/yarn-v2.tiny"

          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o "$tools/version_manifest.json"
          version_url="$(jq -r '.versions[] | select(.id == "1.21.11") | .url' "$tools/version_manifest.json")"
          test -n "$version_url"
          curl -fsSL "$version_url" -o "$tools/minecraft-version.json"
          client_url="$(jq -r '.downloads.client.url' "$tools/minecraft-version.json")"
          test -n "$client_url"
          curl -fL --retry 3 "$client_url" -o "$tools/minecraft-official.jar"
          curl -fL --retry 3 "https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.11/intermediary-1.21.11-v2.jar" -o "$tools/intermediary-v2.jar"
          unzip -p "$tools/intermediary-v2.jar" mappings/mappings.tiny > "$tools/intermediary.tiny"
          test -s "$tools/tiny-remapper.jar"
          test -s "$tools/yarn-v2.tiny"
          test -s "$tools/intermediary.tiny"

      - name: Build Minecraft named classpath
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$tools/minecraft-official.jar" "$tools/minecraft-intermediary.jar" \
            "$tools/intermediary.tiny" official intermediary --ignoreConflicts
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$tools/minecraft-intermediary.jar" "$tools/minecraft-named.jar" \
            "$tools/yarn-v2.tiny" intermediary named --ignoreConflicts
          test -s "$tools/minecraft-named.jar"

      - name: Remap recovered classes to Fabric intermediary names
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          tools="$PWD/recovered-candidate/tools"
          java -Xmx3g -jar "$tools/tiny-remapper.jar" \
            "$PWD/recovered-candidate/recovered-named.jar" \
            "$PWD/recovered-candidate/recovered-intermediary.jar" \
            "$tools/yarn-v2.tiny" named intermediary "$tools/minecraft-named.jar" --resolveMissing
          unzip -oq "$PWD/recovered-candidate/recovered-intermediary.jar" -d "$PWD/recovered-candidate/classes"
          count="$(find "$PWD/recovered-candidate/classes" -type f -name '*.class' | wc -l)"
          echo "Remapped recovered class files: $count"
          test "$count" -gt 500

      - name: Build candidate with recovered classes inside the nested client
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: gradle build --no-daemon -PrecoveredCandidateDir=recovered-candidate/classes

      - name: Verify candidate stays nested and has a Fabric mod descriptor
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          python3 - <<'PY'
          import io
          import json
          import zipfile
          from pathlib import Path

          artifact = Path("build/libs/AlbaDLC-1.0.0.jar")
          with zipfile.ZipFile(artifact) as jar:
              names = set(jar.namelist())
              nested_path = "META-INF/jars/flow.jar"
              if nested_path not in names:
                  raise SystemExit("Candidate lost the nested client container")
              roots = [
                  name for name in names
                  if name.endswith(".class") and (name.startswith("a/") or name.startswith("flow/"))
              ]
              if roots:
                  raise SystemExit("Recovered classes leaked into outer JAR: " + ", ".join(roots[:10]))
              with zipfile.ZipFile(io.BytesIO(jar.read(nested_path))) as nested:
                  metadata = json.loads(nested.read("fabric.mod.json"))
                  print("Candidate nested mod:", metadata.get("id"), metadata.get("name"))
                  print("Candidate nested class entries:", sum(name.endswith(".class") for name in nested.namelist()))
          print("Recovered-source candidate structure verified.")
          PY

      - name: Upload candidate separately from the known-good runtime
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-recovered-source-candidate
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
            CortimDLC_sources_merged (1)/CortimDLC/recovered-candidate/recovered-intermediary.jar
          if-no-files-found: error
          compression-level: 0


      - name: Flatten recovered client into a single standalone JAR
        working-directory: 'CortimDLC_sources_merged (1)/CortimDLC'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import json
          import zipfile
          from pathlib import Path

          source = Path("build/libs/AlbaDLC-1.0.0.jar")
          target = Path("recovered-candidate/AlbaDLC-standalone-1.0.0.jar")
          nested_path = "META-INF/jars/flow.jar"

          def as_list(value):
              if value is None:
                  return []
              return value if isinstance(value, list) else [value]

          def merge_entrypoints(base, addition):
              result = dict(base or {})
              for key, value in (addition or {}).items():
                  values = as_list(result.get(key)) + as_list(value)
                  unique = []
                  for item in values:
                      if item not in unique:
                          unique.append(item)
                  result[key] = unique
              return result

          def merge_constraints(base, addition, field):
              # Fabric arrays of version ranges mean OR, not AND. To avoid
              # weakening the outer AlbaDLC target constraints, keep an existing
              # outer value when both descriptors mention the same dependency.
              result = dict(base or {})
              for key, value in (addition or {}).items():
                  if key not in result:
                      result[key] = value
                  elif result[key] != value:
                      print("Outer metadata wins duplicate constraint:", field, key,
                            "outer=", result[key], "nested=", value)
              return result

          def merge_list(base, addition):
              result = list(base or [])
              for item in addition or []:
                  if item not in result:
                      result.append(item)
              return result

          with zipfile.ZipFile(source) as outer:
              outer_names = set(outer.namelist())
              if nested_path not in outer_names:
                  raise SystemExit("Missing source nested client at " + nested_path)
              outer_metadata = json.loads(outer.read("fabric.mod.json"))
              inner_bytes = outer.read(nested_path)

              with zipfile.ZipFile(io.BytesIO(inner_bytes)) as inner:
                  inner_names = set(inner.namelist())
                  if "fabric.mod.json" not in inner_names:
                      raise SystemExit("Nested client has no fabric.mod.json")
                  inner_metadata = json.loads(inner.read("fabric.mod.json"))
                  inner_id = inner_metadata.get("id")
                  print("Nested client metadata:")
                  print(json.dumps(inner_metadata, ensure_ascii=False, indent=2))
                  print("Nested class entries:", sum(n.endswith(".class") for n in inner_names))

                  merged = dict(outer_metadata)
                  for field in ("entrypoints",):
                      merged[field] = merge_entrypoints(merged.get(field), inner_metadata.get(field))
                  for field in ("depends", "recommends", "suggests", "breaks", "conflicts"):
                      merged[field] = merge_constraints(merged.get(field), inner_metadata.get(field), field)
                      if not merged[field]:
                          merged.pop(field, None)
                  for field in ("mixins", "jars", "provides", "authors", "contributors"):
                      if field in inner_metadata:
                          merged[field] = merge_list(merged.get(field), inner_metadata.get(field))
                  # The outer metadata references the old nested client container. Once its
                  # contents are flattened, remove that single now-invalid nested-JAR reference.
                  if "jars" in merged:
                      merged["jars"] = [
                          item for item in merged["jars"]
                          if not (
                              (isinstance(item, dict) and item.get("file") == nested_path) or
                              item == nested_path
                          )
                      ]
                      if not merged["jars"]:
                          merged.pop("jars")
                  if inner_id and inner_id != merged.get("id"):
                      merged["provides"] = merge_list(merged.get("provides"), [inner_id])
                  for field in ("languageAdapters", "custom"):
                      addition = inner_metadata.get(field)
                      if isinstance(addition, dict):
                          current = dict(merged.get(field) or {})
                          for key, value in addition.items():
                              if key not in current:
                                  current[key] = value
                              elif current[key] != value:
                                  print("Outer metadata wins duplicate field:", field, key)
                          merged[field] = current
                  for field in ("accessWidener", "icon", "license", "contact", "environment"):
                      if field not in merged and field in inner_metadata:
                          merged[field] = inner_metadata[field]
                      elif field == "environment" and merged.get(field) == "*" and inner_metadata.get(field) in ("client", "server"):
                          merged[field] = inner_metadata[field]
                  if not merged.get("entrypoints"):
                      raise SystemExit("No entrypoints remained after metadata merge")
                  print("Merged root metadata summary:")
                  print(json.dumps({
                      "id": merged.get("id"),
                      "name": merged.get("name"),
                      "provides": merged.get("provides", []),
                      "entrypointGroups": list(merged.get("entrypoints", {}).keys()),
                      "depends": merged.get("depends", {}),
                      "mixins": merged.get("mixins", []),
                      "jars": merged.get("jars", [])
                  }, ensure_ascii=False, indent=2))

                  target.parent.mkdir(parents=True, exist_ok=True)
                  seen = set()
                  duplicates = []
                  copied_classes = 0
                  copied_resources = 0
                  entrypoint_classes = []

                  for group in merged["entrypoints"].values():
                      for spec in as_list(group):
                          if isinstance(spec, str):
                              class_name = spec.split("::", 1)[0]
                              if "." in class_name:
                                  entrypoint_classes.append(class_name.replace(".", "/") + ".class")
                          elif isinstance(spec, dict) and isinstance(spec.get("value"), str):
                              class_name = spec["value"].split("::", 1)[0]
                              if "." in class_name:
                                  entrypoint_classes.append(class_name.replace(".", "/") + ".class")

                  with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as output:
                      for name in outer.namelist():
                          if name == nested_path or name.endswith("/"):
                              continue
                          payload = json.dumps(merged, ensure_ascii=False, indent=2).encode("utf-8") if name == "fabric.mod.json" else outer.read(name)
                          output.writestr(name, payload)
                          seen.add(name)

                      for name in inner.namelist():
                          if name.endswith("/") or name == "fabric.mod.json" or name.upper() == "META-INF/MANIFEST.MF":
                              continue
                          upper = name.upper()
                          if upper.startswith("META-INF/") and upper.endswith((".SF", ".RSA", ".DSA", ".EC")):
                              continue
                          payload = inner.read(name)
                          if name in seen:
                              duplicates.append(name)
                              if name.endswith(".class"):
                                  raise SystemExit("Class path collision while flattening: " + name)
                              continue
                          output.writestr(name, payload)
                          seen.add(name)
                          if name.endswith(".class"):
                              copied_classes += 1
                          else:
                              copied_resources += 1

                  with zipfile.ZipFile(target) as result:
                      result_names = set(result.namelist())
                      root_metadata = json.loads(result.read("fabric.mod.json"))
                      if nested_path in result_names or any(name.endswith("/flow.jar") for name in result_names):
                          raise SystemExit("Standalone archive still contains flow.jar")
                      for spec in root_metadata.get("jars", []):
                          nested_file = spec.get("file") if isinstance(spec, dict) else spec
                          if nested_file not in result_names:
                              raise SystemExit("fabric.mod.json references a missing nested JAR: " + str(nested_file))
                      if not any(name.startswith("a/") and name.endswith(".class") for name in result_names):
                          raise SystemExit("No recovered package-a classes found at root")
                      if not any(name.startswith("flow/") and name.endswith(".class") for name in result_names):
                          raise SystemExit("No flow package classes found at root")
                      missing_entrypoints = [name for name in entrypoint_classes if name not in result_names]
                      if missing_entrypoints:
                          raise SystemExit("Missing Fabric entrypoint class files: " + ", ".join(missing_entrypoints))
                      if root_metadata.get("id") != "albadlc":
                          raise SystemExit("Outer mod ID changed unexpectedly")
                      if any(name.startswith("META-INF/jars/") and name.endswith(".jar") for name in result_names):
                          print("Note: additional nested dependencies remain:", [name for name in result_names if name.startswith("META-INF/jars/") and name.endswith(".jar")])
                      print("Standalone candidate:", target)
                      print("Total root class entries:", sum(name.endswith(".class") for name in result_names))
                      print("Classes copied from nested client:", copied_classes)
                      print("Resources copied from nested client:", copied_resources)
                      print("Duplicate resource paths skipped (outer wins):", len(duplicates))
                      print("Entrypoint classes verified:", entrypoint_classes)
                      print("Standalone archive validation passed.")

          # Replace the normal build output only after all single-JAR checks passed.
          import shutil
          shutil.copy2(target, source)
          print("Final standalone output:", source)
          PY

      - name: Upload the standalone JAR under its normal filename
        uses: actions/upload-artifact@v4
        with:
          name: AlbaDLC-standalone-jar
          path: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
          if-no-files-found: error
          compression-level: 0

      - name: Publish standalone AlbaDLC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: albadlc-standalone-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AlbaDLC standalone build ${{ github.run_number }}
          body: |
            Standalone AlbaDLC client for Minecraft 1.21.11.
            Recovered Java class replacements are compiled and remapped to Fabric intermediary names.
            The published main JAR contains the client classes/resources directly and does not bundle META-INF/jars/flow.jar.
            This is a prerelease build for launch testing.
          prerelease: true
          files: |
            CortimDLC_sources_merged (1)/CortimDLC/build/libs/AlbaDLC-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
