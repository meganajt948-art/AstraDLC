/*
 * Keep the language selector and power button together at the bottom-left.
 * Align the expanded search field with the sidebar's left inset. These methods
 * drive both rendering and mouse hit-tests, so update the compiled methods too.
 */
def patchGuiUtilityButtonLayout = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def originals = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (descriptor == "()F" && ["hqs", "hqt", "hqv", "hqn"].contains(name)) {
                originals[name] = [access: access, descriptor: descriptor, signature: signature, exceptions: exceptions]
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            def replacements = [hqs: 32.0F, hqt: 225.0F, hqv: 377.0F, hqn: 12.0F]
            replacements.each { methodName, value ->
                def info = originals[methodName]
                if (info == null) throw new GradleException("GUI utility-button coordinate method not found: " + methodName)
                MethodVisitor mv = writer.visitMethod(info.access, methodName, info.descriptor,
                    info.signature, info.exceptions as String[])
                mv.visitCode()
                mv.visitLdcInsn(value)
                mv.visitInsn(Opcodes.FRETURN)
                mv.visitMaxs(1, 1)
                mv.visitEnd()
            }
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

