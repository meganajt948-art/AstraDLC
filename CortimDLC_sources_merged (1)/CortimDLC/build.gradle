    clinit.visitInsn(Opcodes.DUP)
    clinit.visitMethodInsn(Opcodes.INVOKESPECIAL, "java/util/WeakHashMap", "<init>", "()V", false)
    clinit.visitFieldInsn(Opcodes.PUTSTATIC, "a/AlbaPeriodicHop", "NEXT", "Ljava/util/Map;")
    clinit.visitTypeInsn(Opcodes.NEW, "java/util/WeakHashMap")
