                    @Override void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        boolean isSocialLoopPosition = (callOwner == ownerClass && callName == "jwn" &&
                            callDescriptor == "(I)F" && lastInsnWasIndexLoad)
