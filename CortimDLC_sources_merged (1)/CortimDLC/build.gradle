/* Inject the helper without changing the existing movement logic or its control flow. */
def patchPeriodicJumpHooks = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def found = [start: false, end: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            boolean isStart = name == "onStartTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            boolean isEnd = name == "onEndTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            if (isStart) found.start = true
            if (isEnd) found.end = true
            if (!isStart && !isEnd) return mv
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitCode() {
                    super.visitCode()
                    if (isStart) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "before",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                }
                @Override
                void visitInsn(int opcode) {
                    if (isEnd && opcode == Opcodes.RETURN) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "tick",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                    super.visitInsn(opcode)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found.start || !found.end) {
        throw new GradleException("Periodic-hop patch points missing: onStartTick=" + found.start + ", onEndTick=" + found.end)
    }
    return writer.toByteArray()
}

/* Normalize stale Discord invites and the wallpaper picker heading in every nested class. */
def patchDiscordInviteUrls = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    String desired = "https://discord.gg/aP9dpxM8"
    boolean changedInvite = false
    boolean changedLabel = false

    def replaceString = { Object value ->
        if (!(value instanceof String)) {
            return value
        }
        String text = (String)value
        String lower = text.trim().toLowerCase(java.util.Locale.ROOT)

        // Match the URL inside both ordinary string constants and StringConcatFactory
        // recipes; preserve any surrounding recipe characters/placeholders.
        String quote = java.util.regex.Matcher.quoteReplacement(desired)
        String rewritten = text
            .replaceAll("(?i)https?://discord\\.com/invite/[A-Za-z0-9_-]+", quote)
            .replaceAll("(?i)https?://discord\\.gg/[A-Za-z0-9_-]+", quote)
        if (rewritten != text) {
            changedInvite = true
            return rewritten
        }

        if (lower == "фон меню" || lower == "фон главного меню" ||
            lower == "main menu background" || lower == "menu background" ||
            lower == "background menu") {
            String replacement
            if (lower == "main menu background" || lower == "menu background" ||
                lower == "background menu") {
                replacement = "Main menu wallpapers"
            } else {
                replacement = "Обои в главном меню"
            }
            if (text != replacement) {
                changedLabel = true
            }
            return replacement
        }

        return value
    }

    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        org.objectweb.asm.FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
            Object newValue = replaceString(value)
            return super.visitField(access, name, descriptor, signature, newValue)
        }

        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitLdcInsn(Object value) {
                    super.visitLdcInsn(replaceString(value))
                }

                @Override
                void visitInvokeDynamicInsn(String indyName, String indyDescriptor,
                                            org.objectweb.asm.Handle bootstrapMethodHandle,
                                            Object... bootstrapMethodArguments) {
                    Object[] adjusted = new Object[bootstrapMethodArguments.length]
                    for (int i = 0; i < bootstrapMethodArguments.length; i++) {
                        adjusted[i] = replaceString(bootstrapMethodArguments[i])
                    }
                    super.visitInvokeDynamicInsn(indyName, indyDescriptor, bootstrapMethodHandle, adjusted)
                }
            }
        }
    }

    reader.accept(visitor, 0)
    if (changedInvite) {
        logger.lifecycle("Normalized Discord invite to https://discord.gg/aP9dpxM8 in " + reader.className)
    }
    if (changedLabel) {
        logger.lifecycle("Changed wallpaper picker label to Обои в главном меню in " + reader.className)
    }
    return writer.toByteArray()
}

/* Remove only the Reset row from the main-menu wallpaper panel; leave the other controls unchanged. */
def patchRemoveMenuBackgroundReset = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def rowInfo = [:]
    boolean heightFound = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jxt" && descriptor == "(I)F") {
                rowInfo.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return super.visitMethod(access, "albaOriginalBackgroundRowY", descriptor, signature, exceptions)
            }
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "jww" && descriptor == "()F") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        // The previous layout maps three visible rows to 57px, excluding Reset.
                        if (value instanceof Float && Math.abs(((Float)value).floatValue() - 76.0f) < 0.001f) {
                            value = 57.0f
                            heightFound = true
                        }
                        super.visitLdcInsn(value)
                    }
                }
            }
            return mv
        }
        @Override
        void visitEnd() {
            if (rowInfo.isEmpty()) throw new GradleException("Background settings row-position method jxt(I)F not found")
            def info = rowInfo
            MethodVisitor row = writer.visitMethod(info.access, "jxt", info.descriptor, info.signature, info.exceptions as String[])
            row.visitCode()
            org.objectweb.asm.Label keep = new org.objectweb.asm.Label()
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 8)
            row.visitJumpInsn(Opcodes.IF_ICMPNE, keep)
            row.visitLdcInsn(-10000.0f)
            row.visitInsn(Opcodes.FRETURN)
            row.visitLabel(keep)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "albaOriginalBackgroundRowY", "(I)F", false)
            row.visitInsn(Opcodes.FRETURN)
            row.visitMaxs(0, 0)
            row.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!heightFound) throw new GradleException("Background settings content-height constant 76 not found")
    return writer.toByteArray()
}

