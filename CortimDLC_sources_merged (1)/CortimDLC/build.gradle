/* Keep the wallpaper drawer compact: a three-column grid with only two rows visible. */
def patchCompactWallpaperPanel = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def found = [size: false, scroll: false, scrollCall: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jws" && descriptor == "()F") {
                found.size = true
                MethodVisitor out = super.visitMethod(access, name, descriptor, signature, exceptions)
                out.visitCode()
                out.visitVarInsn(Opcodes.ALOAD, 0)
                out.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jvf", "F")
                out.visitVarInsn(Opcodes.ALOAD, 0)
                out.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jte", "jwr", "()F", false)
                out.visitInsn(Opcodes.FSUB)
                out.visitLdcInsn(12.0F)
                out.visitInsn(Opcodes.FSUB)
                out.visitLdcInsn(164.0F)
                out.visitMethodInsn(Opcodes.INVOKESTATIC, "java/lang/Math", "min", "(FF)F", false)
                out.visitInsn(Opcodes.FRETURN)
                out.visitMaxs(0, 0)
                out.visitEnd()
                return null
            }
            if ((name == "method_25401" || name == "mouseScrolled") && descriptor == "(DDDD)Z") {
                found.scroll = true
                MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (opcode == Opcodes.INVOKEVIRTUAL && callOwner == ownerClass &&
                            callName == "jxb" && callDescriptor == "(FF)Z") {
                            super.visitMethodInsn(opcode, callOwner, "scrollInsideCatalog", callDescriptor, false)
                            found.scrollCall = true
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            MethodVisitor helper = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_SYNTHETIC,
                "scrollInsideCatalog", "(FF)Z", null, null)
            helper.visitCode()
            // Scrolling is active only over the catalogue viewport, not the drawer header or the rest of the menu.
            helper.visitVarInsn(Opcodes.FLOAD, 1)
            helper.visitVarInsn(Opcodes.FLOAD, 2)
            helper.visitVarInsn(Opcodes.ALOAD, 0)
            helper.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwq", "()F", false)
            helper.visitVarInsn(Opcodes.ALOAD, 0)
            helper.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwt", "()F", false)
            helper.visitLdcInsn(254.0F)
            helper.visitVarInsn(Opcodes.ALOAD, 0)
            helper.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwu", "()F", false)
            helper.visitMethodInsn(Opcodes.INVOKESTATIC, ownerClass, "jyf", "(FFFFFF)Z", false)
            helper.visitInsn(Opcodes.IRETURN)
            helper.visitMaxs(0, 0)
            helper.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!found.size || !found.scroll || !found.scrollCall) {
        throw new GradleException("Wallpaper catalogue viewport patch points not found: " + found)
    }
    return writer.toByteArray()
}

