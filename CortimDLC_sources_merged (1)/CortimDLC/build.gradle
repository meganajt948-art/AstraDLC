/* Redesign the wallpaper picker while preserving its state, scrolling and clicks. */
def patchMenuScreenSocialLinksAndStyle = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def found = [clinit: false, click: false, linkOpener: false, panel: false, wallpaper: false, discordAssigned: false, telegramAssigned: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "<clinit>" && descriptor == "()V") {
                // Keep the existing initializer and its field attributes intact. Replace the
                // computed values exactly where they are assigned, without mutating field metadata.
                found.clinit = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitFieldInsn(int opcode, String fieldOwner, String fieldName, String fieldDescriptor) {
                        if (opcode == Opcodes.PUTSTATIC && fieldOwner == ownerClass &&
                            fieldDescriptor == "Ljava/lang/String;" &&
                            (fieldName == "DISCORD" || fieldName == "TELEGRAM")) {
                            super.visitInsn(Opcodes.POP)
                            super.visitLdcInsn(fieldName == "DISCORD"
                                ? "https://discord.gg/aP9dpxM8"
                                : "https://t.me/+avaPsqqI2Mw3MTRi")
                            found[fieldName == "DISCORD" ? "discordAssigned" : "telegramAssigned"] = true
                            super.visitFieldInsn(opcode, fieldOwner, fieldName, fieldDescriptor)
                            return
                        }
                        super.visitFieldInsn(opcode, fieldOwner, fieldName, fieldDescriptor)
                    }
                }
            }
            if (name == "method_25402" && descriptor == "(Lnet/minecraft/class_11909;Z)Z") {
                found.click = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override void visitLdcInsn(Object value) {
                        if (value instanceof String) {
                            String urlText = ((String)value).toLowerCase(java.util.Locale.ROOT)
                            if (urlText.contains("discord.gg/") || urlText.contains("discord.com/invite/")) {
                                value = "https://discord.gg/aP9dpxM8"
                            }
                        }
                        super.visitLdcInsn(value)
                    }
                }
            }
            if (name == "jye" && descriptor == "(Ljava/lang/String;)V") {
                found.linkOpener = true
                // Force any Discord invite passed to the shared browser opener to the required invite.
                // This also handles URLs assembled from encoded fragments or char arrays earlier.
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitCode() {
                        super.visitCode()
                        org.objectweb.asm.Label notDiscord = new org.objectweb.asm.Label()
                        org.objectweb.asm.Label rewriteDiscord = new org.objectweb.asm.Label()
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitLdcInsn("discord.com/invite/")
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "contains",
                            "(Ljava/lang/CharSequence;)Z", false)
                        super.visitJumpInsn(Opcodes.IFNE, rewriteDiscord)
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitLdcInsn("discord.gg/")
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "contains",
                            "(Ljava/lang/CharSequence;)Z", false)
                        super.visitJumpInsn(Opcodes.IFEQ, notDiscord)
                        super.visitLabel(rewriteDiscord)
                        super.visitLdcInsn("https://discord.gg/aP9dpxM8")
                        super.visitVarInsn(Opcodes.ASTORE, 0)
                        super.visitLabel(notDiscord)
                    }
                }
            }
            if (name == "jxd") {
                found.panel = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    private boolean firstPanelRadius = true
                    private boolean useDarkFillAlpha = false
                    private boolean accentLineAdded = false
                    @Override void visitLdcInsn(Object value) {
                        if (value instanceof Integer && ((Integer)value).intValue() == 724759) {
                            value = 0x0B101A
                            useDarkFillAlpha = true
                        } else if (useDarkFillAlpha && value instanceof Float) {
                            if (Math.abs(((Float)value).floatValue() - 0.55f) < 0.001f) value = 0.90f
                            useDarkFillAlpha = false
                        }
                        if (firstPanelRadius && value instanceof Float &&
                            Math.abs(((Float)value).floatValue() - 11.0f) < 0.001f) {
                            value = 14.0f
                            firstPanelRadius = false
                        }
                        super.visitLdcInsn(value)
                    }
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (callName == "frosted" && opcode != Opcodes.INVOKESTATIC) {
                            Type[] args = Type.getArgumentTypes(callDescriptor)
                            for (int i = args.length - 1; i >= 0; i--) {
                                int sort = args[i].getSort()
                                super.visitInsn((sort == Type.LONG || sort == Type.DOUBLE) ? Opcodes.POP2 : Opcodes.POP)
                            }
                            super.visitInsn(Opcodes.POP)
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                        if (!accentLineAdded && callOwner.endsWith("/DrawUtil") && callName == "round" &&
                            callDescriptor == "(Lnet/minecraft/class_332;FFFFFI)V") {
                            super.visitVarInsn(Opcodes.ALOAD, 1)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwq", "()F", false)
                            super.visitLdcInsn(12.0f)
                            super.visitInsn(Opcodes.FADD)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwr", "()F", false)
                            super.visitLdcInsn(0.7f)
                            super.visitInsn(Opcodes.FADD)
                            super.visitLdcInsn(230.0f)
                            super.visitLdcInsn(1.2f)
                            super.visitLdcInsn(-13973)
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/DrawUtil", "rect",
                                "(Lnet/minecraft/class_332;FFFFI)V", false)
                            accentLineAdded = true
                        }
                    }
                }
            }
            if (name == "jxe") {
                found.wallpaper = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    private boolean cornerChanged = false
                    @Override void visitLdcInsn(Object value) {
                        if (!cornerChanged && value instanceof Float &&
                            Math.abs(((Float)value).floatValue() - 7.0f) < 0.001f) {
                            value = 4.0f
                            cornerChanged = true
                        }
                        super.visitLdcInsn(value)
                    }
                }
            }
            if (name == "jyc") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    private boolean rowCornerChanged = false
                    private boolean optionCornerChanged = false
                    @Override void visitLdcInsn(Object value) {
                        if (!rowCornerChanged && value instanceof Float &&
                            Math.abs(((Float)value).floatValue() - 5.0f) < 0.001f) {
                            value = 3.5f
                            rowCornerChanged = true
                        } else if (!optionCornerChanged && value instanceof Float &&
                            Math.abs(((Float)value).floatValue() - 6.5f) < 0.001f) {
                            value = 4.0f
                            optionCornerChanged = true
                        }
                        super.visitLdcInsn(value)
                    }
                }
            }
            return mv
        }
    }
    reader.accept(visitor, 0)
    if (!found.clinit || !found.click || !found.linkOpener || !found.panel || !found.wallpaper ||
        !found.discordAssigned || !found.telegramAssigned) {
        throw new GradleException("Menu re-style/link patch points not found in " + ownerClass + ": " + found)
    }
    logger.lifecycle("Forced all title-menu Discord URL opens to https://discord.gg/aP9dpxM8; removed WallpaperEntry render dependency")
    return writer.toByteArray()
}

