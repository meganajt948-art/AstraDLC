def albaLogoInkFile = layout.buildDirectory.file("flow-dependency/alba-logo-anim-ink.png")
def albaThumbnailFile = layout.buildDirectory.file("flow-dependency/alba-wallpaper-thumb.jpg")

/*
 * Safely rewrite only UTF-8 constants in Java class files. This updates constant
 * pool lengths correctly and leaves bytecode instructions/attributes untouched.
 */
def rebrandClassBytes = { byte[] bytes ->
    // Only rewrite UTF-8 constants that are referenced by CONSTANT_String.
    // Class names/descriptors must remain unchanged or Fabric cannot load the entrypoint.
    def probe = new DataInputStream(new ByteArrayInputStream(bytes))
    if (probe.readInt() != (int) 0xCAFEBABE) return bytes
    probe.readUnsignedShort()
    probe.readUnsignedShort()
    int probeCount = probe.readUnsignedShort()
    Set<Integer> stringConstantIndices = new HashSet<>()
    for (int i = 1; i < probeCount; i++) {
        int tag = probe.readUnsignedByte()
        switch (tag) {
            case 1:
                int len = probe.readUnsignedShort()
                probe.skipNBytes(len)
                break
            case 3: case 4: probe.skipNBytes(4); break
            case 5: case 6: probe.skipNBytes(8); i++; break
            case 7: case 16: case 19: case 20: probe.skipNBytes(2); break
            case 8: stringConstantIndices.add(probe.readUnsignedShort()); break
            case 9: case 10: case 11: case 12: case 17: case 18: probe.skipNBytes(4); break
            case 15: probe.skipNBytes(3); break
            default: throw new GradleException("Unsupported class constant-pool tag while scanning: ${tag}")
        }
    }

    def source = new DataInputStream(new ByteArrayInputStream(bytes))
    def buffer = new ByteArrayOutputStream(bytes.length + 64)
    def target = new DataOutputStream(buffer)

    int magic = source.readInt()
    if (magic != (int) 0xCAFEBABE) {
        // Some bundled .class-named entries are not ordinary JVM class files.
        // Preserve those bytes unchanged instead of failing the entire build.
        logger.warn("Skipping non-standard .class entry during rebranding (magic: 0x${Integer.toHexString(magic)})")
        return bytes
    }
    target.writeInt(magic)
    target.writeShort(source.readUnsignedShort()) // minor
    target.writeShort(source.readUnsignedShort()) // major
    int cpCount = source.readUnsignedShort()
    target.writeShort(cpCount)

    for (int i = 1; i < cpCount; i++) {
        int tag = source.readUnsignedByte()
        target.writeByte(tag)
        switch (tag) {
            case 1: // CONSTANT_Utf8
                int length = source.readUnsignedShort()
                byte[] encoded = new byte[length]
                source.readFully(encoded)
                def prefixed = new ByteArrayOutputStream(length + 2)
                def prefixOut = new DataOutputStream(prefixed)
                prefixOut.writeShort(length)
                prefixOut.write(encoded)
                String value = new DataInputStream(new ByteArrayInputStream(prefixed.toByteArray())).readUTF()
                String updated = value
                if (stringConstantIndices.contains(i) && !value.contains("flow.") && !value.contains("/")) {
                    // Change branding text, not package names or resource paths.
                    // Change known brand labels only; preserve resource IDs and shader keys.
                    updated = value
                        .replace("FlowClient", "AlbaDLC")
                        .replace("FlowUser", "AlbaUser")
                        .replace("Flow Black", "Alba Video")
                        .replace("Flow White", "Alba White")
                        .replace("Flow Чёрная", "Alba Видео")
                        .replace("Flow Черная", "Alba Черная")
                        .replace("Flow Белая", "Alba Белая")
                        .replace("Flow2", "AlbaDLC")
                        .replace("[Flow2]", "[AlbaDLC]")
                }
                if (updated != value) {
                    target.writeUTF(updated)
                    logger.lifecycle("Rebranded string constant '${value}' -> '${updated}'")
                } else {
                    target.writeShort(length)
                    target.write(encoded)
                }
                break
            case 3: case 4: // Integer / Float
                target.writeInt(source.readInt())
                break
            case 5: case 6: // Long / Double (occupy two constant-pool slots)
                target.writeLong(source.readLong())
                i++
                break
            case 7: case 8: case 16: case 19: case 20:
                target.writeShort(source.readUnsignedShort())
                break
            case 9: case 10: case 11: case 12: case 17: case 18:
                target.writeInt(source.readInt())
                break
            case 15:
                target.writeByte(source.readUnsignedByte())
                target.writeShort(source.readUnsignedShort())
                break
            default:
                throw new GradleException("Unsupported class constant-pool tag: ${tag}")
        }
    }
    byte[] remainder = source.readAllBytes()
    target.write(remainder)
    target.flush()
    return buffer.toByteArray()
}


/*
 * The bundled Flow client encrypts text constants and decrypts them through
 * flow.dev.a. Brand the resulting UI strings after decoding, but leave package
 * names such as flow.Flow and lowercase resource IDs such as flow-dark intact.
 */
/*
 * Remove only the selected wallpaper layer from the Minecraft title screen.
 * The title controls/particles and the separate background editor stay active.
 * Calling Screen's normal background method reveals vanilla Minecraft's panorama.
 */
def patchMinecraftMenuBackground = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def replaced = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            boolean backdrop = name == "jwe" && descriptor == "(Lnet/minecraft/class_332;FF)V"
            boolean background = name == "method_25420" && descriptor == "(Lnet/minecraft/class_332;IIF)V"
            if (backdrop || background) {
                replaced[name] = [access: access, descriptor: descriptor, signature: signature, exceptions: exceptions]
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            def background = replaced["method_25420"]
            if (background != null) {
                MethodVisitor mv = super.visitMethod(background.access, "method_25420",
                    background.descriptor, background.signature, background.exceptions as String[])
                mv.visitCode()
                mv.visitVarInsn(Opcodes.ALOAD, 0)
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitVarInsn(Opcodes.ILOAD, 2)
                mv.visitVarInsn(Opcodes.ILOAD, 3)
                mv.visitVarInsn(Opcodes.FLOAD, 4)
                mv.visitMethodInsn(Opcodes.INVOKESPECIAL, "net/minecraft/class_437", "method_25420",
                    "(Lnet/minecraft/class_332;IIF)V", false)
                mv.visitInsn(Opcodes.RETURN)
                mv.visitMaxs(5, 5)
                mv.visitEnd()
            }

            def backdrop = replaced["jwe"]
            if (backdrop != null) {
                MethodVisitor mv = super.visitMethod(backdrop.access, "jwe",
                    backdrop.descriptor, backdrop.signature, backdrop.exceptions as String[])
                mv.visitCode()
                mv.visitInsn(Opcodes.RETURN)
                mv.visitMaxs(0, 3)
                mv.visitEnd()
            }
            if (background == null || backdrop == null) {
                throw new GradleException("MenuScreen background methods not found: " + replaced.keySet())
            }
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/* Leave Minecraft's native panorama renderer installed; don't overlay a wallpaper on it. */
def patchPanoramaHook = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def original = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "tick" && descriptor == "(Lnet/minecraft/class_310;)V") {
                original.putAll([access: access, name: name, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            if (original.isEmpty()) throw new GradleException("PanoramaHook.tick method not found")
            MethodVisitor mv = super.visitMethod(original.access, original.name, original.descriptor,
                original.signature, original.exceptions as String[])
            mv.visitCode()
            mv.visitInsn(Opcodes.RETURN)
            mv.visitMaxs(0, 1)
            mv.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Filter the two unwanted video entries out of the Minecraft title-screen wallpaper list.
 * The other entries (Sparkle, Cherry, Snow, Sky Meadow, Flowers, Elf, Samurai, Farm, ...)
 * stay selectable; the resulting first item becomes the default through kbt[0].
 */
def patchTitleWallpaperCatalog = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "<clinit>" && descriptor == "()V") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
                        if (opcode == Opcodes.PUTSTATIC && owner == "a/kbs" &&
                            fieldName == "kbt" && fieldDescriptor == "[La/kbs;") {
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/kbs", "filterMenuEntries",
                                "([La/kbs;)[La/kbs;", false)
                        }
                        super.visitFieldInsn(opcode, owner, fieldName, fieldDescriptor)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            MethodVisitor filter = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "filterMenuEntries", "([La/kbs;)[La/kbs;", null, null)
            filter.visitCode()
            filter.visitTypeInsn(Opcodes.NEW, "java/util/ArrayList")
            filter.visitInsn(Opcodes.DUP)
            filter.visitMethodInsn(Opcodes.INVOKESPECIAL, "java/util/ArrayList", "<init>", "()V", false)
            filter.visitVarInsn(Opcodes.ASTORE, 1)
            filter.visitInsn(Opcodes.ICONST_0)
            filter.visitVarInsn(Opcodes.ISTORE, 2)
            org.objectweb.asm.Label loop = new org.objectweb.asm.Label()
            org.objectweb.asm.Label end = new org.objectweb.asm.Label()
            org.objectweb.asm.Label next = new org.objectweb.asm.Label()
            filter.visitLabel(loop)
            filter.visitVarInsn(Opcodes.ILOAD, 2)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitInsn(Opcodes.ARRAYLENGTH)
            filter.visitJumpInsn(Opcodes.IF_ICMPGE, end)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitVarInsn(Opcodes.ILOAD, 2)
            filter.visitInsn(Opcodes.AALOAD)
            filter.visitVarInsn(Opcodes.ASTORE, 3)
            filter.visitVarInsn(Opcodes.ALOAD, 3)
            filter.visitFieldInsn(Opcodes.GETFIELD, "a/kbs", "key", "Ljava/lang/String;")
            filter.visitVarInsn(Opcodes.ASTORE, 4)
            filter.visitLdcInsn("video:flow-dark")
            filter.visitVarInsn(Opcodes.ALOAD, 4)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "equals", "(Ljava/lang/Object;)Z", false)
            filter.visitJumpInsn(Opcodes.IFNE, next)
            filter.visitLdcInsn("video:flow-light")
            filter.visitVarInsn(Opcodes.ALOAD, 4)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "equals", "(Ljava/lang/Object;)Z", false)
            filter.visitJumpInsn(Opcodes.IFNE, next)

            // Hide the requested Dark Elf/E 
            filter.visitVarInsn(Opcodes.ALOAD, 4)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "toLowerCase", "()Ljava/lang/String;", false)
            filter.visitVarInsn(Opcodes.ASTORE, 5)
            ["dark-elf", "dark_elf", "dark elf", "elf"].each { unwantedKey ->
                filter.visitLdcInsn(unwantedKey)
                filter.visitVarInsn(Opcodes.ALOAD, 5)
                filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "contains", "(Ljava/lang/CharSequence;)Z", false)
                filter.visitJumpInsn(Opcodes.IFNE, next)
            }
            filter.visitVarInsn(Opcodes.ALOAD, 3)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/kbs", "title", "()Ljava/lang/String;", false)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "toLowerCase", "()Ljava/lang/String;", false)
            filter.visitVarInsn(Opcodes.ASTORE, 5)
            ["dark elf", "dark elven", "elf", "темная эльфийка", "тёмная эльфийка", "эльф"].each { unwantedTitle ->
                filter.visitLdcInsn(unwantedTitle)
                filter.visitVarInsn(Opcodes.ALOAD, 5)
                filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "contains", "(Ljava/lang/CharSequence;)Z", false)
                filter.visitJumpInsn(Opcodes.IFNE, next)
            }
            filter.visitVarInsn(Opcodes.ALOAD, 1)
            filter.visitVarInsn(Opcodes.ALOAD, 3)
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "add", "(Ljava/lang/Object;)Z", true)
            filter.visitInsn(Opcodes.POP)
            filter.visitLabel(next)
            filter.visitIincInsn(2, 1)
            filter.visitJumpInsn(Opcodes.GOTO, loop)
            filter.visitLabel(end)
            filter.visitVarInsn(Opcodes.ALOAD, 1)
            filter.visitInsn(Opcodes.ICONST_0)
            filter.visitTypeInsn(Opcodes.ANEWARRAY, "a/kbs")
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "toArray",
                "([Ljava/lang/Object;)[Ljava/lang/Object;", true)
            filter.visitTypeInsn(Opcodes.CHECKCAST, "[La/kbs;")
            filter.visitInsn(Opcodes.ARETURN)
            filter.visitMaxs(0, 0)
            filter.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Remove the old Alba Black/White UI presets and use Obsidian + Depth as the initial
 * interface style. Other presets, palette controls, custom colors and editor features remain.
 */
def patchThemePresets = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "<clinit>" && descriptor == "()V") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
                        if (opcode == Opcodes.PUTSTATIC && owner == "a/iov" &&
                            fieldName == "PRESETS" && fieldDescriptor == "[La/iom;") {
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/iov", "filterThemePresets",
                                "([La/iom;)[La/iom;", false)
                        }
                        super.visitFieldInsn(opcode, owner, fieldName, fieldDescriptor)
                    }

                    @Override
                    void visitInsn(int opcode) {
                        if (opcode == Opcodes.RETURN) {
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/iov", "PRESET", "La/vlv;")
                            super.visitLdcInsn("Obsidian")
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vlv", "set", "(Ljava/lang/String;)V", false)
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/iov", "STYLE", "La/vlv;")
                            super.visitLdcInsn("Depth")
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vlv", "set", "(Ljava/lang/String;)V", false)
                        }
                        super.visitInsn(opcode)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            MethodVisitor filter = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "filterThemePresets", "([La/iom;)[La/iom;", null, null)
            filter.visitCode()
            filter.visitTypeInsn(Opcodes.NEW, "java/util/ArrayList")
            filter.visitInsn(Opcodes.DUP)
            filter.visitMethodInsn(Opcodes.INVOKESPECIAL, "java/util/ArrayList", "<init>", "()V", false)
            filter.visitVarInsn(Opcodes.ASTORE, 1)
            filter.visitInsn(Opcodes.ICONST_0)
            filter.visitVarInsn(Opcodes.ISTORE, 2)
            org.objectweb.asm.Label loop = new org.objectweb.asm.Label()
            org.objectweb.asm.Label end = new org.objectweb.asm.Label()
            org.objectweb.asm.Label next = new org.objectweb.asm.Label()
            filter.visitLabel(loop)
            filter.visitVarInsn(Opcodes.ILOAD, 2)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitInsn(Opcodes.ARRAYLENGTH)
            filter.visitJumpInsn(Opcodes.IF_ICMPGE, end)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitVarInsn(Opcodes.ILOAD, 2)
            filter.visitInsn(Opcodes.AALOAD)
            filter.visitVarInsn(Opcodes.ASTORE, 3)
            filter.visitVarInsn(Opcodes.ALOAD, 3)
            filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/iom", "name", "()Ljava/lang/String;", false)
            filter.visitVarInsn(Opcodes.ASTORE, 4)
            ["Alba Black", "Alba White", "Alba Video", "Alba Видео", "Flow Black", "Flow White",
             "Light", "Light Theme", "Light theme", "Светлая", "Светлая тема"].each { hidden ->
                filter.visitLdcInsn(hidden)
                filter.visitVarInsn(Opcodes.ALOAD, 4)
                filter.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "equals", "(Ljava/lang/Object;)Z", false)
                filter.visitJumpInsn(Opcodes.IFNE, next)
            }
            filter.visitVarInsn(Opcodes.ALOAD, 1)
            filter.visitVarInsn(Opcodes.ALOAD, 3)
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "add", "(Ljava/lang/Object;)Z", true)
            filter.visitInsn(Opcodes.POP)
            filter.visitLabel(next)
            filter.visitIincInsn(2, 1)
            filter.visitJumpInsn(Opcodes.GOTO, loop)
            filter.visitLabel(end)
            filter.visitVarInsn(Opcodes.ALOAD, 1)
            filter.visitInsn(Opcodes.ICONST_0)
            filter.visitTypeInsn(Opcodes.ANEWARRAY, "a/iom")
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "toArray",
                "([Ljava/lang/Object;)[Ljava/lang/Object;", true)
            filter.visitTypeInsn(Opcodes.CHECKCAST, "[La/iom;")
            filter.visitInsn(Opcodes.ARETURN)
            filter.visitMaxs(0, 0)
            filter.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/* Set the background editor's fresh-install default to the playable video entry. */
def patchClientBackgroundDefault = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    boolean found = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "<clinit>" && descriptor == "()V") {
                found = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitInsn(int opcode) {
                        if (opcode == Opcodes.RETURN) {
                            super.visitLdcInsn("video:flow-dark")
                            super.visitFieldInsn(Opcodes.PUTSTATIC, "a/isv", "itj", "Ljava/lang/String;")
                        }
                        super.visitInsn(opcode)
                    }
                }
            }
            return mv
        }
    }
    reader.accept(visitor, 0)
    if (!found) throw new GradleException("Client wallpaper default initializer not found")
    return writer.toByteArray()
}

/*
 * Keep main-menu art decoding responsive when the user changes wallpapers quickly.
 * The original single worker serialized every wallpaper decode/resize/blur operation,
 * so the newly selected wallpaper could wait behind an old one. Use a small bounded
 * pool for menu artwork only; thumbnail loading already has its own pool.
 */
def patchMenuArtCacheExecutor = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean workerCountInjected = false
    boolean executorReplaced = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != "<clinit>" || descriptor != "()V") return mv
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitInvokeDynamicInsn(String indyName, String indyDescriptor, Handle bootstrapMethodHandle, Object... bootstrapMethodArguments) {
                    // The first ThreadFactory lambda belongs to the menu-art executor.
                    if (!workerCountInjected && indyDescriptor == "()Ljava/util/concurrent/ThreadFactory;") {
                        super.visitInsn(Opcodes.ICONST_3)
                        workerCountInjected = true
                    }
                    super.visitInvokeDynamicInsn(indyName, indyDescriptor, bootstrapMethodHandle, bootstrapMethodArguments)
                }

                @Override
                void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                    if (!executorReplaced && workerCountInjected && opcode == Opcodes.INVOKESTATIC &&
                        owner == "java/util/concurrent/Executors" && methodName == "newSingleThreadExecutor" &&
                        methodDescriptor == "(Ljava/util/concurrent/ThreadFactory;)Ljava/util/concurrent/ExecutorService;") {
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, owner, "newFixedThreadPool",
                            "(ILjava/util/concurrent/ThreadFactory;)Ljava/util/concurrent/ExecutorService;", false)
                        executorReplaced = true
                        return
                    }
                    super.visitMethodInsn(opcode, owner, methodName, methodDescriptor, isInterface)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!workerCountInjected || !executorReplaced) {
        throw new GradleException("Could not parallelize menu-art loading (workerCountInjected=" +
            workerCountInjected + ", executorReplaced=" + executorReplaced + ")")
    }
    return writer.toByteArray()
}

/*
 * Avoid starting the native Windows Media Foundation video decoder while the title
 * menu is resolving its background. The menu-art cache already has the bundled
 * poster image, so retain the normal sharp/blur artwork and skip the animated frame
 * only in this cache path. The wallpaper editor's direct video preview stays intact.
 */
def patchMenuWallpaperPosterFallback = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jzw" && descriptor == "(Ljava/lang/String;La/jza;)La/jza;") {
                found = true
                MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                mv.visitCode()
                def noCatalogEntry = new org.objectweb.asm.Label()
                def fillReady = new org.objectweb.asm.Label()
                def hasFill = new org.objectweb.asm.Label()

                // Resolve the selected wallpaper's fill setting as the non-video path does.
                mv.visitVarInsn(Opcodes.ALOAD, 0)
                mv.visitMethodInsn(Opcodes.INVOKESTATIC, "a/kbs", "byKey", "(Ljava/lang/String;)La/kbs;", false)
                mv.visitVarInsn(Opcodes.ASTORE, 2)
                mv.visitVarInsn(Opcodes.ALOAD, 2)
                mv.visitJumpInsn(Opcodes.IFNULL, noCatalogEntry)
                mv.visitVarInsn(Opcodes.ALOAD, 2)
                mv.visitFieldInsn(Opcodes.GETFIELD, "a/kbs", "fill", "I")
                mv.visitVarInsn(Opcodes.ISTORE, 3)
                mv.visitJumpInsn(Opcodes.GOTO, fillReady)

                mv.visitLabel(noCatalogEntry)
                mv.visitInsn(Opcodes.ICONST_M1)
                mv.visitVarInsn(Opcodes.ISTORE, 3)

                mv.visitLabel(fillReady)
                mv.visitVarInsn(Opcodes.ILOAD, 3)
                mv.visitJumpInsn(Opcodes.IFGE, hasFill)
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitInsn(Opcodes.ARETURN)

                mv.visitLabel(hasFill)
                mv.visitTypeInsn(Opcodes.NEW, "a/jza")
                mv.visitInsn(Opcodes.DUP)
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jza", "sharp", "()La/uok;", false)
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jza", "blur", "()La/uok;", false)
                mv.visitInsn(Opcodes.ICONST_0)
                mv.visitVarInsn(Opcodes.ILOAD, 3)
                mv.visitMethodInsn(Opcodes.INVOKESPECIAL, "a/jza", "<init>", "(La/uok;La/uok;ZI)V", false)
                mv.visitInsn(Opcodes.ARETURN)
                mv.visitMaxs(0, 0)
                mv.visitEnd()
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
    }
    reader.accept(visitor, 0)
    if (!found) throw new GradleException("Menu wallpaper cache method jzw was not found")
    return writer.toByteArray()
}

/*
 * Warm the selected title wallpaper on every title-screen frame. Avoid installing
 * a second panorama renderer: the title screen owns its selected wallpaper layer.
 */
def patchTitleMenuRenderWarmup = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "method_25394" && descriptor == "(Lnet/minecraft/class_332;IIF)V") {
                found = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitCode() {
                        super.visitCode()
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jug", "La/kbs;")
                        super.visitFieldInsn(Opcodes.GETFIELD, "a/kbs", "key", "Ljava/lang/String;")
                        // Do not restart the video/image loader on every rendered frame.
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/jte", "albaPreloadWallpaper", "(Ljava/lang/String;)V", false)
                        // The title screen already renders its selected wallpaper itself.
                        // Do not install PanoramaHook into Minecraft's world panorama renderer:
                        // that second renderer causes the title background to flicker between layers.
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            org.objectweb.asm.FieldVisitor cache = super.visitField(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "albaLastPreloadedWallpaper", "Ljava/lang/String;", null, null)
            cache.visitEnd()

            MethodVisitor preload = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "albaPreloadWallpaper", "(Ljava/lang/String;)V", null, null)
            preload.visitCode()
            org.objectweb.asm.Label unchanged = new org.objectweb.asm.Label()
            preload.visitVarInsn(Opcodes.ALOAD, 0)
            preload.visitFieldInsn(Opcodes.GETSTATIC, "a/jte", "albaLastPreloadedWallpaper", "Ljava/lang/String;")
            preload.visitMethodInsn(Opcodes.INVOKESTATIC, "java/util/Objects", "equals",
                "(Ljava/lang/Object;Ljava/lang/Object;)Z", false)
            preload.visitJumpInsn(Opcodes.IFNE, unchanged)
            preload.visitVarInsn(Opcodes.ALOAD, 0)
            preload.visitMethodInsn(Opcodes.INVOKESTATIC, "a/jzh", "preload", "(Ljava/lang/String;)V", false)
            preload.visitVarInsn(Opcodes.ALOAD, 0)
            preload.visitFieldInsn(Opcodes.PUTSTATIC, "a/jte", "albaLastPreloadedWallpaper", "Ljava/lang/String;")
            preload.visitLabel(unchanged)
            preload.visitInsn(Opcodes.RETURN)
            preload.visitMaxs(0, 0)
            preload.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!found) throw new GradleException("Title-screen render method not found for wallpaper warm-up")
    return writer.toByteArray()
}

/*
 * Restore the native title-screen background as a fallback layer. The custom
 * wallpaper renderer still runs afterward, so the selected wallpaper covers it.
 */
/*
 * White-screen guard for the first Alba-owned screens. DrawContext.fill is the
 * vanilla GUI rectangle path (not Alba's custom pipeline/scene shader), so a
 * fully opaque backing is already on screen even if a later custom render call
 * throws or the wallpaper texture is not ready.
 */
def isWelcomeScreenClass = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    if (reader.superName != "net/minecraft/class_437") return false
    def found = [render: false, languageTitle: false]
    reader.accept(new ClassVisitor(Opcodes.ASM9) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name != "method_25394" || descriptor != "(Lnet/minecraft/class_332;IIF)V") return null
            found.render = true
            return new MethodVisitor(Opcodes.ASM9) {
                @Override
                void visitLdcInsn(Object value) {
                    if (value == "Choose your language" || value == "Выберите язык") {
                        found.languageTitle = true
                    }
                }
            }
        }
    }, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
    return found.render && found.languageTitle
}

def patchOpaqueScreenBackground = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String owner = reader.className

    // A few Alba screens reset the framebuffer in uut.beginFrame(). If the
    // opaque fallback is painted at method entry, that reset immediately
    // erases it and the user still sees a white/empty frame. Find this call
    // first, then paint directly AFTER it. Other screens receive the fallback
    // at render entry, after Minecraft has run renderBackground().
    boolean renderHasBeginFrame = false
    reader.accept(new ClassVisitor(Opcodes.ASM9) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name != "method_25394" || descriptor != "(Lnet/minecraft/class_332;IIF)V") return null
            return new MethodVisitor(Opcodes.ASM9) {
                @Override
                void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                    if (callOwner == "a/uut" && callName == "beginFrame" && callDescriptor == "()V") {
                        renderHasBeginFrame = true
                    }
                }
            }
        }
    }, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)

    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    boolean backgroundInjected = false
    def paintOpaqueBackground = { MethodVisitor target ->
        // DrawContext.fill(0, 0, screen.width, screen.height, opaque dark blue).
        target.visitVarInsn(Opcodes.ALOAD, 1)
        target.visitInsn(Opcodes.ICONST_0)
        target.visitInsn(Opcodes.ICONST_0)
        target.visitVarInsn(Opcodes.ALOAD, 0)
        target.visitFieldInsn(Opcodes.GETFIELD, owner, "field_22789", "I")
        target.visitVarInsn(Opcodes.ALOAD, 0)
        target.visitFieldInsn(Opcodes.GETFIELD, owner, "field_22790", "I")
        target.visitLdcInsn(Integer.valueOf(-16052198))
        target.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_332", "method_25294",
            "(IIIII)V", false)
    }
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != "method_25394" || descriptor != "(Lnet/minecraft/class_332;IIF)V") return mv
            found = true
            return new MethodVisitor(Opcodes.ASM9, mv) {
                boolean injected = false

                @Override
                void visitCode() {
                    super.visitCode()
                    if (!renderHasBeginFrame) {
                        paintOpaqueBackground.call(this)
                        injected = true
                        backgroundInjected = true
                    }
                }

                @Override
                void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                    super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    if (!injected && renderHasBeginFrame && callOwner == "a/uut" &&
                        callName == "beginFrame" && callDescriptor == "()V") {
                        // The frame has now been initialized. Paint using Minecraft's
                        // normal GUI path before any of the custom shaders/rectangles run.
                        paintOpaqueBackground.call(this)
                        injected = true
                        backgroundInjected = true
                    }
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found || !backgroundInjected) {
        throw new GradleException("Could not inject post-beginFrame opaque background into " + owner)
    }
    return writer.toByteArray()
}

/*
 * The custom full-screen rectangle can be submitted through the unstable UI
 * render pipeline and cover the whole frame with white on some drivers.
 * Replace only that first background rectangle with Minecraft's normal fill;
 * leave every other custom shape and the wallpaper layer intact.
 */
def patchVanillaBackdropRect = { byte[] bytes, String targetMethod, String targetDescriptor, int backgroundColor ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean foundMethod = false
    boolean replacedRect = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != targetMethod || descriptor != targetDescriptor) return mv
            foundMethod = true
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                    if (!replacedRect && callOwner == "a/uut" && callName == "rect" &&
                        callDescriptor == "(Lnet/minecraft/class_332;FFFFI)V") {
                        // Original stack: context, x, y, width, height, color.
                        // Keep the coordinates, convert floats to integer pixels, and
                        // submit a normal DrawContext.fill instead of the custom shader rect.
                        super.visitInsn(Opcodes.POP)
                        super.visitInsn(Opcodes.F2I)
                        super.visitInsn(Opcodes.F2I)
                        super.visitInsn(Opcodes.F2I)
                        super.visitInsn(Opcodes.F2I)
                        super.visitLdcInsn(backgroundColor)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_332", "method_25294",
                            "(IIIII)V", false)
                        replacedRect = true
                    } else {
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!foundMethod || !replacedRect) {
        throw new GradleException("Could not replace the custom full-screen backdrop rectangle in " +
            new ClassReader(bytes).className + "." + targetMethod)
    }
    return writer.toByteArray()
}

def patchTitleScreenBackground = { byte[] bytes ->
