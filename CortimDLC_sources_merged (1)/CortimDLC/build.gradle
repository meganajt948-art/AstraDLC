import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Handle
import org.objectweb.asm.Label
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath "org.ow2.asm:asm:9.7.1" }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

/*
 * Bundle the original client as a nested Fabric mod. Only update its display
 * metadata here; do not rewrite compiled class files during the build.
 */
def flowNestedJar = layout.buildDirectory.file("flow-dependency/flow.jar")
def rebrandedNestedJar = layout.buildDirectory.file("flow-dependency/astradlc-core.jar")

/*
 * Safely rewrite only UTF-8 constants in Java class files. This updates constant
 * pool lengths correctly and leaves bytecode instructions/attributes untouched.
 */
def rebrandClassBytes = { byte[] bytes ->
    // Only rewrite UTF-8 constants that are referenced by CONSTANT_String.
    // Class names/descriptors must remain unchanged or Fabric cannot load the entrypoint.
    def probe = new DataInputStream(new ByteArrayInputStream(bytes))
    if (probe.readInt() != (int) 0xCAFEBABE) return bytes
    probe.readUnsignedShort()
    probe.readUnsignedShort()
    int probeCount = probe.readUnsignedShort()
    Set<Integer> stringConstantIndices = new HashSet<>()
    for (int i = 1; i < probeCount; i++) {
        int tag = probe.readUnsignedByte()
        switch (tag) {
            case 1:
                int len = probe.readUnsignedShort()
                probe.skipNBytes(len)
                break
            case 3: case 4: probe.skipNBytes(4); break
            case 5: case 6: probe.skipNBytes(8); i++; break
            case 7: case 16: case 19: case 20: probe.skipNBytes(2); break
            case 8: stringConstantIndices.add(probe.readUnsignedShort()); break
            case 9: case 10: case 11: case 12: case 17: case 18: probe.skipNBytes(4); break
            case 15: probe.skipNBytes(3); break
            default: throw new GradleException("Unsupported class constant-pool tag while scanning: ${tag}")
        }
    }

    def source = new DataInputStream(new ByteArrayInputStream(bytes))
    def buffer = new ByteArrayOutputStream(bytes.length + 64)
    def target = new DataOutputStream(buffer)

    int magic = source.readInt()
    if (magic != (int) 0xCAFEBABE) {
        // Some bundled .class-named entries are not ordinary JVM class files.
        // Preserve those bytes unchanged instead of failing the entire build.
        logger.warn("Skipping non-standard .class entry during rebranding (magic: 0x${Integer.toHexString(magic)})")
        return bytes
    }
    target.writeInt(magic)
    target.writeShort(source.readUnsignedShort()) // minor
    target.writeShort(source.readUnsignedShort()) // major
    int cpCount = source.readUnsignedShort()
    target.writeShort(cpCount)

    for (int i = 1; i < cpCount; i++) {
        int tag = source.readUnsignedByte()
        target.writeByte(tag)
        switch (tag) {
            case 1: // CONSTANT_Utf8
                int length = source.readUnsignedShort()
                byte[] encoded = new byte[length]
                source.readFully(encoded)
                def prefixed = new ByteArrayOutputStream(length + 2)
                def prefixOut = new DataOutputStream(prefixed)
                prefixOut.writeShort(length)
                prefixOut.write(encoded)
                String value = new DataInputStream(new ByteArrayInputStream(prefixed.toByteArray())).readUTF()
                String updated = value
                if (stringConstantIndices.contains(i) && !value.contains("flow.") && !value.contains("/")) {
                    // Change branding text, not package names or resource paths.
                    updated = value
                        .replace("FlowClient", "AstraDLC")
                        .replace("FlowUser", "AstraUser")
                        .replace("Flow Black", "Astra Black")
                        .replace("Flow White", "Astra White")
                        .replace("Flow Чёрная", "Astra Чёрная")
                        .replace("Flow Черная", "Astra Черная")
                        .replace("Flow Белая", "Astra Белая")
                        .replace("Flow Белая", "Astra Белая")
                        .replace("Flow2", "AstraDLC")
                        .replace("Flow", "Astra")
                }
                if (updated != value) {
                    target.writeUTF(updated)
                    logger.lifecycle("Rebranded string constant '${value}' -> '${updated}'")
                } else {
                    target.writeShort(length)
                    target.write(encoded)
                }
                break
            case 3: case 4: // Integer / Float
                target.writeInt(source.readInt())
                break
            case 5: case 6: // Long / Double (occupy two constant-pool slots)
                target.writeLong(source.readLong())
                i++
                break
            case 7: case 8: case 16: case 19: case 20:
                target.writeShort(source.readUnsignedShort())
                break
            case 9: case 10: case 11: case 12: case 17: case 18:
                target.writeInt(source.readInt())
                break
            case 15:
                target.writeByte(source.readUnsignedByte())
                target.writeShort(source.readUnsignedShort())
                break
            default:
                throw new GradleException("Unsupported class constant-pool tag: ${tag}")
        }
    }
    byte[] remainder = source.readAllBytes()
    target.write(remainder)
    target.flush()
    return buffer.toByteArray()
}


/*
 * The bundled Flow client encrypts text constants and decrypts them through
 * flow.dev.a. Brand the resulting UI strings after decoding, but leave package
 * names such as flow.Flow and lowercase resource IDs such as flow-dark intact.
 */
def patchEncryptedBranding = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            boolean decoder =
                (name == "b" && descriptor == "(Ljava/lang/String;I)Ljava/lang/String;") ||
                (name == "c" && descriptor == "(ILjava/lang/String;)Ljava/lang/String;") ||
                (name == "d" && descriptor == "(Ljava/lang/String;II)Ljava/lang/String;")
            if (decoder) {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitInsn(int opcode) {
                        if (opcode == Opcodes.ARETURN) {
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "flow/dev/a", "rebrandText",
                                "(Ljava/lang/String;)Ljava/lang/String;", false)
                        }
                        super.visitInsn(opcode)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            MethodVisitor mv = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "rebrandText", "(Ljava/lang/String;)Ljava/lang/String;", null, null)
            mv.visitCode()
            Label apply = new Label()
            mv.visitVarInsn(Opcodes.ALOAD, 0)
            mv.visitLdcInsn("flow.")
            mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "contains",
                "(Ljava/lang/CharSequence;)Z", false)
            mv.visitJumpInsn(Opcodes.IFEQ, apply)
            mv.visitVarInsn(Opcodes.ALOAD, 0)
            mv.visitInsn(Opcodes.ARETURN)
            mv.visitLabel(apply)
            mv.visitFrame(Opcodes.F_SAME, 0, null, 0, null)
            mv.visitVarInsn(Opcodes.ALOAD, 0)
            def replacements = [
                ["FlowClient", "AstraDLC"],
                ["FlowUser", "AstraUser"],
                ["Flow Black", "Astra Black"],
                ["Flow White", "Astra White"],
                ["Flow Чёрная", "Astra Чёрная"],
                ["Flow Черная", "Astra Черная"],
                ["Flow Белая", "Astra Белая"],
                ["Flow2", "AstraDLC"],
                ["Flow", "Astra"]
            ]
            replacements.each { pair ->
                mv.visitLdcInsn(pair[0])
                mv.visitLdcInsn(pair[1])
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "replace",
                    "(Ljava/lang/CharSequence;Ljava/lang/CharSequence;)Ljava/lang/String;", false)
            }
            mv.visitInsn(Opcodes.ARETURN)
            mv.visitMaxs(3, 1)
            mv.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Filter actual wallpaper entries, not only the image files: the picker is
 * backed by the a.isv entry list. This keeps the selected wallpapers from
 * appearing as empty/broken tiles in either Russian or English UI.
 */
def patchWallpaperCatalog = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "entries" && descriptor == "()Ljava/util/List;") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitInsn(int opcode) {
                        if (opcode == Opcodes.ARETURN) {
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/isv", "filterEntries",
                                "(Ljava/util/List;)Ljava/util/List;", false)
                        }
                        super.visitInsn(opcode)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            MethodVisitor filter = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "filterEntries", "(Ljava/util/List;)Ljava/util/List;", null, null)
            filter.visitCode()
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            Handle bootstrap = new Handle(Opcodes.H_INVOKESTATIC, "java/lang/invoke/LambdaMetafactory", "metafactory",
                "(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;" +
                "Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)" +
                "Ljava/lang/invoke/CallSite;", false)
            filter.visitInvokeDynamicInsn("test", "()Ljava/util/function/Predicate;", bootstrap,
                Type.getType("(Ljava/lang/Object;)Z"),
                new Handle(Opcodes.H_INVOKESTATIC, "a/isv", "hideWallpaper", "(Ljava/lang/Object;)Z", false),
                Type.getType("(Ljava/lang/Object;)Z"))
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "removeIf",
                "(Ljava/util/function/Predicate;)Z", true)
            filter.visitInsn(Opcodes.POP)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitInsn(Opcodes.ARETURN)
            filter.visitMaxs(2, 1)
            filter.visitEnd()

            MethodVisitor hide = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "hideWallpaper", "(Ljava/lang/Object;)Z", null, null)
            hide.visitCode()
            hide.visitVarInsn(Opcodes.ALOAD, 0)
            hide.visitTypeInsn(Opcodes.CHECKCAST, "a/isn")
            hide.visitVarInsn(Opcodes.ASTORE, 1)
            hide.visitTypeInsn(Opcodes.NEW, "java/lang/StringBuilder")
            hide.visitInsn(Opcodes.DUP)
            hide.visitMethodInsn(Opcodes.INVOKESPECIAL, "java/lang/StringBuilder", "<init>", "()V", false)
            [
                ["key", "Ljava/lang/String;"],
                ["name", "Ljava/lang/String;"],
                ["resource", "Ljava/lang/String;"],
                ["video", "Ljava/lang/String;"]
            ].each { field ->
                hide.visitVarInsn(Opcodes.ALOAD, 1)
                hide.visitFieldInsn(Opcodes.GETFIELD, "a/isn", field[0], field[1])
                hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                    "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
                hide.visitLdcInsn(" ")
                hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                    "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
            }
            hide.visitVarInsn(Opcodes.ALOAD, 1)
            hide.visitMethodInsn(Opcodes.INVOKESTATIC, "a/isv", "label", "(La/isn;)Ljava/lang/String;", false)
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "toString", "()Ljava/lang/String;", false)
            hide.visitFieldInsn(Opcodes.GETSTATIC, "java/util/Locale", "ROOT", "Ljava/util/Locale;")
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "toLowerCase",
                "(Ljava/util/Locale;)Ljava/lang/String;", false)
            hide.visitLdcInsn(".*(flow-light|flow-white|flow white|flow белая|astra white|astra белая|" +
                "autumn-cats|autumn cats|осенние котики|castle|замок в облаках|elf|тёмная эльфийка|" +
                "темная эльфийка|farm|ферма на закате|cats|котики|dusk|сумерки|aurora|аврора|" +
                "liquid|жидкость|alpine-night|alpine night|альпийская ночь|shibuya|сибуя|dunes|дюны|" +
                "prism|призма|waves|волны|bloom|flowers|цветени|цветение|sunset|закат|clouds|облака).*")
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "matches", "(Ljava/lang/String;)Z", false)
            hide.visitInsn(Opcodes.IRETURN)
            hide.visitMaxs(4, 2)
            hide.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

tasks.register("downloadFlowNestedJar") {
    outputs.file(flowNestedJar)
    doLast {
        def output = flowNestedJar.get().asFile
        output.parentFile.mkdirs()
        new URL("https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar").withInputStream { input ->
            output.withOutputStream { stream -> stream << input }
        }
        if (output.length() < 1000000) {
            throw new GradleException("Downloaded Flow JAR is unexpectedly small: ${output.length()} bytes")
        }
        logger.lifecycle("Downloaded original client JAR (${output.length()} bytes)")
    }
}

tasks.register("rebrandFlowNestedJar") {
    dependsOn("downloadFlowNestedJar")
    inputs.file(flowNestedJar)
    outputs.file(rebrandedNestedJar)
    doLast {
        def inputFile = flowNestedJar.get().asFile
        def outputFile = rebrandedNestedJar.get().asFile
        outputFile.parentFile.mkdirs()

        def inputZip = new java.util.zip.ZipFile(inputFile)
        def outputZip = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
        try {
            def entries = inputZip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                def newEntry = new java.util.zip.ZipEntry(entry.name)
                if (entry.time > 0) newEntry.time = entry.time
                outputZip.putNextEntry(newEntry)

                inputZip.getInputStream(entry).withCloseable { stream ->
                    if (entry.name == "fabric.mod.json") {
                        def metadata = new groovy.json.JsonSlurper().parse(stream)
                        metadata.name = "AstraDLC"
                        metadata.description = "AstraDLC Minecraft client"
                        metadata.authors = ["AstraDLC"]
                        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
                        outputZip.write(json.getBytes("UTF-8"))
                        logger.lifecycle("Set nested Fabric display name to AstraDLC (kept mod id '${metadata.id}')")
                    } else if (entry.name == "flow/default-gui.properties") {
                        String properties = stream.getText("UTF-8")
                        properties = properties.replace("theme.Theme=Flow Black", "theme.Theme=Astra Black")
                        outputZip.write(properties.getBytes("UTF-8"))
                    } else if (entry.name.endsWith(".class")) {
                        byte[] originalBytes = stream.readAllBytes()
                        byte[] patchedBytes = rebrandClassBytes(originalBytes)
                        if (entry.name == "flow/dev/a.class") {
                            patchedBytes = patchEncryptedBranding(patchedBytes)
                            logger.lifecycle("Patched encrypted client branding strings")
                        } else if (entry.name == "a/isv.class") {
                            patchedBytes = patchWallpaperCatalog(patchedBytes)
                            logger.lifecycle("Filtered requested wallpaper entries from the picker")
                        }
                        outputZip.write(patchedBytes)
                    } else {
                        stream.transferTo(outputZip)
                    }
                }
                outputZip.closeEntry()
            }
        } finally {
            outputZip.close()
            inputZip.close()
        }
    }
}

tasks.named("jar") {
    dependsOn("rebrandFlowNestedJar")
    from(rebrandedNestedJar) {
        into("META-INF/jars")
        rename { "flow.jar" }
    }
}

/*
 * Recovered decompiler source trees contain intermediary Minecraft symbols,
 * so this wrapper does not compile those copies.
 */
sourceSets {
    main {
        java.setSrcDirs([])
    }
}
