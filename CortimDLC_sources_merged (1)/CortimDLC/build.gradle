                ["Flow User", "AlbaUser"],
                ["Flow Black", "Alba Video"],
                ["Flow White", "Alba White"],
                ["Flow Чёрная", "Alba Видео"],
                ["Flow Черная", "Alba Видео"],
                ["Flow Белая", "Alba Белая"],
                ["Flow2", "AlbaDLC"],
                ["[Flow2]", "[AlbaDLC]"],
                ["Flow", "AlbaDLC"]
            ]
            replacements.each { pair ->
                mv.visitLdcInsn(pair[0])
                mv.visitLdcInsn(pair[1])
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "replace",
                    "(Ljava/lang/CharSequence;Ljava/lang/CharSequence;)Ljava/lang/String;", false)
            }
            mv.visitInsn(Opcodes.ARETURN)
            mv.visitMaxs(3, 1)
            mv.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Filter actual wallpaper entries, not only the image files: the picker is
 * backed by the a.isv entry list. This keeps the selected wallpapers from
 * appearing as empty/broken tiles in either Russian or English UI.
 */
/*
 * The main ClickGUI title comes from a/vvi.get(), which emits "FlowClient"
 * one character at a time with zero-width separators. Rebrand that exact
 * generated title after decoding, without changing its obfuscation or IDs.
 */
/*
 * The menu title is a/vvi.get(): it builds "FlowClient" character-by-character,
 * inserting zero-width separators. For this exact title source, replace the
 * final returned text with AlbaDLC. Avoid rewriting the obfuscated byte array.
 */
def patchVviTitle = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def original = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if ((name == "get" || name == "getRaw") && descriptor == "()Ljava/lang/String;") {
                original[name] = [access: access, descriptor: descriptor, signature: signature, exceptions: exceptions]
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            ["get", "getRaw"].each { methodName ->
                def info = original[methodName]
                if (info == null) {
                    throw new GradleException("Encoded client name method not found: " + methodName)
                }
                MethodVisitor mv = writer.visitMethod(info.access, methodName, info.descriptor,
                    info.signature, info.exceptions as String[])
                mv.visitCode()
                // Preserve the visual zero-width separators on the left rail logo.
                mv.visitLdcInsn(methodName == "get" ? "A\u200Cl\u200Cb\u200Ca\u200CD\u200CL\u200CC" : "AlbaDLC")
                mv.visitInsn(Opcodes.ARETURN)
                mv.visitMaxs(1, 0)
                mv.visitEnd()
            }
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Keep enum ordinals untouched. Click-GUI order is Combat, Player, Visuals,
 * Misc, then Movement so existing movement modules remain accessible.
 */
def patchModuleCategoryOrder = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def original = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if ((name == "values" && descriptor == "()[La/kfa;") ||
                (name == "title" && descriptor == "()Ljava/lang/String;")) {
                original[name] = [access: access, descriptor: descriptor, signature: signature, exceptions: exceptions]
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            if (original.values == null || original.title == null) {
                throw new GradleException("ModuleCategory.values/title methods not found")
            }

            def valuesInfo = original.values
            MethodVisitor values = writer.visitMethod(valuesInfo.access, "values", valuesInfo.descriptor,
                valuesInfo.signature, valuesInfo.exceptions as String[])
            values.visitCode()
            values.visitInsn(Opcodes.ICONST_5)
            values.visitTypeInsn(Opcodes.ANEWARRAY, "a/kfa")
            ["COMBAT", "PLAYER", "RENDER", "MISC", "MOVEMENT"].eachWithIndex { fieldName, index ->
                values.visitInsn(Opcodes.DUP)
                values.visitInsn(Opcodes.ICONST_0 + index)
                values.visitFieldInsn(Opcodes.GETSTATIC, "a/kfa", fieldName, "La/kfa;")
                values.visitInsn(Opcodes.AASTORE)
            }
            values.visitInsn(Opcodes.ARETURN)
            values.visitMaxs(4, 0)
            values.visitEnd()

            // Rename only the Render category label; do not rewrite any other renderer text.
            def titleInfo = original.title
            MethodVisitor title = writer.visitMethod(titleInfo.access, "title", titleInfo.descriptor,
                titleInfo.signature, titleInfo.exceptions as String[])
            title.visitCode()
            org.objectweb.asm.Label originalTitle = new org.objectweb.asm.Label()
            title.visitVarInsn(Opcodes.ALOAD, 0)
            title.visitFieldInsn(Opcodes.GETSTATIC, "a/kfa", "RENDER", "La/kfa;")
            title.visitJumpInsn(Opcodes.IF_ACMPNE, originalTitle)
            title.visitLdcInsn("Visuals")
            title.visitInsn(Opcodes.ARETURN)
            title.visitLabel(originalTitle)
            title.visitVarInsn(Opcodes.ALOAD, 0)
            title.visitFieldInsn(Opcodes.GETFIELD, "a/kfa", "kfb", "Ljava/lang/String;")
            title.visitInsn(Opcodes.ARETURN)
            title.visitMaxs(2, 1)
            title.visitEnd()

            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

def patchWordmark = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        org.objectweb.asm.FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
            // The main menu header reads these static fields directly; changing only LDC strings leaves "FlowClient" visible.
            if (name == "FIRST" && value == "Flow") value = "Alba"
            else if (name == "SECOND" && value == "Client") value = "DLC"
            return super.visitField(access, name, descriptor, signature, value)
        }

        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitLdcInsn(Object value) {
                    if (value == "Flow") value = "Alba"
                    else if (value == "Client") value = "DLC"
                    super.visitLdcInsn(value)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Make the splash render the same current wallpaper that the theme picker
 * selects. The background frame is drawn first; the existing logo and text
 * are rendered afterward by FlowSplash's normal intro path.
 */

def patchWallpaperCatalog = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "frame" && descriptor == "(II)Lcom/mojang/blaze3d/textures/GpuTextureView;") {
                access |= Opcodes.ACC_PUBLIC
            }
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "entries" && descriptor == "()Ljava/util/List;") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitInsn(int opcode) {
                        if (opcode == Opcodes.ARETURN) {
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/isv", "filterEntries",
                                "(Ljava/util/List;)Ljava/util/List;", false)
                        }
                        super.visitInsn(opcode)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            MethodVisitor filter = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "filterEntries", "(Ljava/util/List;)Ljava/util/List;", null, null)
            filter.visitCode()
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            Handle bootstrap = new Handle(Opcodes.H_INVOKESTATIC, "java/lang/invoke/LambdaMetafactory", "metafactory",
                '(Ljava/lang/invoke/MethodHandles$Lookup;Ljava/lang/String;Ljava/lang/invoke/MethodType;' +
                'Ljava/lang/invoke/MethodType;Ljava/lang/invoke/MethodHandle;Ljava/lang/invoke/MethodType;)' +
                'Ljava/lang/invoke/CallSite;', false)
            filter.visitInvokeDynamicInsn("test", "()Ljava/util/function/Predicate;", bootstrap,
                Type.getType("(Ljava/lang/Object;)Z"),
                new Handle(Opcodes.H_INVOKESTATIC, "a/isv", "hideWallpaper", "(Ljava/lang/Object;)Z", false),
                Type.getType("(Ljava/lang/Object;)Z"))
            filter.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "removeIf",
                "(Ljava/util/function/Predicate;)Z", true)
            filter.visitInsn(Opcodes.POP)
            filter.visitVarInsn(Opcodes.ALOAD, 0)
            filter.visitInsn(Opcodes.ARETURN)
            filter.visitMaxs(2, 1)
            filter.visitEnd()

            MethodVisitor hide = super.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_STATIC | Opcodes.ACC_SYNTHETIC,
                "hideWallpaper", "(Ljava/lang/Object;)Z", null, null)
            hide.visitCode()
            hide.visitVarInsn(Opcodes.ALOAD, 0)
            hide.visitTypeInsn(Opcodes.CHECKCAST, "a/isn")
            hide.visitVarInsn(Opcodes.ASTORE, 1)
            hide.visitTypeInsn(Opcodes.NEW, "java/lang/StringBuilder")
            hide.visitInsn(Opcodes.DUP)
            hide.visitMethodInsn(Opcodes.INVOKESPECIAL, "java/lang/StringBuilder", "<init>", "()V", false)
            [
                ["key", "Ljava/lang/String;"],
                ["name", "Ljava/lang/String;"],
                ["resource", "Ljava/lang/String;"],
                ["video", "Ljava/lang/String;"]
            ].each { field ->
                hide.visitVarInsn(Opcodes.ALOAD, 1)
                hide.visitFieldInsn(Opcodes.GETFIELD, "a/isn", field[0], field[1])
                hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                    "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
                hide.visitLdcInsn(" ")
                hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                    "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
            }
            hide.visitVarInsn(Opcodes.ALOAD, 1)
            hide.visitMethodInsn(Opcodes.INVOKESTATIC, "a/isv", "label", "(La/isn;)Ljava/lang/String;", false)
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append",
                "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false)
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "toString", "()Ljava/lang/String;", false)
            hide.visitFieldInsn(Opcodes.GETSTATIC, "java/util/Locale", "ROOT", "Ljava/util/Locale;")
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "toLowerCase",
                "(Ljava/util/Locale;)Ljava/lang/String;", false)
            hide.visitLdcInsn(".*(flow-light|flow-white|flow white|flow белая|astra white|astra белая|alba white|alba белая|" +
                "autumn-cats|autumn cats|осенние котики|castle in clouds|castle-in-clouds|castle|замок в облаках|" +
                "dark elf|dark-elf|elf|тёмная эльфийка|темная эльфийка|farm at sunset|farm-at-sunset|farm|" +
                "ферма на закате|living aurora|living-aurora|aurora live|живая аврора|cats|котики|dusk|сумерки|" +
                "aurora|аврора|liquid|жидкость|alpine-night|alpine night|альпийская ночь|shibuya|сибуя|" +
                "dunes|дюны|prism|призма|waves|волны|bloom|flowers|цветени|цветение|" +
                "living sunset|living-sunset|live sunset|sunset live|живой закат|living clouds|living-clouds|" +
                "live clouds|clouds live|clouds-live|sunset-live|живые облака).*")
            hide.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "matches", "(Ljava/lang/String;)Z", false)
            hide.visitInsn(Opcodes.IRETURN)
            hide.visitMaxs(4, 2)
            hide.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

tasks.register("prepareAlbaVideo") {
    dependsOn("downloadFlowNestedJar")
    // The replacement MP4 is optional until it is uploaded; if absent, use the original complete video.
    inputs.file(flowNestedJar)
    outputs.file(albaVideoFile)
    doLast {
        byte[] video = null
        String sourceDescription = null

        if (albaSourceVideoFile.isFile()) {
            video = albaSourceVideoFile.bytes
            sourceDescription = "uploaded video-data/alba-background.mp4"
        } else {
            // Until a replacement MP4 is uploaded, reuse the complete original video.
            // The old base64 fragments were incomplete and could silently produce a blank background.
            def nestedZip = new java.util.zip.ZipFile(flowNestedJar.get().asFile)
            try {
                def original = nestedZip.getEntry("flow_offline_assets/video/flow-dark.mp4")
                if (original == null) {
                    throw new GradleException("Original flow-dark.mp4 not found and no uploaded Alba MP4 exists")
                }
                nestedZip.getInputStream(original).withCloseable { input ->
                    video = input.readAllBytes()
                }
                sourceDescription = "original bundled flow-dark.mp4 (until Alba MP4 is uploaded)"
            } finally {
                nestedZip.close()
            }
        }

        if (video == null || video.length < 10000 || video.length < 12 ||
            new String(video, 4, 4, "US-ASCII") != "ftyp") {
            throw new GradleException("Alba background MP4 is invalid or incomplete")
        }

        def output = albaVideoFile.get().asFile
        output.parentFile.mkdirs()
        output.bytes = video
        logger.lifecycle("Prepared Alba background video from " + sourceDescription + " (" + video.length + " bytes)")
    }
}

tasks.register("prepareAlbaUiAssets") {
    dependsOn("prepareAlbaVideo")
    outputs.files(albaLogoFile, albaLogoSilverFile, albaLogoInkFile, albaThumbnailFile)
    doLast {
        def makeLogo = { int w, int h, float phase, boolean ink ->
            def image = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = image.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
            g.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
            g.setRenderingHint(java.awt.RenderingHints.KEY_STROKE_CONTROL, java.awt.RenderingHints.VALUE_STROKE_PURE)
            int fontSize = Math.max(12, (int)(h * 0.90))
            def font = new java.awt.Font("SansSerif", java.awt.Font.BOLD | java.awt.Font.ITALIC, fontSize)
            def glyph = font.createGlyphVector(g.getFontRenderContext(), "A")
            def raw = glyph.getOutline()
            def bounds = raw.getBounds2D()
            double sx = Math.min((w * 0.82d) / Math.max(1d, bounds.width), 1.7d)
            double sy = Math.min((h * 0.86d) / Math.max(1d, bounds.height), 1.65d)
            def tx = new java.awt.geom.AffineTransform()
            tx.translate((w - bounds.width * sx) / 2d - bounds.x * sx,
                         (h - bounds.height * sy) / 2d - bounds.y * sy)
            tx.scale(sx, sy)
            def shape = tx.createTransformedShape(raw)
            def shadowTx = java.awt.geom.AffineTransform.getTranslateInstance(0d, h * 0.018d)
            def shadow = shadowTx.createTransformedShape(shape)
            g.setStroke(new java.awt.BasicStroke((float)Math.max(1.0d, h * 0.035d),
                java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
            g.setColor(new java.awt.Color(0, 0, 0, 220))
            g.draw(shadow)
            g.fill(shadow)
            float startX = (float)(-w + phase * 2f * w)
            float endX = startX + w
            float[] stops = [0f, 0.30f, 0.47f, 0.66f, 1f] as float[]
            java.awt.Color[] colors = ink
                ? ([new java.awt.Color(18, 20, 24), new java.awt.Color(88, 92, 100),
                    new java.awt.Color(230, 234, 240), new java.awt.Color(32, 35, 40),
                    new java.awt.Color(148, 153, 160)] as java.awt.Color[])
                : ([new java.awt.Color(70, 75, 82), new java.awt.Color(205, 210, 218),
                    new java.awt.Color(255, 255, 255), new java.awt.Color(85, 91, 100),
                    new java.awt.Color(232, 237, 244)] as java.awt.Color[])
            g.setPaint(new java.awt.LinearGradientPaint(
                new java.awt.geom.Point2D.Float(startX, 0f),
                new java.awt.geom.Point2D.Float(endX, (float)h), stops, colors))
            g.fill(shape)
            g.setStroke(new java.awt.BasicStroke((float)Math.max(1.0d, h * 0.025d),
                java.awt.BasicStroke.CAP_ROUND, java.awt.BasicStroke.JOIN_ROUND))
            g.setColor(new java.awt.Color(225, 230, 238, 230))
            g.draw(shape)
            g.setStroke(new java.awt.BasicStroke((float)Math.max(0.5d, h * 0.007d)))
            g.setColor(new java.awt.Color(255, 255, 255, 140))
            g.draw(shape)
            g.dispose()
            return image
        }

        def outDir = albaLogoFile.get().asFile.parentFile
        outDir.mkdirs()
        javax.imageio.ImageIO.write(makeLogo(512, 512, 0.3f, false), "png", albaLogoFile.get().asFile)
        def silver = new java.awt.image.BufferedImage(1280, 768, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def inkSheet = new java.awt.image.BufferedImage(1280, 768, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def sg = silver.createGraphics()
        def ig = inkSheet.createGraphics()
        for (int i = 0; i < 60; i++) {
            int col = i % 10
            int row = (int)(i / 10)
            float phase = i / 59f
            sg.drawImage(makeLogo(128, 128, phase, false), col * 128, row * 128, null)
            ig.drawImage(makeLogo(128, 128, phase, true), col * 128, row * 128, null)
        }
        sg.dispose()
        ig.dispose()
        javax.imageio.ImageIO.write(silver, "png", albaLogoSilverFile.get().asFile)
        javax.imageio.ImageIO.write(inkSheet, "png", albaLogoInkFile.get().asFile)
        // 16:9 poster for the selected video wallpaper.
        def thumb = new java.awt.image.BufferedImage(1280, 720, java.awt.image.BufferedImage.TYPE_INT_RGB)
        def tg = thumb.createGraphics()
        tg.setColor(new java.awt.Color(7, 9, 13))
        tg.fillRect(0, 0, 1280, 720)
        tg.drawImage(makeLogo(420, 420, 0.3f, false), 430, 150, null)
        tg.dispose()
        def thumbFile = albaThumbnailFile.get().asFile
        javax.imageio.ImageIO.write(thumb, "jpg", thumbFile)
        try {
            def command = new ProcessBuilder(
                "ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                "-ss", "0.3", "-i", albaVideoFile.get().asFile.absolutePath,
                "-frames:v", "1",
                "-vf", "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720",
                thumbFile.absolutePath
            ).redirectErrorStream(true).start()
            command.inputStream.withCloseable { it.transferTo(new java.io.ByteArrayOutputStream()) }
            int exitCode = command.waitFor()
            if (exitCode == 0 && thumbFile.isFile() && thumbFile.length() > 1000) {
                logger.lifecycle("Extracted a 1280x720 poster frame from the video")
            } else {
                logger.lifecycle("ffmpeg could not extract a poster; using the generated 16:9 Alba card")
            }
        } catch (Throwable ignored) {
            logger.lifecycle("ffmpeg unavailable; using the generated 16:9 Alba card")
        }
        logger.lifecycle("Generated Alba logos and 16:9 wallpaper thumbnail")
    }
}

tasks.register("downloadFlowNestedJar") {
    outputs.file(flowNestedJar)
    doLast {
        def output = flowNestedJar.get().asFile
        output.parentFile.mkdirs()
        new URL("https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar").withInputStream { input ->
            output.withOutputStream { stream -> stream << input }
        }
        if (output.length() < 1000000) {
            throw new GradleException("Downloaded Flow JAR is unexpectedly small: ${output.length()} bytes")
        }
        logger.lifecycle("Downloaded original client JAR (${output.length()} bytes)")
    }
}

tasks.register("rebrandFlowNestedJar") {
    dependsOn("downloadFlowNestedJar", "prepareAlbaUiAssets")
    inputs.file(flowNestedJar)
    inputs.files(albaVideoFile, albaLogoFile, albaLogoSilverFile, albaLogoInkFile, albaThumbnailFile)
    outputs.file(rebrandedNestedJar)
    doLast {
        def inputFile = flowNestedJar.get().asFile
        def outputFile = rebrandedNestedJar.get().asFile
        outputFile.parentFile.mkdirs()

        def inputZip = new java.util.zip.ZipFile(inputFile)
        def outputZip = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
        try {
            def entries = inputZip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                def entryNameLower = entry.name.toLowerCase(Locale.ROOT)
                if (entry.name.endsWith(".mp4") || entry.name.endsWith(".webm") ||
                    entryNameLower.contains("wallpaper") || entryNameLower.contains("logo") ||
                    entryNameLower.contains("theme") || entryNameLower.contains("loading") ||
                    entryNameLower.contains("splash")) {
                    logger.lifecycle("ALBA_SCAN_RESOURCE " + entry.name)
                }
                def newEntry = new java.util.zip.ZipEntry(entry.name)
                if (entry.time > 0) newEntry.time = entry.time
                outputZip.putNextEntry(newEntry)

                inputZip.getInputStream(entry).withCloseable { stream ->
                    if (entry.name == "fabric.mod.json") {
                        def metadata = new groovy.json.JsonSlurper().parse(stream)
                        metadata.name = "AlbaDLC"
                        metadata.description = "AlbaDLC Minecraft client"
                        metadata.authors = ["AlbaDLC"]
                        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
                        outputZip.write(json.getBytes("UTF-8"))
                        logger.lifecycle("Set nested Fabric display name to AlbaDLC (kept mod id '${metadata.id}')")
                    } else if (entry.name == "flow/default-gui.properties") {
                        // Internal theme keys must stay original; only displayed labels are rebranded.
                        stream.transferTo(outputZip)
                    } else if (entry.name == "flow/logo.png") {
                        outputZip.write(albaLogoFile.get().asFile.bytes)
                        logger.lifecycle("Replaced logo F with metallic Alba A")
                    } else if (entry.name == "flow/logo_anim_silver.png") {
                        outputZip.write(albaLogoSilverFile.get().asFile.bytes)
                    } else if (entry.name == "flow/logo_anim_ink.png") {
                        outputZip.write(albaLogoInkFile.get().asFile.bytes)
                    } else if (entry.name == "flow_offline_assets/video/flow-dark.mp4") {
                        outputZip.write(albaVideoFile.get().asFile.bytes)
                        logger.lifecycle("Replaced dark wallpaper video with the uploaded Alba MP4")
                    } else if (entry.name == "flow_offline_assets/video/flow-dark.jpg") {
                        outputZip.write(albaThumbnailFile.get().asFile.bytes)
                        logger.lifecycle("Replaced dark wallpaper preview with Alba A")
                    } else if (entry.name.endsWith(".class")) {
                        byte[] originalBytes = stream.readAllBytes()
                        if (entry.name == "a/isv.class" || entry.name == "a/isn.class" ||
                            entry.name == "flow/dev/a.class") {
                            try {
                                new ClassReader(originalBytes).accept(new ClassVisitor(Opcodes.ASM9) {
                                    @Override
                                    void visit(int version, int access, String name, String signature, String superName, String[] interfaces) {
                                        logger.lifecycle("ALBA_SCAN_CLASS " + name + " extends " + superName)
                                    }
                                    @Override
                                    org.objectweb.asm.FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
                                        logger.lifecycle("ALBA_SCAN_FIELD " + name + " " + descriptor)
                                        return null
                                    }
                                    @Override
                                    MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                                        logger.lifecycle("ALBA_SCAN_METHOD " + name + " " + descriptor)
                                        return null
                                    }
                                }, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                            } catch (Exception scanError) {
                                logger.lifecycle("ALBA_SCAN_CLASS_ERROR " + entry.name + ": " + scanError.message)
                            }
                        }
                        byte[] patchedBytes = rebrandClassBytes(originalBytes)
                        if (isMenuSceneRendererClass(originalBytes)) {
                            patchedBytes = patchMenuSceneRendererFallback(patchedBytes)
                            logger.lifecycle("Patched direct wallpaper drawing in " + new ClassReader(originalBytes).className + " to avoid the unstable scene shader")
                        } else if (entry.name == "flow/dev/a.class") {
                            patchedBytes = patchEncryptedBranding(patchedBytes)
                            logger.lifecycle("Patched encrypted client branding strings")
                        } else if (entry.name == "a/jzh.class") {
                            patchedBytes = patchMenuArtCacheExecutor(patchedBytes)
                            logger.lifecycle("Enabled three parallel menu-art workers to reduce wallpaper-switch delay")
                        } else if (entry.name == "a/isv.class") {
                            patchedBytes = patchWallpaperCatalog(patchedBytes)
                            patchedBytes = patchClientBackgroundDefault(patchedBytes)
                            logger.lifecycle("Kept the client wallpaper editor video-first; dark video is labelled Alba Video")
                        } else if (entry.name == "a/kbs.class") {
                            patchedBytes = patchTitleWallpaperCatalog(patchedBytes)
                            logger.lifecycle("Removed Alba White/Black from title wallpapers; kept remaining themes")
                        } else if (entry.name == "a/kfa.class") {
                            patchedBytes = patchModuleCategoryOrder(patchedBytes)
                            logger.lifecycle("Reordered sidebar categories: Combat, Player, Visuals, Misc, Movement")
                        } else if (entry.name == "a/iov.class") {
                            // Preserve the original Theme settings, presets, and editor behavior.
                        } else if (entry.name == "a/jte.class") {
                            patchedBytes = patchTitleMenuRenderWarmup(patchedBytes)
                            patchedBytes = patchMainMenuSettings(patchedBytes)
                            patchedBytes = patchMenuScreenSocialLinksAndStyle(patchedBytes)
                            patchedBytes = patchMenuUtilityIconLayout(patchedBytes)
                            patchedBytes = patchWallpaperPickerPersistentSettings(patchedBytes)
                            patchedBytes = patchRemoveMenuBackgroundReset(patchedBytes)
                            // Do not replace method_25420 with Minecraft's plain panorama renderer:
                            // the original title-screen method owns the selected wallpaper layer.
                            logger.lifecycle("Warmed the selected Minecraft title wallpaper before the first visible frame")
                            logger.lifecycle("Moved Telegram/Discord to bottom-left; moved wallpaper/power beside menu buttons with matching hover and click hitboxes")
                            logger.lifecycle("Preserved the original title-screen wallpaper/background renderer")
                            logger.lifecycle("Fixed main menu title, centered buttons, disabled blur/dimming, set corner rounding to 100%, and simplified settings")

                        } else if (entry.name == "a/kfe.class") {
                            patchedBytes = patchModuleDisplayNames(patchedBytes)
                            logger.lifecycle("Renamed module labels AutoMace -> MaceHelper and KeyPearl -> ClickPearl")
                        } else if (entry.name == "a/kvz.class") {
                            patchedBytes = patchClickPearlCategory(patchedBytes)
                            logger.lifecycle("Moved ClickPearl from Combat to Player")
                        } else if (entry.name == "a/kfx.class") {
                            patchedBytes = patchModuleRegistration(patchedBytes)
                            logger.lifecycle("Hidden ChestLooter, ChestSorter, SoulESP, MotionBlur, MobESP, TransparentFriends, and AncientFarmer from module registration; implementation classes retained")
                        } else if (entry.name == "a/nxa.class") {
                            patchedBytes = patchPeriodicJumpHooks(patchedBytes)
                            patchedBytes = patchAutoWardenTeleportFlow(patchedBytes)
                            logger.lifecycle("Added periodic walking jumps to AutoWarden")
                        } else if (entry.name == "a/mpq.class") {
                            patchedBytes = patchPeriodicJumpHooks(patchedBytes)
                            patchedBytes = patchAutoEndLootTeleport(patchedBytes)
                            logger.lifecycle("Added periodic walking jumps to AutoEnd")
                        } else if (entry.name == "a/hjg.class") {
                            patchedBytes = patchModuleCardVisuals(patchedBytes)
                            logger.lifecycle("Safely restyled module card corners without injecting render-time control flow")
                        } else if (isUiKitClass(originalBytes)) {
                            patchedBytes = patchUiKitSwitch(patchedBytes)
                            logger.lifecycle("Refined the native module-switch shape while preserving its original render logic")
                        } else if (entry.name == "a/hlc.class") {
                            patchedBytes = patchClientPanelCleanup(patchedBytes)
                            patchedBytes = patchGuiUtilityButtonLayout(patchedBytes)
                            patchedBytes = patchHudVisualPlacement(patchedBytes)
                            patchedBytes = patchClickGuiHeaderLayout(patchedBytes)
                            patchedBytes = patchHideAvatarHoverPopup(patchedBytes)
                            logger.lifecycle("Removed the category heading/count and expanded search across the top header")
                            logger.lifecycle("Disabled the account-avatar hover popup")
                            logger.lifecycle("Centered language and power controls along the bottom")
                            logger.lifecycle("Moved HUD panels into Visuals and removed the separate HUD tab")
                            logger.lifecycle("Preserved Theme tab and Custom theme editor; removed Party panels; set Cosmetics to Coming Soon and kept the power button visible")
                        } else if (entry.name == "a/jlx.class") {
                            patchedBytes = patchWatermark(patchedBytes)
                            logger.lifecycle("Removed dog/logo and ProgramData account badge from the HUD watermark")
                        } else if (entry.name == "a/vvi.class") {
                            patchedBytes = patchVviTitle(patchedBytes)
                            logger.lifecycle("Replaced both encoded client-logo accessors with AlbaDLC")
                        } else if (entry.name == "flow/splash/Wordmark.class") {
                            patchedBytes = patchWordmark(patchedBytes)
                            logger.lifecycle("Rebranded splash wordmark to AlbaDLC")
                        } else if (entry.name == "flow/Flow.class") {
                            patchedBytes = patchForceCustomMainMenu(patchedBytes)
                            logger.lifecycle("Ensured the custom AlbaDLC menu opens instead of vanilla TitleScreen")
                        } else if (entry.name == "flow/splash/Splash.class") {
                            patchedBytes = patchSplashController(patchedBytes)
                            logger.lifecycle("Skipped Flow2's custom splash takeover; preserved the native Minecraft loading screen")
                        } else if (entry.name == "flow/splash/ClientLoad.class") {
                            patchedBytes = patchClientLoadSplash(patchedBytes)
                            logger.lifecycle("Kept startup warming active without video splash or progress strip")
                        }
                        // Rewrite invite literals in every nested class, not just the title-screen
                        // class: secondary click handlers and alternate menu widgets may own their
                        // own stale Discord URLs.
                        patchedBytes = patchDiscordInviteUrls(patchedBytes)
                        outputZip.write(patchedBytes)
                    } else {
                        stream.transferTo(outputZip)
                    }
                }
                outputZip.closeEntry()
            }
            def hopEntry = new java.util.zip.ZipEntry("a/AlbaPeriodicHop.class")
            outputZip.putNextEntry(hopEntry)
            outputZip.write(createAlbaPeriodicHopClass())
            outputZip.closeEntry()
            logger.lifecycle("Bundled shared periodic-hop helper for AutoWarden and AutoEnd")

            def videoBytes = albaVideoFile.get().asFile.bytes
            def videoEntry = new java.util.zip.ZipEntry("assets/alba/alba-background.mp4")
            outputZip.putNextEntry(videoEntry)
            outputZip.write(videoBytes)
            outputZip.closeEntry()
            logger.lifecycle("Bundled Alba background video as assets/alba/alba-background.mp4")
        } finally {
            outputZip.close()
            inputZip.close()
        }
    }
}

tasks.named("jar") {
    dependsOn("rebrandFlowNestedJar")
    from(rebrandedNestedJar) {
        into("META-INF/jars")
        rename { "flow.jar" }
    }
}

/*
 * Recovered decompiler source trees contain intermediary Minecraft symbols,
 * so this wrapper does not compile those copies.
 */
sourceSets {
    main {
        java.setSrcDirs([])
    }
