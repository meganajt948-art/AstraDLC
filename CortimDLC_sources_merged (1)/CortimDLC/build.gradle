    before.visitJumpInsn(Opcodes.IFEQ, beforeDone)
    before.visitVarInsn(Opcodes.ALOAD, 1)
    before.visitFieldInsn(Opcodes.GETFIELD, "net/minecraft/class_310", "field_1690", "Lnet/minecraft/class_315;")
    before.visitJumpInsn(Opcodes.IFNULL, beforeDone)
    before.visitVarInsn(Opcodes.ALOAD, 1)
    before.visitFieldInsn(Opcodes.GETFIELD, "net/minecraft/class_310", "field_1690", "Lnet/minecraft/class_315;")
    before.visitFieldInsn(Opcodes.GETFIELD, "net/minecraft/class_315", "field_1903", "Lnet/minecraft/class_304;")
