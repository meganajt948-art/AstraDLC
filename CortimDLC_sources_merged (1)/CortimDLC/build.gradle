plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

/*
 * Rebrand visible client labels in the nested Flow JAR without changing class
 * names, package names, or the nested mod id needed by its runtime dependencies.
 */
def flowNestedJar = layout.buildDirectory.file("flow-dependency/flow.jar")
def rebrandedNestedJar = layout.buildDirectory.file("flow-dependency/astradlc-core.jar")

tasks.register("downloadFlowNestedJar") {
    outputs.file(flowNestedJar)
    doLast {
        def output = flowNestedJar.get().asFile
        output.parentFile.mkdirs()
        new URL("https://github.com/meganajt948-art/AstraDLC/releases/download/release/flow.jar").withInputStream { input ->
            output.withOutputStream { stream -> stream << input }
        }
        if (output.length() < 1000000) {
            throw new GradleException("Downloaded Flow JAR is unexpectedly small: ${output.length()} bytes")
        }
        logger.lifecycle("Downloaded original client JAR (${output.length()} bytes)")
    }
}

/*
 * Safely rewrite CONSTANT_Utf8 entries in class files. The class-file parser
 * preserves all other constant-pool entries and class bytes exactly.
 */
def patchClassStrings = { byte[] original, String entryName ->
    def input = new DataInputStream(new ByteArrayInputStream(original))
    def bytes = new ByteArrayOutputStream(original.length + 128)
    def output = new DataOutputStream(bytes)

    byte[] header = new byte[8]
    input.readFully(header)
    output.write(header)
    int cpCount = input.readUnsignedShort()
    output.writeShort(cpCount)

    for (int i = 1; i < cpCount; i++) {
        int tag = input.readUnsignedByte()
        output.writeByte(tag)
        switch (tag) {
            case 1: // CONSTANT_Utf8
                int len = input.readUnsignedShort()
                byte[] raw = new byte[len]
                input.readFully(raw)
                String value = new String(raw, "UTF-8")
                String changed = value

                changed = changed.replace("FlowClient", "AstraDLC")
                changed = changed.replace("FlowUser", "AstraUser")
                changed = changed.replace("Flow User", "AstraUser")
                changed = changed.replace("Flow2User", "AstraUser")
                changed = changed.replace("Flow2 User", "AstraUser")

                if (value == "Flow") {
                    changed = "Astra"
                }
                if (value == "Flow2") {
                    changed = "AstraUser"
                }
                if (entryName == "flow/splash/Wordmark.class") {
                    if (value == "Flow") changed = "Astra"
                    if (value == "Client") changed = "DLC"
                }

                byte[] encoded = changed.getBytes("UTF-8")
                output.writeShort(encoded.length)
                output.write(encoded)
                break
            case 3: case 4: case 9: case 10: case 11: case 12: case 17: case 18:
                byte[] four = new byte[4]
                input.readFully(four)
                output.write(four)
                break
            case 5: case 6:
                byte[] eight = new byte[8]
                input.readFully(eight)
                output.write(eight)
                i++
                break
            case 7: case 8: case 16: case 19: case 20:
                byte[] two = new byte[2]
                input.readFully(two)
                output.write(two)
                break
            case 15:
                byte[] three = new byte[3]
                input.readFully(three)
                output.write(three)
                break
            default:
                throw new GradleException("Unsupported class constant-pool tag ${tag} in ${entryName}")
        }
    }

    byte[] remainder = input.readAllBytes()
    output.write(remainder)
    output.flush()
    return bytes.toByteArray()
}

tasks.register("rebrandFlowNestedJar") {
    dependsOn("downloadFlowNestedJar")
    inputs.file(flowNestedJar)
    outputs.file(rebrandedNestedJar)
    doLast {
        def inputFile = flowNestedJar.get().asFile
        def outputFile = rebrandedNestedJar.get().asFile
        outputFile.parentFile.mkdirs()

        def inputZip = new java.util.zip.ZipFile(inputFile)
        def outputZip = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
        int patchedClasses = 0
        try {
            def entries = inputZip.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                def newEntry = new java.util.zip.ZipEntry(entry.name)
                if (entry.time > 0) newEntry.time = entry.time
                outputZip.putNextEntry(newEntry)

                inputZip.getInputStream(entry).withCloseable { stream ->
                    if (entry.name == "fabric.mod.json") {
                        def metadata = new groovy.json.JsonSlurper().parse(stream)
                        metadata.name = "AstraDLC"
                        metadata.description = "AstraDLC Minecraft client"
                        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
                        outputZip.write(json.getBytes("UTF-8"))
                        logger.lifecycle("Set nested Fabric display name to AstraDLC (kept mod id '${metadata.id}')")
                    } else if (entry.name.endsWith(".class")) {
                        byte[] original = stream.readAllBytes()
                        byte[] changed = patchClassStrings(original, entry.name)
                        if (!java.util.Arrays.equals(original, changed)) patchedClasses++
                        outputZip.write(changed)
                    } else {
                        stream.transferTo(outputZip)
                    }
                }
                outputZip.closeEntry()
            }
        } finally {
            outputZip.close()
            inputZip.close()
        }
        logger.lifecycle("Rebranded visible strings in ${patchedClasses} class files")
    }
}

tasks.named("jar") {
    dependsOn("rebrandFlowNestedJar")
    from(rebrandedNestedJar) {
        into("META-INF/jars")
        rename { "flow.jar" }
    }
}

/*
 * Recovered decompiler source trees still contain intermediary Minecraft
 * symbols and invalid Java, so the wrapper compiles no decompiled copies.
 */
sourceSets {
    main {
        java.setSrcDirs([])
    }
}
