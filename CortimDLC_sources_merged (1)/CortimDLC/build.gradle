            center.visitVarInsn(Opcodes.ALOAD, 0)
            center.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jve", "F")
            center.visitLdcInsn(138.0F)
            center.visitInsn(Opcodes.FSUB)
            center.visitLdcInsn(2.0F)
            center.visitInsn(Opcodes.FDIV)
            center.visitInsn(Opcodes.FRETURN)
            center.visitMaxs(0, 0)
            center.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Skip Flow2's custom full-screen video splash without replacing the Minecraft
 * loading UI. ClientLoad.show still marks its one-shot request handled, so boot
 * warming continues in the background and no fallback splash is scheduled.
 */

/*
 * Make the custom AlbaDLC title menu the authoritative screen. ScreenEvents and
 * Splash.tick normally replace vanilla TitleScreen, but either hook can be skipped
 * if a splash/backdrop helper fails. This end-tick fallback only reacts to the
 * vanilla title screen, never to world screens or AlbaDLC screens.
 */
// Build marker: 2026-10-27 custom title-screen restore release.
// Build marker: 2026-10-28 publish stable title click handler build.
// Build marker: 2026-10-27 publish the startup classloader fix under its own release tag.
def patchForceCustomMainMenu = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != "onEndTick" || descriptor != "(Lnet/minecraft/class_310;)V") return mv
            found = true
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitCode() {
                    super.visitCode()
                    org.objectweb.asm.Label skip = new org.objectweb.asm.Label()
                    // Only replace the native TitleScreen when no overlay/loading screen is active.
                    // Do not reference classes from the outer loader JAR here: this method is
                    // running inside the nested flow.jar class loader.
                    super.visitVarInsn(Opcodes.ALOAD, 1)
                    super.visitFieldInsn(Opcodes.GETFIELD, "net/minecraft/class_310", "field_1755", "Lnet/minecraft/class_437;")
                    super.visitTypeInsn(Opcodes.INSTANCEOF, "net/minecraft/class_442")
                    super.visitJumpInsn(Opcodes.IFEQ, skip)
                    super.visitVarInsn(Opcodes.ALOAD, 1)
                    super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_310", "method_18506", "()Lnet/minecraft/class_4071;", false)
                    super.visitJumpInsn(Opcodes.IFNONNULL, skip)
                    // a/jte is the bundled client's MenuScreen class.
                    super.visitVarInsn(Opcodes.ALOAD, 1)
                    super.visitTypeInsn(Opcodes.NEW, "a/jte")
                    super.visitInsn(Opcodes.DUP)
                    super.visitMethodInsn(Opcodes.INVOKESPECIAL, "a/jte", "<init>", "()V", false)
                    super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_310", "method_1507", "(Lnet/minecraft/class_437;)V", false)
                    super.visitLabel(skip)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found) throw new GradleException("Flow.onEndTick(Class_310) not found; cannot guarantee custom title menu activation")
    logger.lifecycle("Installed a fallback that replaces vanilla TitleScreen with AlbaDLC MenuScreen")
    return writer.toByteArray()
}

