                            awaitSocialY = false
                            org.objectweb.asm.Label checkExit = new org.objectweb.asm.Label()
                            org.objectweb.asm.Label topRight = new org.objectweb.asm.Label()
                            org.objectweb.asm.Label yReady = new org.objectweb.asm.Label()
                            super.visitVarInsn(Opcodes.ILOAD, 3)
                            super.visitInsn(Opcodes.ICONST_2)
                            super.visitJumpInsn(Opcodes.IF_ICMPGE, checkExit)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitFieldInsn(Opcodes.GETFIELD, ownerClass, "jvf", "F")
                            super.visitLdcInsn(33.0F)
                            super.visitInsn(Opcodes.FSUB)
                            super.visitJumpInsn(Opcodes.GOTO, yReady)
                            super.visitLabel(checkExit)
                            super.visitVarInsn(Opcodes.ILOAD, 3)
                            super.visitInsn(Opcodes.ICONST_3)
                            super.visitJumpInsn(Opcodes.IF_ICMPNE, topRight)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitInsn(Opcodes.ICONST_4)
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "jwj", "(I)F", false)
                            super.visitJumpInsn(Opcodes.GOTO, yReady)
                            super.visitLabel(topRight)
                            super.visitLdcInsn(12.0F)
