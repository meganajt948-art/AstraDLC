            if (rowInfo.isEmpty()) throw new GradleException("Background settings row-position method jxt(I)F not found")
            def info = rowInfo
            MethodVisitor row = writer.visitMethod(info.access, "jxt", info.descriptor, info.signature, info.exceptions as String[])
            row.visitCode()
            org.objectweb.asm.Label keep = new org.objectweb.asm.Label()
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 8)
            row.visitJumpInsn(Opcodes.IF_ICMPNE, keep)
            row.visitLdcInsn(-10000.0f)
            row.visitInsn(Opcodes.FRETURN)
            row.visitLabel(keep)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "albaOriginalBackgroundRowY", "(I)F", false)
            row.visitInsn(Opcodes.FRETURN)
            row.visitMaxs(0, 0)
