/* Remove the centered category heading/count and extend search from the sidebar inset. */
def patchClickGuiHeaderLayout = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    def changed = [title: false, subtitle: false, widths: 0]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != "hqx" || descriptor != "(Lnet/minecraft/class_332;FF)V") return mv
            found = true
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitLdcInsn(Object value) {
                    // The input's width and its empty-field hint offset must expand together.
                    if (value instanceof Float &&
                        Math.abs(((Float)value).floatValue() - 136.0f) < 0.001f) {
                        value = 300.0f
                        changed.widths = changed.widths + 1
                    }
                    super.visitLdcInsn(value)
                }

                @Override
                void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                    super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    // Keep category state updated, but turn its displayed title into an empty string.
                    if (opcode == Opcodes.INVOKESTATIC && callOwner == "a/wap" &&
                        callName == "t" && callDescriptor == "(Ljava/lang/String;)Ljava/lang/String;") {
                        super.visitInsn(Opcodes.POP)
                        super.visitLdcInsn("")
                        changed.title = true
                    }
                    // The subtitle is the old "0 of 6" category count below the heading.
                    if (opcode == Opcodes.INVOKEVIRTUAL && callOwner == "a/hlc" &&
                        callName == "hqw" && callDescriptor == "(La/hkv;FF)Ljava/lang/String;") {
                        super.visitInsn(Opcodes.POP)
                        super.visitLdcInsn("")
                        changed.subtitle = true
                    }
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found || !changed.title || !changed.subtitle || changed.widths < 2) {
        throw new GradleException("ClickGUI search/header patch points not found: method=" + found +
            ", title=" + changed.title + ", subtitle=" + changed.subtitle + ", widths=" + changed.widths)
    }
    return writer.toByteArray()
}

/* Do not render the profile/avatar strip when the cursor enters its old hover zone. */
def patchHideAvatarHoverPopup = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def original = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "hqr" && descriptor == "(Lnet/minecraft/class_332;FF)V") {
                original.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }

        @Override
        void visitEnd() {
            if (original.isEmpty()) throw new GradleException("ClickGUI avatar hover popup method hqr not found")
            MethodVisitor mv = super.visitMethod(original.access, "hqr", original.descriptor,
                original.signature, original.exceptions as String[])
            mv.visitCode()
            mv.visitInsn(Opcodes.RETURN)
            mv.visitMaxs(0, 4)
            mv.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * AutoWarden: after entering a loot anarchy, always attempt the configured
 * warp/home command instead of trusting cached timer/position data from a
 * different sub-server. Later checks still validate the actual teleport.
 * Also respect the global "Teleport by" option when returning to the save base.
 */
def patchAutoWardenTeleportFlow = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    if (reader.className != "a/nxa") {
        throw new GradleException("AutoWarden teleport patch received unexpected class: " + reader.className)
    }
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def found = [
        lootState: false,
        firstWardenCheck: false,
        firstSavedPositionCheck: false,
        saveState: false,
        saveModeSelection: false
    ]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "olz" && descriptor == "()V") {
                found.lootState = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        // These are the pre-command early exits. Stale cached timers or a
                        // previously visited coordinate must not block the configured teleport.
                        if (callOwner == "a/nxa" && callDescriptor == "()Z" &&
                            callName == "omg" && !found.firstWardenCheck) {
                            super.visitInsn(Opcodes.POP)
                            super.visitInsn(Opcodes.ICONST_0)
                            found.firstWardenCheck = true
                            return
                        }
                        if (callOwner == "a/nxa" && callDescriptor == "()Z" &&
                            callName == "omc" && !found.firstSavedPositionCheck) {
                            super.visitInsn(Opcodes.POP)
                            super.visitInsn(Opcodes.ICONST_0)
                            found.firstSavedPositionCheck = true
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
            if (name == "omn" && descriptor == "()V") {
                found.saveState = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        // Use the same mode-aware command builder as the loot base:
                        // "Home" -> home <name>, "Warp" -> warp <name>.
                        if (callOwner == "a/nxa" && callName == "olu" &&
                            callDescriptor == "()Ljava/lang/String;") {
                            callName = "olt"
                            found.saveModeSelection = true
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
            return mv
        }
    }
    reader.accept(visitor, 0)
    if (!found.lootState || !found.firstWardenCheck || !found.firstSavedPositionCheck ||
        !found.saveState || !found.saveModeSelection) {
        throw new GradleException("AutoWarden teleport patch points not found: " + found)
    }
    logger.lifecycle("AutoWarden: force configured warp/home after loot-anarchy join; honor Warp mode on save base")
    return writer.toByteArray()
}

/* Safer module-card restyle: only adjust existing geometry constants; no injected render branches. */
def patchModuleCardVisuals = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    boolean foundRender = false
    boolean foundRadius = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name != "render" || descriptor != "(Lnet/minecraft/class_332;La/hlc;FFF)V") return mv
            foundRender = true
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitLdcInsn(Object value) {
                    if (!foundRadius && value instanceof Float &&
                        Math.abs(((Float)value).floatValue() - 7.0f) < 0.001f) {
                        value = 4.0f
                        foundRadius = true
                    }
                    super.visitLdcInsn(value)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!foundRender || !foundRadius) {
        throw new GradleException("Safe module-card geometry patch point not found: render=" + foundRender + ", radius=" + foundRadius)
    }
    return writer.toByteArray()
}

