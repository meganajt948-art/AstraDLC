                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                        if (opcode == Opcodes.INVOKESTATIC && methodDescriptor == "(Lnet/minecraft/class_332;Z)V") {
                            found.preview = true
                            org.objectweb.asm.Label useCurrentValue = new org.objectweb.asm.Label()
                            org.objectweb.asm.Label noPreview = new org.objectweb.asm.Label()
                            org.objectweb.asm.Label callRenderer = new org.objectweb.asm.Label()
                            // Stack: canvas, current boolean (previously true only on the HUD tab).
                            super.visitInsn(Opcodes.DUP)
                            super.visitJumpInsn(Opcodes.IFNE, useCurrentValue)
                            super.visitInsn(Opcodes.POP)
                            // HUD preview is shown in Visuals too, but not while search is active.
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitFieldInsn(Opcodes.GETFIELD, "a/hlc", "hod", "Ljava/lang/String;")
                            super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "isEmpty", "()Z", false)
                            super.visitJumpInsn(Opcodes.IFEQ, noPreview)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitFieldInsn(Opcodes.GETFIELD, "a/hlc", "hlz", "Ljava/util/List;")
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/hlc", "hln", "I")
                            super.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "get", "(I)Ljava/lang/Object;", true)
                            super.visitTypeInsn(Opcodes.CHECKCAST, "a/hkv")
                            super.visitFieldInsn(Opcodes.GETFIELD, "a/hkv", "hkz", "La/hks;")
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/hks", "MODULES", "La/hks;")
                            super.visitJumpInsn(Opcodes.IF_ACMPNE, noPreview)
                            super.visitVarInsn(Opcodes.ALOAD, 0)
                            super.visitFieldInsn(Opcodes.GETFIELD, "a/hlc", "hlz", "Ljava/util/List;")
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/hlc", "hln", "I")
                            super.visitMethodInsn(Opcodes.INVOKEINTERFACE, "java/util/List", "get", "(I)Ljava/lang/Object;", true)
                            super.visitTypeInsn(Opcodes.CHECKCAST, "a/hkv")
                            super.visitFieldInsn(Opcodes.GETFIELD, "a/hkv", "hky", "La/kfa;")
                            super.visitFieldInsn(Opcodes.GETSTATIC, "a/kfa", "RENDER", "La/kfa;")
