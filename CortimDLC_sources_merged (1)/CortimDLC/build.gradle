            account.visitVarInsn(Opcodes.FLOAD, 2)
            account.visitInsn(Opcodes.FRETURN)
            account.visitMaxs(1, 4)
            account.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!foundBrandDraw) throw new GradleException("Watermark brand-layout method jnw not found")
    return writer.toByteArray()
}


