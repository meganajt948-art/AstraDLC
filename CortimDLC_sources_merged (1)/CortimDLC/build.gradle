/* Inject the helper without changing the existing movement logic or its control flow. */
def patchPeriodicJumpHooks = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def found = [start: false, end: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            boolean isStart = name == "onStartTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            boolean isEnd = name == "onEndTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            if (isStart) found.start = true
            if (isEnd) found.end = true
            if (!isStart && !isEnd) return mv
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitCode() {
                    super.visitCode()
                    if (isStart) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "before",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                }
                @Override
                void visitInsn(int opcode) {
                    if (isEnd && opcode == Opcodes.RETURN) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "tick",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                    super.visitInsn(opcode)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found.start || !found.end) {
        throw new GradleException("Periodic-hop patch points missing: onStartTick=" + found.start + ", onEndTick=" + found.end)
    }
    return writer.toByteArray()
}

/* Replace any stale Discord invite literal, even when the URL appears in a second click handler. */
def patchDiscordInviteUrls = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, 0)
    String desired = "https://discord.gg/6NZxdgRv"
    boolean changed = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        private Object replaceInvite(Object value) {
            if (!(value instanceof String)) return value
            String text = (String)value
            String lower = text.toLowerCase(java.util.Locale.ROOT)
            if ((lower.contains("discord.gg/") || lower.contains("discord.com/invite/")) &&
                (lower.contains("http") || lower.contains("discord.gg/") || lower.contains("discord.com/invite/"))) {
                if (text != desired) changed = true
                return desired
            }
            return text
        }
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitLdcInsn(Object value) {
                    super.visitLdcInsn(replaceInvite(value))
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (changed) logger.lifecycle("Replaced stale Discord invite with https://discord.gg/6NZxdgRv in " + reader.className)
    return writer.toByteArray()
}

/* Remove only the Reset row from the main-menu wallpaper panel; leave the other controls unchanged. */
def patchRemoveMenuBackgroundReset = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def rowInfo = [:]
    boolean heightFound = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jxt" && descriptor == "(I)F") {
                rowInfo.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return super.visitMethod(access, "albaOriginalBackgroundRowY", descriptor, signature, exceptions)
            }
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "jww" && descriptor == "()F") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        // The previous layout maps three visible rows to 57px, excluding Reset.
                        if (value instanceof Float && Math.abs(((Float)value).floatValue() - 76.0f) < 0.001f) {
                            value = 57.0f
                            heightFound = true
                        }
                        super.visitLdcInsn(value)
                    }
                }
            }
            return mv
        }
        @Override
        void visitEnd() {
            if (rowInfo.isEmpty()) throw new GradleException("Background settings row-position method jxt(I)F not found")
            def info = rowInfo
            MethodVisitor row = writer.visitMethod(info.access, "jxt", info.descriptor, info.signature, info.exceptions as String[])
            row.visitCode()
            org.objectweb.asm.Label keep = new org.objectweb.asm.Label()
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 8)
            row.visitJumpInsn(Opcodes.IF_ICMPNE, keep)
            row.visitLdcInsn(-10000.0f)
            row.visitInsn(Opcodes.FRETURN)
            row.visitLabel(keep)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, ownerClass, "albaOriginalBackgroundRowY", "(I)F", false)
            row.visitInsn(Opcodes.FRETURN)
            row.visitMaxs(0, 0)
            row.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!heightFound) throw new GradleException("Background settings content-height constant 76 not found")
    return writer.toByteArray()
}

/* Clean the watermark only: keep all other HUD elements and toggles available. */
def patchWatermark = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def accountMethod = [:]
    boolean foundBrandDraw = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jnx" && descriptor == "(Lnet/minecraft/class_332;FF)F") {
                accountMethod.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return null
            }
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "jnw" && descriptor == "(Lnet/minecraft/class_332;FFZ)F") {
                foundBrandDraw = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        if (value instanceof Float && Math.abs(((Float)value) - 14.5F) < 0.001F) value = 0.0F
                        if (value == "Flow") value = "AlbaDLC"
                        super.visitLdcInsn(value)
                    }

                    @Override
                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                        if (opcode == Opcodes.INVOKESTATIC && owner == "a/uqe" && methodName == "draw" &&
                            methodDescriptor == "(Lnet/minecraft/class_332;FFFZI)Z") {
                            // Consume the icon-render arguments and report "handled" to skip both logo fallbacks.
                            for (int i = 0; i < 6; i++) super.visitInsn(Opcodes.POP)
                            super.visitInsn(Opcodes.ICONST_1)
                            return
                        }
                        super.visitMethodInsn(opcode, owner, methodName, methodDescriptor, isInterface)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            if (accountMethod.isEmpty()) throw new GradleException("Watermark account-drawing method jnx not found")
            def info = accountMethod
            MethodVisitor account = writer.visitMethod(info.access, "jnx", info.descriptor,
                info.signature, info.exceptions as String[])
            account.visitCode()
            account.visitVarInsn(Opcodes.FLOAD, 2)
            account.visitInsn(Opcodes.FRETURN)
            account.visitMaxs(1, 4)
            account.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!foundBrandDraw) throw new GradleException("Watermark brand-layout method jnw not found")
    return writer.toByteArray()
}


def patchMainMenuSettings = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def replacementMethods = [:]
    boolean foundRender = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if ((name == "jxt" && descriptor == "(I)F") ||
                (name == "jwl" && descriptor == "()F")) {
                replacementMethods[name] = [access: access, descriptor: descriptor, signature: signature, exceptions: exceptions]
                return null
            }

            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "method_25394" && descriptor == "(Lnet/minecraft/class_332;IIF)V") {
                foundRender = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitCode() {
                        super.visitCode()
                        // TITLE is always on; hide the position control and lock centered layout in jwl().
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "TITLE", "La/vkl;")
                        super.visitInsn(Opcodes.ICONST_1)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vkl", "set", "(Z)V", false)
                        // Fixed appearance values: no button blur, 100% rounding, no extra wallpaper dimming.
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "BLUR", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_0)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "ROUND", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_1)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "DIM", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_0)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                    }
                }
            }
            if (name == "jww" && descriptor == "()F") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        // Four visible rows (button style, particles, parallax, reset).
                        if (value instanceof Float && Math.abs(((Float)value) - 171.0F) < 0.001F) value = 76.0F
                        super.visitLdcInsn(value)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            def layout = replacementMethods["jxt"]
            if (layout == null || replacementMethods["jwl"] == null || !foundRender) {
                throw new GradleException("Main-menu settings methods not found: " + replacementMethods.keySet() + ", render=" + foundRender)
            }

            MethodVisitor row = writer.visitMethod(layout.access, "jxt", layout.descriptor,
                layout.signature, layout.exceptions as String[])
            row.visitCode()
            org.objectweb.asm.Label rowButtonStyle = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowParticles = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowParallax = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowReset = new org.objectweb.asm.Label()
            org.objectweb.asm.Label compute = new org.objectweb.asm.Label()
            org.objectweb.asm.Label hidden = new org.objectweb.asm.Label()
            // Logical rows kept: 2 (button style), 6 (particles), 7 (parallax), 8 (reset).
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitInsn(Opcodes.ICONST_2)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowButtonStyle)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 6)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowParticles)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 7)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowParallax)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 8)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowReset)
            row.visitLabel(hidden)
            row.visitLdcInsn(-10000.0F)
            row.visitInsn(Opcodes.FRETURN)
            row.visitLabel(rowButtonStyle)
            row.visitInsn(Opcodes.ICONST_0)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowParticles)
            row.visitInsn(Opcodes.ICONST_1)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowParallax)
            row.visitInsn(Opcodes.ICONST_2)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowReset)
            row.visitInsn(Opcodes.ICONST_3)
            row.visitLabel(compute)
            row.visitVarInsn(Opcodes.ISTORE, 2)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jte", "jwt", "()F", false)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jte", "jwx", "()F", false)
            row.visitInsn(Opcodes.FADD)
            row.visitLdcInsn(13.0F)
            row.visitInsn(Opcodes.FADD)
            row.visitVarInsn(Opcodes.ILOAD, 2)
            row.visitInsn(Opcodes.I2F)
            row.visitLdcInsn(19.0F)
            row.visitInsn(Opcodes.FMUL)
            row.visitInsn(Opcodes.FADD)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jut", "F")
            row.visitInsn(Opcodes.FSUB)
            row.visitInsn(Opcodes.FRETURN)
            row.visitMaxs(0, 0)
            row.visitEnd()

            def position = replacementMethods["jwl"]
            MethodVisitor center = writer.visitMethod(position.access, "jwl", position.descriptor,
                position.signature, position.exceptions as String[])
            center.visitCode()
            // x = (screen width - 138 px button width) / 2 regardless of saved preferences.
            center.visitVarInsn(Opcodes.ALOAD, 0)
            center.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jve", "F")
            center.visitLdcInsn(138.0F)
            center.visitInsn(Opcodes.FSUB)
            center.visitLdcInsn(2.0F)
            center.visitInsn(Opcodes.FDIV)
            center.visitInsn(Opcodes.FRETURN)
            center.visitMaxs(0, 0)
            center.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}

/*
 * Skip Flow2's custom full-screen video splash without replacing the Minecraft
 * loading UI. ClientLoad.show still marks its one-shot request handled, so boot
 * warming continues in the background and no fallback splash is scheduled.
 */
def patchSplashController = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def found = [preview: false, adopt: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "preview" && descriptor == "(Lnet/minecraft/class_310;FZ)V") {
                found.preview = true
                MethodVisitor out = super.visitMethod(access, name, descriptor, signature, exceptions)
                out.visitCode()
                out.visitInsn(Opcodes.RETURN)
                out.visitMaxs(0, 3)
                out.visitEnd()
                return null
            }
            if (name == "adopt" && descriptor == "(Lnet/minecraft/class_310;Z)V") {
                found.adopt = true
                MethodVisitor out = super.visitMethod(access, name, descriptor, signature, exceptions)
                out.visitCode()
                out.visitInsn(Opcodes.RETURN)
                out.visitMaxs(0, 2)
                out.visitEnd()
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
    }
    reader.accept(visitor, 0)
    if (!found.preview || !found.adopt) {
        throw new GradleException("Splash controller methods not found: " + found)
    }
    return writer.toByteArray()
}

