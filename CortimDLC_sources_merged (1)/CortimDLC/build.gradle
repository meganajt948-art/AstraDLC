/* Patch bundled bytecode directly: the decompiled src tree is excluded from compilation. */
def patchButtonSkinQuitDetection = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def found = [method: false]
    def original = [:]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "kes" && descriptor == "(Lnet/minecraft/class_339;)Z") {
                found.method = true
                original.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return super.visitMethod(access, "albaOriginalKes", descriptor, signature, exceptions)
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
        @Override
        void visitEnd() {
            if (!found.method) throw new GradleException("ButtonSkin.kes(widget) not found in " + ownerClass)
            MethodVisitor mv = writer.visitMethod(original.access, "kes", original.descriptor, original.signature, original.exceptions as String[])
            org.objectweb.asm.Label yes = new org.objectweb.asm.Label()
            mv.visitCode()
            mv.visitVarInsn(Opcodes.ALOAD, 0)
            mv.visitMethodInsn(Opcodes.INVOKESTATIC, ownerClass, "albaOriginalKes", original.descriptor, false)
            mv.visitJumpInsn(Opcodes.IFNE, yes)
            mv.visitVarInsn(Opcodes.ALOAD, 0)
            mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_339", "method_25369", "()Lnet/minecraft/class_2561;", false)
            mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "net/minecraft/class_2561", "getString", "()Ljava/lang/String;", false)
            mv.visitVarInsn(Opcodes.ASTORE, 1)
            ["Quit Game", "Exit Game", "Quit", "Выйти из игры", "Выйти"].each { label ->
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitLdcInsn(label)
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "java/lang/String", "equalsIgnoreCase", "(Ljava/lang/String;)Z", false)
                mv.visitJumpInsn(Opcodes.IFNE, yes)
            }
            mv.visitInsn(Opcodes.ICONST_0)
            mv.visitInsn(Opcodes.IRETURN)
            mv.visitLabel(yes)
            mv.visitInsn(Opcodes.ICONST_1)
            mv.visitInsn(Opcodes.IRETURN)
            mv.visitMaxs(0, 0)
            mv.visitEnd()
            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    return writer.toByteArray()
}


