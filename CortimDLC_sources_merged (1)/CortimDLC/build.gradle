                        lastInsnWasIndexLoad = false
                    }

                    @Override void visitIntInsn(int opcode, int operand) {
                        super.visitIntInsn(opcode, operand)
                        lastInsnWasIndexLoad = false
                    }

                    @Override void visitFieldInsn(int opcode, String fieldOwner, String fieldName, String fieldDescriptor) {
                        super.visitFieldInsn(opcode, fieldOwner, fieldName, fieldDescriptor)
                        lastInsnWasIndexLoad = false
                    }

                    @Override void visitTypeInsn(int opcode, String type) {
                        super.visitTypeInsn(opcode, type)
                        lastInsnWasIndexLoad = false
                    }

                    @Override void visitJumpInsn(int opcode, org.objectweb.asm.Label label) {
                        super.visitJumpInsn(opcode, label)
                        lastInsnWasIndexLoad = false
                    }
                }
