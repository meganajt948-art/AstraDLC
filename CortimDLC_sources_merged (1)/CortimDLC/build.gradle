}

/* Omit only the requested modules from registration; their classes and implementations remain bundled. */
def patchModuleRegistration = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
