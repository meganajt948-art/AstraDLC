import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Handle
import org.objectweb.asm.Label
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath "org.ow2.asm:asm:9.7.1" }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

/*
 * Bundle the original client as a nested Fabric mod. Only update its display
 * metadata here; do not rewrite compiled class files during the build.
 */
def flowNestedJar = layout.buildDirectory.file("flow-dependency/flow.jar")
def rebrandedNestedJar = layout.buildDirectory.file("flow-dependency/albadlc-core.jar")
def automaticRecoveredCandidateRoot = layout.buildDirectory.dir("recovered-candidate")
def automaticRecoveredCandidateClasses = layout.buildDirectory.dir("recovered-candidate/classes")
// Keep the original nested Flow runtime as the source of truth. Recovered class
// replacement remains opt-in until the client has been runtime-verified; overlaying
// decompiled classes was causing the startup/menu handoff to hang.
def useAutomaticRecoveredSources =
    providers.gradleProperty("enableRecoveredSourceOverlay").isPresent() &&
    !providers.gradleProperty("recoveredCandidateDir").isPresent() &&
    !providers.gradleProperty("keepNestedFlowJar").isPresent()
def albaVideoFile = layout.buildDirectory.file("flow-dependency/alba-background.mp4")
def albaSourceVideoFile = rootProject.file("../../video-data/alba-background.mp4")
