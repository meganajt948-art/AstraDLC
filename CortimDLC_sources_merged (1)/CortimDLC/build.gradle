        "(Ljava/util/Map;)Ljava/util/Set;", false)
    clinit.visitFieldInsn(Opcodes.PUTSTATIC, "a/AlbaPeriodicHop", "FORCED", "Ljava/util/Set;")
    clinit.visitTypeInsn(Opcodes.NEW, "java/util/Random")
    clinit.visitInsn(Opcodes.DUP)
