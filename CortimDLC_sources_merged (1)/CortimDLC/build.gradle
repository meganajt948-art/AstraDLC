/* Clean the watermark only: keep all other HUD elements and toggles available. */
def patchWatermark = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def accountMethod = [:]
    boolean foundBrandDraw = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "jnx" && descriptor == "(Lnet/minecraft/class_332;FF)F") {
                accountMethod.putAll([access: access, descriptor: descriptor, signature: signature, exceptions: exceptions])
                return null
            }
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            if (name == "jnw" && descriptor == "(Lnet/minecraft/class_332;FFZ)F") {
                foundBrandDraw = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        if (value instanceof Float && Math.abs(((Float)value) - 14.5F) < 0.001F) value = 0.0F
                        if (value == "Flow") value = "AlbaDLC"
                        super.visitLdcInsn(value)
                    }

                    @Override
                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                        if (opcode == Opcodes.INVOKESTATIC && owner == "a/uqe" && methodName == "draw" &&
                            methodDescriptor == "(Lnet/minecraft/class_332;FFFZI)Z") {
                            // Consume the icon-render arguments and report "handled" to skip both logo fallbacks.
                            for (int i = 0; i < 6; i++) super.visitInsn(Opcodes.POP)
                            super.visitInsn(Opcodes.ICONST_1)
                            return
                        }
                        super.visitMethodInsn(opcode, owner, methodName, methodDescriptor, isInterface)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            if (accountMethod.isEmpty()) throw new GradleException("Watermark account-drawing method jnx not found")
            def info = accountMethod
            MethodVisitor account = writer.visitMethod(info.access, "jnx", info.descriptor,
