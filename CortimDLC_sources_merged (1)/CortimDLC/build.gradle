/* Inject the helper without changing the existing movement logic or its control flow. */
def patchPeriodicJumpHooks = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def found = [start: false, end: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
            boolean isStart = name == "onStartTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            boolean isEnd = name == "onEndTick" && descriptor == "(Lnet/minecraft/class_310;)V"
            if (isStart) found.start = true
            if (isEnd) found.end = true
            if (!isStart && !isEnd) return mv
            return new MethodVisitor(Opcodes.ASM9, mv) {
                @Override
                void visitCode() {
                    super.visitCode()
                    if (isStart) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "before",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                }
                @Override
                void visitInsn(int opcode) {
                    if (isEnd && opcode == Opcodes.RETURN) {
                        super.visitVarInsn(Opcodes.ALOAD, 0)
                        super.visitVarInsn(Opcodes.ALOAD, 1)
                        super.visitMethodInsn(Opcodes.INVOKESTATIC, "a/AlbaPeriodicHop", "tick",
                            "(Ljava/lang/Object;Lnet/minecraft/class_310;)V", false)
                    }
                    super.visitInsn(opcode)
                }
            }
        }
    }
    reader.accept(visitor, 0)
    if (!found.start || !found.end) {
        throw new GradleException("Periodic-hop patch points missing: onStartTick=" + found.start + ", onEndTick=" + found.end)
    }
    return writer.toByteArray()
}

