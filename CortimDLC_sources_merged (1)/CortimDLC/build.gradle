/*
 * Make the standalone source build self-contained. The recovered tree uses Yarn names
 * for Minecraft references, while the bundled client uses Fabric intermediary names;
 * compile first, then remap with TinyRemapper before the class-replacement step.
 */
if (useAutomaticRecoveredSources) {
    tasks.register("prepareRecoveredCandidate") {
        group = "build"
        description = "Compile and remap recovered client sources for the standalone AlbaDLC JAR"
        dependsOn("compileRecoveredJava")
        mustRunAfter("clean")
        inputs.dir(layout.buildDirectory.dir("classes/java/recovered"))
        inputs.property("minecraftVersion", project.minecraft_version.toString())
        inputs.property("yarnMappings", project.yarn_mappings.toString())
        outputs.dir(automaticRecoveredCandidateRoot)

        doLast {
            File namedClasses = layout.buildDirectory.dir("classes/java/recovered").get().asFile
            File candidateRoot = automaticRecoveredCandidateRoot.get().asFile
            File toolsDir = new File(candidateRoot, "tools")
            File classesDir = automaticRecoveredCandidateClasses.get().asFile
            File namedClassesJar = new File(candidateRoot, "recovered-named.jar")
            File intermediaryClassesJar = new File(candidateRoot, "recovered-intermediary.jar")
            File remapperJar = new File(toolsDir, "tiny-remapper.jar")
            File yarnJar = new File(toolsDir, "yarn-v2.jar")
            File yarnTiny = new File(toolsDir, "yarn-v2.tiny")
            File intermediaryJar = new File(toolsDir, "intermediary-v2.jar")
            File intermediaryTiny = new File(toolsDir, "intermediary.tiny")
            File officialMinecraftJar = new File(toolsDir, "minecraft-official.jar")
            File intermediaryMinecraftJar = new File(toolsDir, "minecraft-intermediary.jar")
            File namedMinecraftJar = new File(toolsDir, "minecraft-named.jar")
            File versionManifestFile = new File(toolsDir, "version_manifest.json")
            File versionMetadataFile = new File(toolsDir, "minecraft-version.json")

            List<File> sourceClassFiles = []
            if (!namedClasses.isDirectory()) {
                throw new GradleException("Recovered source classes were not compiled: " + namedClasses)
            }
            namedClasses.eachFileRecurse(groovy.io.FileType.FILES) { File item ->
                if (item.isFile() && item.name.endsWith(".class")) sourceClassFiles.add(item)
            }
            if (sourceClassFiles.size() < 500) {
                throw new GradleException("Recovered source compilation produced only " +
                    sourceClassFiles.size() + " class files")
            }
            candidateRoot.mkdirs()
            toolsDir.mkdirs()
            namedClassesJar.withOutputStream { OutputStream fileOut ->
                java.util.zip.ZipOutputStream zip = new java.util.zip.ZipOutputStream(fileOut)
                try {
                    sourceClassFiles.sort { File left, File right -> left.absolutePath <=> right.absolutePath }.each { File item ->
                        String relative = namedClasses.toPath().relativize(item.toPath()).toString()
                            .replace(File.separatorChar, '/' as char)
                        zip.putNextEntry(new java.util.zip.ZipEntry(relative))
                        zip.write(item.bytes)
                        zip.closeEntry()
                    }
                } finally {
                    zip.close()
                }
            }
            logger.lifecycle("Recovered source class files compiled: " + sourceClassFiles.size())

            def download = { String address, File target, long minimumBytes ->
                if (target.isFile() && target.length() >= minimumBytes) return
                target.parentFile.mkdirs()
                File temporary = new File(target.parentFile, target.name + ".download")
                if (temporary.exists()) temporary.delete()
                java.net.URLConnection connection = new java.net.URL(address).openConnection()
                connection.setConnectTimeout(20000)
                connection.setReadTimeout(120000)
                connection.getInputStream().withCloseable { InputStream input ->
                    temporary.withOutputStream { OutputStream output -> input.transferTo(output) }
                }
                if (!temporary.isFile() || temporary.length() < minimumBytes) {
                    temporary.delete()
                    throw new GradleException("Download was empty or truncated: " + address)
                }
                java.nio.file.Files.move(temporary.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            def extractJarEntry = { File source, String entryName, File target ->
                java.util.zip.ZipFile zip = new java.util.zip.ZipFile(source)
                try {
                    java.util.zip.ZipEntry entry = zip.getEntry(entryName)
                    if (entry == null) {
                        throw new GradleException("Missing " + entryName + " inside " + source.name)
                    }
                    target.parentFile.mkdirs()
                    zip.getInputStream(entry).withCloseable { InputStream input ->
                        target.withOutputStream { OutputStream output -> input.transferTo(output) }
                    }
                } finally {
                    zip.close()
                }
            }

            download("https://maven.fabricmc.net/net/fabricmc/tiny-remapper/0.15.0/tiny-remapper-0.15.0-fat.jar",
                remapperJar, 100000)
            String yarnVersion = project.yarn_mappings.toString()
            String minecraftVersion = project.minecraft_version.toString()
            download("https://maven.fabricmc.net/net/fabricmc/yarn/" + yarnVersion +
                "/yarn-" + yarnVersion + "-v2.jar", yarnJar, 100000)
            extractJarEntry(yarnJar, "mappings/mappings.tiny", yarnTiny)
            download("https://maven.fabricmc.net/net/fabricmc/intermediary/" + minecraftVersion +
                "/intermediary-" + minecraftVersion + "-v2.jar", intermediaryJar, 100000)
            extractJarEntry(intermediaryJar, "mappings/mappings.tiny", intermediaryTiny)

            download("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json",
                versionManifestFile, 1000)
            Map manifest = new groovy.json.JsonSlurper().parseText(
                versionManifestFile.getText("UTF-8")) as Map
            Map versionEntry = (manifest.versions as List).find {
                it.id?.toString() == minecraftVersion
            } as Map
            if (versionEntry == null || !versionEntry.url) {
                throw new GradleException("Minecraft version manifest has no entry for " + minecraftVersion)
            }
            download(versionEntry.url.toString(), versionMetadataFile, 1000)
            Map versionMetadata = new groovy.json.JsonSlurper().parseText(
                versionMetadataFile.getText("UTF-8")) as Map
            String clientUrl = versionMetadata.downloads?.client?.url?.toString()
            if (!clientUrl) throw new GradleException("Minecraft client download URL is missing")
            download(clientUrl, officialMinecraftJar, 1000000)

            String javaName = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
                ? "java.exe" : "java"
            File javaExecutable = new File(new File(System.getProperty("java.home"), "bin"), javaName)
            if (!javaExecutable.isFile()) {
                throw new GradleException("Java executable for remapping was not found: " + javaExecutable)
            }
            def runRemapper = { List<String> arguments ->
                List<String> command = [javaExecutable.absolutePath, "-Xmx3g",
                    "-jar", remapperJar.absolutePath] + arguments
                logger.lifecycle("Running TinyRemapper: " + arguments[0] + " -> " + arguments[1])
                Process process = new ProcessBuilder(command)
                    .directory(project.rootDir)
                    .inheritIO()
                    .start()
                int exitCode = process.waitFor()
                if (exitCode != 0) {
                    throw new GradleException("TinyRemapper failed with exit code " + exitCode +
                        " for input " + arguments[0])
                }
            }

            runRemapper([
                officialMinecraftJar.absolutePath, intermediaryMinecraftJar.absolutePath,
                intermediaryTiny.absolutePath, "official", "intermediary", "--ignoreConflicts"
            ])
            runRemapper([
                intermediaryMinecraftJar.absolutePath, namedMinecraftJar.absolutePath,
                yarnTiny.absolutePath, "intermediary", "named", "--ignoreConflicts"
            ])
            runRemapper([
                namedClassesJar.absolutePath, intermediaryClassesJar.absolutePath,
                yarnTiny.absolutePath, "named", "intermediary", namedMinecraftJar.absolutePath,
                "--resolveMissing"
            ])

            if (classesDir.exists()) project.delete(classesDir)
            classesDir.mkdirs()
            java.util.zip.ZipFile remappedZip = new java.util.zip.ZipFile(intermediaryClassesJar)
            int remappedCount = 0
            try {
                java.util.Enumeration<? extends java.util.zip.ZipEntry> entries = remappedZip.entries()
                while (entries.hasMoreElements()) {
                    java.util.zip.ZipEntry entry = entries.nextElement()
                    if (entry.isDirectory() || !entry.name.endsWith(".class")) continue
                    File target = new File(classesDir, entry.name)
                    String canonicalRoot = classesDir.canonicalPath + File.separator
                    if (!target.canonicalPath.startsWith(canonicalRoot)) {
                        throw new GradleException("Unsafe class path in recovered archive: " + entry.name)
                    }
                    target.parentFile.mkdirs()
                    remappedZip.getInputStream(entry).withCloseable { InputStream input ->
                        target.withOutputStream { OutputStream output -> input.transferTo(output) }
                    }
                    remappedCount++
                }
            } finally {
                remappedZip.close()
            }
            if (remappedCount < 500) {
                throw new GradleException("Remapping produced only " + remappedCount + " recovered classes")
            }
            logger.lifecycle("Recovered classes remapped to intermediary names: " + remappedCount)
        }
    }
    tasks.named("rebrandFlowNestedJar") {
        dependsOn("prepareRecoveredCandidate")
    }
}

// Build trigger: October 25 keep search clear of the header label; preserve bottom-left controls.

// Build trigger: periodic walking jumps for AutoWarden and AutoEnd (24 October 2026).

// Build trigger: AutoWarden and AutoEnd configured teleport commands plus periodic hops (24 October 2026).

// Build trigger: ensure the command-fix release workflow runs with the updated release tag.


/*
 * Local/default builds should produce the same standalone client as the CI candidate
 * workflow. Use -PkeepNestedFlowJar only in workflows that explicitly need to inspect
 * the intermediate outer JAR before the recovered client is flattened into it.
 */
def flattenAlbaStandaloneJar = tasks.register("flattenAlbaStandaloneJar") {
    group = "build"
    description = "Flatten the rebranded client into AlbaDLC's main JAR and remove flow.jar"
    doLast {
        if (project.hasProperty("keepNestedFlowJar")) {
            logger.lifecycle("Keeping the intermediate nested client because -PkeepNestedFlowJar was supplied")
            return
        }

        File sourceFile = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar").get().asFile
        if (!sourceFile.isFile()) {
            throw new GradleException("Built AlbaDLC JAR is missing: " + sourceFile)
        }
        final String nestedPath = "META-INF/jars/flow.jar"
        File tempFile = new File(sourceFile.parentFile, sourceFile.name + ".standalone.tmp")
        if (tempFile.exists()) tempFile.delete()

        def listify = { Object value ->
            if (value == null) return []
            if (value instanceof Collection) return new ArrayList(value as Collection)
            return [value]
        }
        def mergeList = { Object base, Object addition ->
            List result = listify(base)
            for (Object item : listify(addition)) {
                if (!result.contains(item)) result.add(item)
            }
            return result
        }
        def mergeEntryPoints = { Object base, Object addition ->
            Map result = new LinkedHashMap((base instanceof Map) ? base as Map : [:])
            Map more = (addition instanceof Map) ? addition as Map : [:]
            more.each { key, value ->
                result[key] = mergeList(result[key], value)
            }
            return result
        }
        def mergeConstraints = { Object base, Object addition, String fieldName ->
            Map result = new LinkedHashMap((base instanceof Map) ? base as Map : [:])
            Map more = (addition instanceof Map) ? addition as Map : [:]
            more.each { key, value ->
                if (!result.containsKey(key)) {
                    result[key] = value
                } else if (result[key] != value) {
                    logger.lifecycle("Outer metadata wins duplicate constraint: " + fieldName + " " + key)
                }
            }
            return result
        }
        def readEntry = { byte[] archiveBytes, String wantedName ->
            java.util.zip.ZipInputStream input = new java.util.zip.ZipInputStream(
                new java.io.ByteArrayInputStream(archiveBytes))
            try {
                java.util.zip.ZipEntry entry
                while ((entry = input.nextEntry) != null) {
                    if (entry.name == wantedName) return input.readAllBytes()
                }
            } finally {
                input.close()
            }
            throw new GradleException("Missing " + wantedName + " in the nested client")
        }

        try {
            // Share validation counters across the copy and post-copy validation blocks.
            List<String> entrypointClasses = []
            List<String> skippedDuplicates = []
            int copiedClasses = 0
            int copiedResources = 0
            java.util.zip.ZipFile outer = new java.util.zip.ZipFile(sourceFile)
            try {
                java.util.zip.ZipEntry nestedEntry = outer.getEntry(nestedPath)
                if (nestedEntry == null) {
                    throw new GradleException("Expected intermediate nested client at " + nestedPath)
                }
                byte[] innerBytes = outer.getInputStream(nestedEntry).withCloseable { it.readAllBytes() }
                byte[] outerMetadataBytes = outer.getInputStream(outer.getEntry("fabric.mod.json")).withCloseable {
                    it.readAllBytes()
                }
                Map outerMetadata = new groovy.json.JsonSlurper().parseText(new String(outerMetadataBytes, "UTF-8")) as Map
                Map innerMetadata = new groovy.json.JsonSlurper().parseText(
                    new String(readEntry(innerBytes, "fabric.mod.json"), "UTF-8")) as Map
                String innerId = innerMetadata.id == null ? null : innerMetadata.id.toString()

                Map merged = new LinkedHashMap(outerMetadata)
                merged.entrypoints = mergeEntryPoints(merged.entrypoints, innerMetadata.entrypoints)
                ["depends", "recommends", "suggests", "breaks", "conflicts"].each { String fieldName ->
                    merged[fieldName] = mergeConstraints(merged[fieldName], innerMetadata[fieldName], fieldName)
                    if (!merged[fieldName]) merged.remove(fieldName)
                }
                ["mixins", "jars", "provides", "authors", "contributors"].each { String fieldName ->
                    if (innerMetadata.containsKey(fieldName)) {
                        merged[fieldName] = mergeList(merged[fieldName], innerMetadata[fieldName])
                    }
                }
                if (merged.jars != null) {
                    List remainingJars = listify(merged.jars).findAll { Object item ->
                        if (item instanceof Map) return item.file != nestedPath
                        return item != nestedPath
                    }
                    if (remainingJars) merged.jars = remainingJars
                    else merged.remove("jars")
                }
                if (innerId && innerId != merged.id) {
                    merged.provides = mergeList(merged.provides, [innerId])
                }
                ["languageAdapters", "custom"].each { String fieldName ->
                    if (innerMetadata[fieldName] instanceof Map) {
                        Map result = new LinkedHashMap((merged[fieldName] instanceof Map) ? merged[fieldName] as Map : [:])
                        (innerMetadata[fieldName] as Map).each { key, value ->
                            if (!result.containsKey(key)) result[key] = value
                            else if (result[key] != value) logger.lifecycle(
                                "Outer metadata wins duplicate field: " + fieldName + " " + key)
                        }
                        merged[fieldName] = result
                    }
                }
                ["accessWidener", "icon", "license", "contact", "environment"].each { String fieldName ->
                    if (!merged.containsKey(fieldName) && innerMetadata.containsKey(fieldName)) {
                        merged[fieldName] = innerMetadata[fieldName]
                    } else if (fieldName == "environment" && merged[fieldName] == "*" &&
                        innerMetadata[fieldName] in ["client", "server"]) {
                        merged[fieldName] = innerMetadata[fieldName]
                    }
                }
                if (!(merged.entrypoints instanceof Map) || merged.entrypoints.isEmpty()) {
                    throw new GradleException("No Fabric entrypoints remain after metadata merge")
                }
                if (merged.id != "albadlc") {
                    throw new GradleException("Unexpected root Fabric mod id: " + merged.id)
                }

                merged.entrypoints.values().each { Object group ->
                    listify(group).each { Object spec ->
                        String className = null
                        if (spec instanceof String) className = (spec as String).split("::", 2)[0]
                        else if (spec instanceof Map && spec.value instanceof String) {
                            className = (spec.value as String).split("::", 2)[0]
                        }
                        if (className && className.contains(".")) {
                            entrypointClasses.add(className.replace(".", "/") + ".class")
                        }
                    }
                }

                Set<String> seen = new LinkedHashSet<>()
                byte[] mergedMetadataBytes = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(merged)).getBytes("UTF-8")
                java.util.zip.ZipOutputStream output = new java.util.zip.ZipOutputStream(
                    new java.io.BufferedOutputStream(new FileOutputStream(tempFile)))
                output.setLevel(6)
                try {
                    java.util.Enumeration outerEntries = outer.entries()
                    while (outerEntries.hasMoreElements()) {
                        java.util.zip.ZipEntry entry = outerEntries.nextElement() as java.util.zip.ZipEntry
                        if (entry.name == nestedPath || entry.name.endsWith("/")) continue
                        byte[] payload = entry.name == "fabric.mod.json" ? mergedMetadataBytes :
                            outer.getInputStream(entry).withCloseable { it.readAllBytes() }
                        java.util.zip.ZipEntry targetEntry = new java.util.zip.ZipEntry(entry.name)
                        if (entry.time > 0) targetEntry.time = entry.time
                        output.putNextEntry(targetEntry)
                        output.write(payload)
                        output.closeEntry()
                        seen.add(entry.name)
                    }

                    java.util.zip.ZipInputStream inner = new java.util.zip.ZipInputStream(
                        new java.io.ByteArrayInputStream(innerBytes))
                    try {
                        java.util.zip.ZipEntry entry
                        while ((entry = inner.nextEntry) != null) {
                            String name = entry.name
                            if (name.endsWith("/") || name == "fabric.mod.json" ||
                                name.toUpperCase(Locale.ROOT) == "META-INF/MANIFEST.MF") continue
                            String upperName = name.toUpperCase(Locale.ROOT)
                            if (upperName.startsWith("META-INF/") &&
                                upperName.endsWith(".SF") || upperName.startsWith("META-INF/") &&
                                upperName.endsWith(".RSA") || upperName.startsWith("META-INF/") &&
                                upperName.endsWith(".DSA") || upperName.startsWith("META-INF/") &&
                                upperName.endsWith(".EC")) continue

                            byte[] payload = inner.readAllBytes()
                            if (seen.contains(name)) {
                                skippedDuplicates.add(name)
                                if (name.endsWith(".class")) {
                                    throw new GradleException("Class path collision while flattening: " + name)
                                }
                                continue
                            }
                            java.util.zip.ZipEntry targetEntry = new java.util.zip.ZipEntry(name)
                            if (entry.time > 0) targetEntry.time = entry.time
                            output.putNextEntry(targetEntry)
                            output.write(payload)
                            output.closeEntry()
                            seen.add(name)
                            if (name.endsWith(".class")) copiedClasses++
                            else copiedResources++
                        }
                    } finally {
                        inner.close()
                    }
                } finally {
                    output.close()
                }
            } finally {
                outer.close()
            }

            java.util.zip.ZipFile check = new java.util.zip.ZipFile(tempFile)
            try {
                Set<String> resultNames = new HashSet<>()
                java.util.Enumeration entries = check.entries()
                while (entries.hasMoreElements()) resultNames.add((entries.nextElement() as java.util.zip.ZipEntry).name)
                if (resultNames.contains(nestedPath) || resultNames.any { it.endsWith("/flow.jar") }) {
                    throw new GradleException("Standalone archive still contains flow.jar")
                }
                Map rootMetadata = new groovy.json.JsonSlurper().parseText(
                    new String(check.getInputStream(check.getEntry("fabric.mod.json")).withCloseable {
                        it.readAllBytes()
                    }, "UTF-8")) as Map
                for (Object item : listify(rootMetadata.jars)) {
                    String nestedName = item instanceof Map ? item.file?.toString() : item?.toString()
                    if (nestedName && !resultNames.contains(nestedName)) {
                        throw new GradleException("Fabric metadata points to missing nested JAR: " + nestedName)
                    }
                }
                if (!resultNames.any { it.startsWith("a/") && it.endsWith(".class") } ||
                    !resultNames.any { it.startsWith("flow/") && it.endsWith(".class") }) {
                    throw new GradleException("Standalone archive is missing client package classes")
                }
                List<String> missingEntrypoints = entrypointClasses.findAll { !resultNames.contains(it) }
                if (missingEntrypoints) {
                    throw new GradleException("Missing Fabric entrypoint classes: " + missingEntrypoints.join(", "))
                }
                logger.lifecycle("Standalone archive validation passed")
                logger.lifecycle("Flattened client classes copied: " + copiedClasses)
                logger.lifecycle("Flattened client resources copied: " + copiedResources)
                logger.lifecycle("Duplicate resource paths skipped: " + skippedDuplicates.size())
            } finally {
                check.close()
            }

            java.nio.file.Files.move(tempFile.toPath(), sourceFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("Built standalone AlbaDLC output: " + sourceFile)
        } catch (Throwable throwable) {
            tempFile.delete()
            throw throwable
        }
    }
}

tasks.named("build") {
    finalizedBy(flattenAlbaStandaloneJar)
}
