/*
 * Keep the wallpaper selector focused on wallpapers only. Remove the separate
 * persistent menu-look panel and all invisible interaction remapping for it.
 */
def patchWallpaperPickerPersistentSettings = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String ownerClass = reader.className
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    def found = [render: false, picker: false, pickerBounds: false, pickerHitbox: false,
                 click: false, drag: false, scroll: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)

            if (name == "method_25394" && descriptor == "(Lnet/minecraft/class_332;IIF)V") {
                found.render = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                        // Do not render the former persistent settings panel.
                    }
                }
            }

            if (name == "jxd") {
                found.picker = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    private boolean hideMenuLookHeader = false
                    @Override
                    void visitLdcInsn(Object value) {
                        if (value instanceof String && ((String)value) == "Menu look") {
                            hideMenuLookHeader = true
                            super.visitLdcInsn("")
                            return
                        }
                        if (value instanceof String && ((String)value) == "Вид меню") {
                            super.visitLdcInsn("")
                            return
                        }
                        super.visitLdcInsn(value)
                    }
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (hideMenuLookHeader && opcode == Opcodes.INVOKESTATIC &&
                            callOwner == "a/DrawUtil" && callName == "rect" &&
                            callDescriptor == "(Lnet/minecraft/class_332;FFFFI)V") {
                            // The rule after the second heading belongs to the removed Menu look section.
                            for (int i = 0; i < 6; i++) super.visitInsn(Opcodes.POP)
                            hideMenuLookHeader = false
                            return
                        }
                        if (callOwner == ownerClass && callName == "jyb" &&
                            callDescriptor == "(Lnet/minecraft/class_332;FFZ)V") {
                            // Settings are drawn by albaRenderPersistentSettingsRaw, not in the wallpaper popover.
                            for (int i = 0; i < 5; i++) super.visitInsn(Opcodes.POP)
                            return
                        }
                        if (callOwner == ownerClass && callDescriptor == "()F") {
                            if (callName == "jws") callName = "albaWallpaperPanelHeight"
                            else if (callName == "jwu") callName = "albaWallpaperViewportHeight"
                            else if (callName == "jwy") callName = "albaWallpaperMaxScroll"
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }

            if (name == "jxb" && descriptor == "(FF)Z") {
                found.pickerBounds = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (callOwner == ownerClass && callName == "jws" && callDescriptor == "()F") {
                            super.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "albaWallpaperPanelHeight", "()F", false)
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }

            if (name == "jxc" && descriptor == "(FF)I") {
                found.pickerHitbox = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (callOwner == ownerClass && callName == "jwu" && callDescriptor == "()F") {
                            super.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "albaWallpaperViewportHeight", "()F", false)
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }

            if (name == "method_25402" && descriptor == "(Lnet/minecraft/class_11909;Z)Z") {
                found.click = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitVarInsn(int opcode, int var) {
                        super.visitVarInsn(opcode, var)
                    }
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (callOwner == ownerClass && callDescriptor == "()F") {
                            if (callName == "jwy") callName = "albaWallpaperMaxScroll"
                            else if (callName == "jwu") callName = "albaWallpaperViewportHeight"
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }

            if (name == "method_25403" && descriptor == "(Lnet/minecraft/class_11909;DD)Z") {
                found.drag = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }

            if (name == "method_25401" && descriptor == "(DDDD)Z") {
                found.scroll = true
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        if (callOwner == ownerClass && callName == "jwy" && callDescriptor == "()F") {
                            super.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "albaWallpaperMaxScroll", "()F", false)
                            return
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
            return mv
        }

        @Override
