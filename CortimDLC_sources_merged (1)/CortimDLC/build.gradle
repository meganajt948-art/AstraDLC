            if (name == "method_25394" && descriptor == "(Lnet/minecraft/class_332;IIF)V") {
                return new MethodVisitor(Opcodes.ASM9, super.visitMethod(access, name, descriptor, signature, exceptions)) {
                    boolean titleStepForced = false
                    @Override void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                        // Always render the AlbaDLC wordmark even on wallpaper entries with a logo badge.
                        if (!titleStepForced && callOwner == "a/vcj" && callName == "step" && callDescriptor == "(ZF)F") {
                            super.visitVarInsn(Opcodes.FSTORE, 100)
                            super.visitInsn(Opcodes.POP)
                            super.visitInsn(Opcodes.ICONST_1)
                            super.visitVarInsn(Opcodes.FLOAD, 100)
                            titleStepForced = true
                            found.titleAlways = true
                        }
                        super.visitMethodInsn(opcode, callOwner, callName, callDescriptor, isInterface)
                    }
                }
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
    }
    reader.accept(visitor, 0)
    if (!found.positions || !found.iconRender || !found.iconClick || !found.exitLink || !found.titleAlways) {
        throw new GradleException("Main-menu controls patch points missing in " + ownerClass + ": " + found)
    }
    return writer.toByteArray()
}

def patchSplashController = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS)
    def found = [preview: false, adopt: false]
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "preview" && descriptor == "(Lnet/minecraft/class_310;FZ)V") {
                found.preview = true
                MethodVisitor out = super.visitMethod(access, name, descriptor, signature, exceptions)
                out.visitCode()
                out.visitInsn(Opcodes.RETURN)
                out.visitMaxs(0, 3)
                out.visitEnd()
                return null
            }
            if (name == "adopt" && descriptor == "(Lnet/minecraft/class_310;Z)V") {
                found.adopt = true
                MethodVisitor out = super.visitMethod(access, name, descriptor, signature, exceptions)
                out.visitCode()
                out.visitInsn(Opcodes.RETURN)
                out.visitMaxs(0, 2)
                out.visitEnd()
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
    }
    reader.accept(visitor, 0)
    if (!found.preview || !found.adopt) {
        throw new GradleException("Splash controller methods not found: " + found)
    }
    return writer.toByteArray()
}

