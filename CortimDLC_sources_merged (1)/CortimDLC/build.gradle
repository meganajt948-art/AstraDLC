/*
 * If the optional GPU scene pipeline is unavailable, draw the selected wallpaper
 * texture directly instead of returning with a blank title-screen background.
 * For video wallpapers, MenuArtCache supplies the current frame when available
 * and the poster image as its fallback.
 */
/*
 * Detect the menu-scene renderer by its method/field shape. The nested client
 * obfuscates the class name, so do not rely on a source-file/class-file name.
 */
def isMenuSceneRendererClass = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    def found = [draw: false, prepare: false, alpha: false, texture: false]
    def visitor = new ClassVisitor(Opcodes.ASM9) {
        @Override
        org.objectweb.asm.FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
            if (name == "kav" && descriptor == "La/uok;") found.texture = true
            return null
        }

        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "draw" && descriptor == "(Lnet/minecraft/class_332;La/jza;La/kam;FFFZ)Z") found.draw = true
            if (name == "kbi" && descriptor == "(La/jza;La/kam;Z)Z") found.prepare = true
            if (name == "kbl" && descriptor == "(F)I") found.alpha = true
            return null
        }
    }
    reader.accept(visitor, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
    return found.draw && found.prepare && found.alpha && found.texture
}

/*
 * If the optional GPU scene pipeline is unavailable, draw the selected wallpaper
 * texture directly instead of returning with a blank title-screen background.
 * Capture the original texture-draw helper from the class itself, so this patch
 * works even when the client uses an obfuscated class/helper name.
 */
def patchMenuSceneRendererFallback = { byte[] bytes ->
    def reader = new ClassReader(bytes)
    String owner = reader.className
    def drawHelper = [opcode: -1, owner: null, name: null, descriptor: "(Lnet/minecraft/class_332;Lcom/mojang/blaze3d/textures/GpuTextureView;FFFFFI)V", isInterface: false]
    reader.accept(new ClassVisitor(Opcodes.ASM9) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name != "draw" || descriptor != "(Lnet/minecraft/class_332;La/jza;La/kam;FFFZ)Z") return null
            return new MethodVisitor(Opcodes.ASM9) {
                @Override
                void visitMethodInsn(int opcode, String callOwner, String callName, String callDescriptor, boolean isInterface) {
                    if (callDescriptor == drawHelper.descriptor &&
                        (opcode == Opcodes.INVOKESTATIC || opcode == Opcodes.INVOKEINTERFACE || opcode == Opcodes.INVOKEVIRTUAL)) {
                        drawHelper.opcode = opcode
                        drawHelper.owner = callOwner
                        drawHelper.name = callName
                        drawHelper.isInterface = isInterface
                    }
                }
            }
        }
    }, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
    if (drawHelper.opcode < 0 || drawHelper.owner == null || drawHelper.name == null) {
        throw new GradleException("Could not discover the original GpuTextureView draw helper in " + owner)
    }

    def writer = new ClassWriter(reader, ClassWriter.COMPUTE_FRAMES | ClassWriter.COMPUTE_MAXS) {
        @Override protected String getCommonSuperClass(String type1, String type2) { return "java/lang/Object" }
    }
    boolean found = false
    def visitor = new ClassVisitor(Opcodes.ASM9, writer) {
        @Override
        MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
            if (name == "draw" && descriptor == "(Lnet/minecraft/class_332;La/jza;La/kam;FFFZ)Z") {
                found = true
                MethodVisitor mv = super.visitMethod(access, name, descriptor, signature, exceptions)
                mv.visitCode()
                // Use the source frame/poster directly on every frame. The custom scene
                // shader was intermittently flashing/blanking on some drivers even when its
                // precompile call reported success. This avoids that off-screen GPU pass.
                org.objectweb.asm.Label noTexture = new org.objectweb.asm.Label()
                mv.visitVarInsn(Opcodes.ALOAD, 2)
                mv.visitJumpInsn(Opcodes.IFNULL, noTexture)
                mv.visitVarInsn(Opcodes.ALOAD, 1)
                mv.visitVarInsn(Opcodes.ALOAD, 2)
                mv.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jza", "sharp", "()La/uok;", false)
                mv.visitFieldInsn(Opcodes.GETFIELD, "a/uok", "view", "Lcom/mojang/blaze3d/textures/GpuTextureView;")
                mv.visitInsn(Opcodes.FCONST_0)
                mv.visitInsn(Opcodes.FCONST_0)
                mv.visitVarInsn(Opcodes.FLOAD, 4)
                mv.visitVarInsn(Opcodes.FLOAD, 5)
                mv.visitInsn(Opcodes.FCONST_0)
                mv.visitInsn(Opcodes.ICONST_M1)
                mv.visitMethodInsn(drawHelper.opcode, drawHelper.owner, drawHelper.name,
                    drawHelper.descriptor, drawHelper.isInterface)
                mv.visitInsn(Opcodes.ICONST_1)
                mv.visitInsn(Opcodes.IRETURN)
                mv.visitLabel(noTexture)
                mv.visitInsn(Opcodes.ICONST_0)
                mv.visitInsn(Opcodes.IRETURN)
                mv.visitMaxs(0, 0)
                mv.visitEnd()
                return null
            }
            return super.visitMethod(access, name, descriptor, signature, exceptions)
        }
    }
    reader.accept(visitor, 0)
    if (!found) throw new GradleException("Menu scene renderer draw method not found in " + owner)
    return writer.toByteArray()
}

