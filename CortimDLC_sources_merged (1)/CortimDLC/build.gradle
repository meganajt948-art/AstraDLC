 * wrapper-only JAR. The decompiled Flow tree (package a/ and flow/) stays out
 * of compilation until its intermediary Minecraft symbols and missing recovered
 * classes have been resolved; keeping flow.jar bundled preserves the working
 * runtime while those sources are brought back incrementally.
 */
