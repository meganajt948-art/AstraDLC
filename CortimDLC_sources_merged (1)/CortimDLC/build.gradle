            if (!found.render || !found.picker || !found.pickerBounds || !found.pickerHitbox ||
                !found.click || !found.drag || !found.scroll) {
                throw new GradleException("Wallpaper/settings separation patch points missing in " + ownerClass + ": " + found)
            }

            // Helpers used only by the wallpaper selector; the original jw* methods remain available
            // for the relocated menu-look controls and their hit-testing.
            MethodVisitor panelH = writer.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_SYNTHETIC,
                "albaWallpaperPanelHeight", "()F", null, null)
            panelH.visitCode()
            panelH.visitVarInsn(Opcodes.ALOAD, 0)
            panelH.visitFieldInsn(Opcodes.GETFIELD, ownerClass, "jvf", "F")
            panelH.visitVarInsn(Opcodes.ALOAD, 0)
            panelH.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "jwr", "()F", false)
            panelH.visitInsn(Opcodes.FSUB)
            panelH.visitLdcInsn(12.0f)
            panelH.visitInsn(Opcodes.FSUB)
            panelH.visitVarInsn(Opcodes.ALOAD, 0)
            panelH.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "jwx", "()F", false)
            panelH.visitLdcInsn(24.0f)
            panelH.visitInsn(Opcodes.FADD)
            panelH.visitLdcInsn(6.0f)
            panelH.visitInsn(Opcodes.FADD)
            panelH.visitMethodInsn(Opcodes.INVOKESTATIC, "java/lang/Math", "min", "(FF)F", false)
            panelH.visitInsn(Opcodes.FRETURN)
            panelH.visitMaxs(0, 0)
            panelH.visitEnd()

            MethodVisitor viewport = writer.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_SYNTHETIC,
                "albaWallpaperViewportHeight", "()F", null, null)
            viewport.visitCode()
            viewport.visitVarInsn(Opcodes.ALOAD, 0)
            viewport.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "albaWallpaperPanelHeight", "()F", false)
            viewport.visitLdcInsn(28.0f)
            viewport.visitInsn(Opcodes.FSUB)
            viewport.visitInsn(Opcodes.FRETURN)
            viewport.visitMaxs(0, 0)
            viewport.visitEnd()

            MethodVisitor maxScroll = writer.visitMethod(Opcodes.ACC_PRIVATE | Opcodes.ACC_SYNTHETIC,
                "albaWallpaperMaxScroll", "()F", null, null)
            maxScroll.visitCode()
            maxScroll.visitVarInsn(Opcodes.ALOAD, 0)
            maxScroll.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "jwx", "()F", false)
            maxScroll.visitVarInsn(Opcodes.ALOAD, 0)
            maxScroll.visitMethodInsn(Opcodes.INVOKESPECIAL, ownerClass, "albaWallpaperViewportHeight", "()F", false)
            maxScroll.visitInsn(Opcodes.FSUB)
            maxScroll.visitInsn(Opcodes.FCONST_0)
            maxScroll.visitMethodInsn(Opcodes.INVOKESTATIC, "java/lang/Math", "max", "(FF)F", false)
            maxScroll.visitInsn(Opcodes.FRETURN)
            maxScroll.visitMaxs(0, 0)
            maxScroll.visitEnd()

            super.visitEnd()
        }
    }
    reader.accept(visitor, 0)
    if (!found.render || !found.picker || !found.pickerBounds || !found.pickerHitbox ||
        !found.click || !found.drag || !found.scroll) {
        throw new GradleException("Wallpaper/settings separation patch points missing in " + ownerClass + ": " + found)
    }
    logger.lifecycle("Wallpaper picker shows wallpapers only; removed persistent menu-look panel and hidden interaction handlers")
