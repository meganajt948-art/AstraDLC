                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "BLUR", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_0)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "ROUND", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_1)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                        super.visitFieldInsn(Opcodes.GETSTATIC, "a/kbm", "DIM", "La/vmc;")
                        super.visitInsn(Opcodes.DCONST_0)
                        super.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/vmc", "set", "(D)V", false)
                    }
                }
            }
            if (name == "jww" && descriptor == "()F") {
                return new MethodVisitor(Opcodes.ASM9, mv) {
                    @Override
                    void visitLdcInsn(Object value) {
                        // Four visible rows (button style, particles, parallax, reset).
                        if (value instanceof Float && Math.abs(((Float)value) - 171.0F) < 0.001F) value = 76.0F
                        super.visitLdcInsn(value)
                    }
                }
            }
            return mv
        }

        @Override
        void visitEnd() {
            def layout = replacementMethods["jxt"]
            if (layout == null || replacementMethods["jwl"] == null || !foundRender) {
                throw new GradleException("Main-menu settings methods not found: " + replacementMethods.keySet() + ", render=" + foundRender)
            }

            MethodVisitor row = writer.visitMethod(layout.access, "jxt", layout.descriptor,
                layout.signature, layout.exceptions as String[])
            row.visitCode()
            org.objectweb.asm.Label rowButtonStyle = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowParticles = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowParallax = new org.objectweb.asm.Label()
            org.objectweb.asm.Label rowReset = new org.objectweb.asm.Label()
            org.objectweb.asm.Label compute = new org.objectweb.asm.Label()
            org.objectweb.asm.Label hidden = new org.objectweb.asm.Label()
            // Logical rows kept: 2 (button style), 6 (particles), 7 (parallax), 8 (reset).
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitInsn(Opcodes.ICONST_2)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowButtonStyle)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 6)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowParticles)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 7)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowParallax)
            row.visitVarInsn(Opcodes.ILOAD, 1)
            row.visitIntInsn(Opcodes.BIPUSH, 8)
            row.visitJumpInsn(Opcodes.IF_ICMPEQ, rowReset)
            row.visitLabel(hidden)
            row.visitLdcInsn(-10000.0F)
            row.visitInsn(Opcodes.FRETURN)
            row.visitLabel(rowButtonStyle)
            row.visitInsn(Opcodes.ICONST_0)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowParticles)
            row.visitInsn(Opcodes.ICONST_1)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowParallax)
            row.visitInsn(Opcodes.ICONST_2)
            row.visitJumpInsn(Opcodes.GOTO, compute)
            row.visitLabel(rowReset)
            row.visitInsn(Opcodes.ICONST_3)
            row.visitLabel(compute)
            row.visitVarInsn(Opcodes.ISTORE, 2)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jte", "jwt", "()F", false)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitMethodInsn(Opcodes.INVOKEVIRTUAL, "a/jte", "jwx", "()F", false)
            row.visitInsn(Opcodes.FADD)
            row.visitLdcInsn(13.0F)
            row.visitInsn(Opcodes.FADD)
            row.visitVarInsn(Opcodes.ILOAD, 2)
            row.visitInsn(Opcodes.I2F)
            row.visitLdcInsn(19.0F)
            row.visitInsn(Opcodes.FMUL)
            row.visitInsn(Opcodes.FADD)
            row.visitVarInsn(Opcodes.ALOAD, 0)
            row.visitFieldInsn(Opcodes.GETFIELD, "a/jte", "jut", "F")
            row.visitInsn(Opcodes.FSUB)
            row.visitInsn(Opcodes.FRETURN)
            row.visitMaxs(0, 0)
            row.visitEnd()

            def position = replacementMethods["jwl"]
            MethodVisitor center = writer.visitMethod(position.access, "jwl", position.descriptor,
